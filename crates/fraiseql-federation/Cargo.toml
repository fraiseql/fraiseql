[package]
description = "Apollo Federation v2 support for FraiseQL — entity resolution, multi-subgraph composition"
name = "fraiseql-federation"
readme = "README.md"
authors.workspace = true
categories.workspace = true
documentation.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[[bench]]
harness = false
name = "federation_bench"

[dependencies]
fraiseql-guard = { workspace = true }
dashmap = { workspace = true }
fraiseql-db = { workspace = true, default-features = false }
fraiseql-error = { workspace = true, default-features = false }
lru = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
zeroize = "1.8"

[dev-dependencies]
# The lib tests build lookup SQL for PostgreSQL and use `FailingAdapter` from
# fraiseql-test-utils as the local `DatabaseAdapter`.
fraiseql-db = { workspace = true, default-features = false, features = [
  "postgres",
] }
fraiseql-test-utils = { path = "../fraiseql-test-utils" }
criterion = { version = "0.5", features = ["html_reports"] }
proptest = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"

[features]
# # Exposes test-helper constructors (e.g. `HttpEntityResolver::new_for_test`).
# # Never enable in production — these bypass security checks.
test-utils = []

[lints]
workspace = true

# docs.rs builds a crate with its DEFAULT features unless told otherwise, so the published
# page showed none of the feature-gated API — and this workspace's documentation links
# into that API from prose that is not gated (#1199). `all-features` makes the published
# page the whole crate.
[package.metadata.docs.rs]
all-features = true

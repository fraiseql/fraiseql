[dependencies]
# Async runtime
async-trait = {workspace = true}
bytes = {workspace = true}
chrono = {workspace = true}
dashmap = {workspace = true}
deadpool = {workspace = true, optional = true}
deadpool-postgres = {workspace = true, optional = true}
# Error types
fraiseql-error = {workspace = true}
# Wire protocol (optional)
fraiseql-wire = {workspace = true, optional = true}
futures = {workspace = true}
regex = {workspace = true}
# PostgreSQL transport security (#801/#824). Not optional within the `postgres`
# feature: a cfg-gated TLS stack means a build where `ssl_mode = "require"` has to
# either fail at runtime or downgrade, and the second is the bug being fixed.
rustls = {version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"], optional = true}
rustls-native-certs = {version = "0.8.3", optional = true}
rustls-pemfile = {version = "2.2", optional = true}
serde = {workspace = true}
serde_json = {workspace = true}
thiserror = {workspace = true}
tokio = {workspace = true}
# Database — PostgreSQL (optional; enabled by the "postgres" feature)
tokio-postgres = {workspace = true, features = ["with-serde_json-1"], optional = true}
tokio-postgres-rustls = {version = "0.14", default-features = false, features = ["ring"], optional = true}
tokio-util = "0.7"
tracing = {workspace = true}
uuid = {workspace = true}

[[bench]]
harness = false
name = "sql_generation_bench"

[dev-dependencies]
criterion = {version = "0.5", features = ["html_reports"]}
fraiseql-test-support = {path = "../fraiseql-test-support"}
insta = {workspace = true}
proptest = {workspace = true}
serde_json = {workspace = true}

[features]
default = ["postgres"]
postgres = [
    "dep:tokio-postgres",
    "dep:deadpool",
    "dep:deadpool-postgres",
    "dep:rustls",
    "dep:rustls-native-certs",
    "dep:rustls-pemfile",
    "dep:tokio-postgres-rustls",
]
# Integration test features
test-postgres = []
wire-backend = ["fraiseql-wire"]

[lints]
workspace = true

[package]
description = "Database abstraction layer for FraiseQL v2"
name = "fraiseql-db"
readme = "README.md"
authors.workspace = true
categories.workspace = true
documentation.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

# docs.rs builds a crate with its DEFAULT features unless told otherwise, so the published
# page showed none of the feature-gated API — and this workspace's documentation links
# into that API from prose that is not gated (#1199). `all-features` makes the published
# page the whole crate.
[package.metadata.docs.rs]
all-features = true

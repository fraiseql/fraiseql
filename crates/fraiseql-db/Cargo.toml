[dependencies]
# Async runtime
async-trait = { workspace = true }
bytes = { workspace = true }
deadpool-postgres = { workspace = true, optional = true }
# Error types
fraiseql-error = { workspace = true }
# The workspace's one DDL advisory lock, for the dispatch ledger's provisioning script.
fraiseql-guard = { workspace = true, optional = true }
# The calendar text of `timestamptz`, `timestamp` and `date` cells; dates and times of day
# checked on jiff's calendar.
fraiseql-time = { workspace = true }
# Wire protocol (optional)
fraiseql-wire = { workspace = true, optional = true }
futures = { workspace = true }
# Scanning a JSON string for its end without a byte-at-a-time loop.
memchr = { workspace = true }
# The letter classes an accent-insensitive regex pattern may hold beyond ASCII.
regex = { workspace = true }
# PostgreSQL transport security (#801/#824). Not optional within the `postgres`
# feature: a cfg-gated TLS stack means a build where `ssl_mode = "require"` has to
# either fail at runtime or downgrade, and the second is the bug being fixed.
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "std",
  "tls12",
  "logging",
], optional = true }
rustls-native-certs = { version = "0.8.3", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true, optional = true }
tokio = { workspace = true }
# Database — PostgreSQL (optional; enabled by the "postgres" feature)
tokio-postgres = { workspace = true, features = [
  "with-serde_json-1",
], optional = true }
tokio-postgres-rustls = { version = "0.14", default-features = false, features = [
  "ring",
], optional = true }
tracing = { workspace = true }
uuid = { workspace = true }

[[bench]]
harness = false
name = "sql_generation_bench"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
fraiseql-test-support = { path = "../fraiseql-test-support" }
insta = { workspace = true }
proptest = { workspace = true }
serde_json = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
default = ["postgres"]
postgres = [
  "dep:fraiseql-guard",
  "dep:tokio-postgres",
  "dep:deadpool-postgres",
  "dep:rustls",
  "dep:rustls-native-certs",
  "dep:tokio-postgres-rustls",
]
# Integration test features
test-postgres = []
wire-backend = ["fraiseql-wire"]
# The JSON Schema of the configuration types the CLI publishes for `fraiseql.toml`; only the
# CLI enables it, so the server does not build the derives.
json-schema = ["dep:schemars"]

[lints]
workspace = true

[package]
description = "Database abstraction layer for FraiseQL v2"
name = "fraiseql-db"
readme = "README.md"
authors.workspace = true
categories.workspace = true
documentation.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

# docs.rs builds a crate with its DEFAULT features unless told otherwise, so the published
# page showed none of the feature-gated API — and this workspace's documentation links
# into that API from prose that is not gated (#1199). `all-features` makes the published
# page the whole crate.
[package.metadata.docs.rs]
all-features = true

# Suites that need the `postgres` feature: they import `fraiseql_db::postgres` or
# `tokio_postgres`, or test what only it builds. `postgres` is a default feature, so
# every default and CI build compiles and runs them as before. Without it, cargo now
# skips them instead of failing to compile them, and the `db-no-default`
# feature-matrix combo builds every test target that way.
#
# `required-features` rather than a file-level `#![cfg]`: it is the form
# tools/check-suite-coverage.py can see, and a `#![cfg]` placed before the crate's
# `//!` doc left an empty crate that failed `missing_docs`.
[[test]]
name = "adapter_parity_test"
required-features = ["postgres"]

[[test]]
name = "changelog_diagnostics_test"
required-features = ["postgres"]

[[test]]
name = "changelog_duration_test"
required-features = ["postgres"]

[[test]]
name = "changelog_outbox_test"
required-features = ["postgres"]

[[test]]
name = "commit_gate_rollback_test"
required-features = ["postgres"]

[[test]]
name = "dialect_properties"
required-features = ["postgres"]

[[test]]
name = "dialect_snapshots"
required-features = ["postgres"]

[[test]]
name = "dry_run_rollback_test"
required-features = ["postgres"]

[[test]]
name = "postgres_column_decode_test"
required-features = ["postgres"]

[[test]]
name = "temporal_text_against_postgres_pg"
required-features = ["postgres"]

[[test]]
name = "postgres_tls_test"
required-features = ["postgres"]

[[test]]
name = "postgres_tls_verify_test"
required-features = ["postgres"]

[[test]]
name = "prepare_error_diagnostic"
required-features = ["postgres"]

[[test]]
name = "seed_fixture_integrity"
required-features = ["postgres"]

[[test]]
name = "vector_scan_startup_options_pg"
required-features = ["postgres"]

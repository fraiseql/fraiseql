[package]
description = "Distributed saga orchestration for FraiseQL — forward execution, compensation and crash recovery over the mutation chokepoint"
name = "fraiseql-saga"
readme = "README.md"
authors.workspace = true
categories.workspace = true
documentation.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[[bench]]
harness = false
name = "mutation_http_bench"

# Declared with `harness = false` because it is a criterion bench. It was
# auto-discovered before the move, which defaults to `harness = true`, so
# `criterion_main!`'s `main` was ignored and it ran zero benchmarks. Declaring it
# makes it run; it still measures a local mock rather than the saga (#1361).
[[bench]]
harness = false
name = "saga_performance_bench"

[dependencies]
chrono = {workspace = true}
deadpool = {workspace = true}
deadpool-postgres = {workspace = true}
# The engine. A saga step is a client of the mutation chokepoint
# (`Executor::execute_mutation_with_security`), which is why this crate sits
# above core rather than beside it (#1354).
fraiseql-core = {workspace = true}
fraiseql-db = {workspace = true, default-features = false}
fraiseql-error = {workspace = true, default-features = false}
# Entity metadata, `@requires` pre-fetch and the mTLS material a remote step
# dispatches with. Federation proper stays *below* core; only orchestration is here.
fraiseql-federation = {workspace = true}
reqwest = {workspace = true}
serde = {workspace = true, features = ["derive"]}
serde_json = {workspace = true}
tokio = {workspace = true}
tokio-postgres = {workspace = true}
tracing = {workspace = true}
uuid = {workspace = true}

[dev-dependencies]
# Postgres backs the saga store and the forward/compensation round-trips in
# `tests/saga_integration.rs`. The lib tests use `FailingAdapter` from
# fraiseql-test-utils as the local adapter: remote-dispatch tests configure it to
# fail loudly if the local path is ever reached.
fraiseql-db = {workspace = true, default-features = false, features = ["postgres"]}
criterion = {version = "0.5", features = ["html_reports"]}
# The crate's own unit tests build `HttpEntityResolver::new_for_test`, which federation
# gates on `#[cfg(any(test, feature = "test-utils"))]`. Inside the old crate `cfg(test)`
# reached it; across a crate boundary it does not, so the test build asks for the feature
# explicitly. A normal consumer of fraiseql-saga never gets it (#1354).
fraiseql-federation = {workspace = true, features = ["test-utils"]}
fraiseql-test-utils = {path = "../fraiseql-test-utils"}
# Canonical DATABASE_URL resolution: `database_url()` panics with an actionable
# message, `try_database_url()` is the self-skipping form. Bare `std::env::var`
# in a test is what tools/check-test-imports.sh refuses (#1075).
fraiseql-test-support = {path = "../fraiseql-test-support"}
tokio = {workspace = true, features = ["macros", "rt-multi-thread"]}
wiremock = "0.6"

[features]
# # Exposes test-helper constructors on the coordinator and the saga store, and
# # forwards to federation's so `HttpEntityResolver::new_for_test` is reachable
# # for the coordinator's `with_entity_resolver` test path.
# # Never enable in production — these bypass security checks.
test-utils = ["fraiseql-federation/test-utils"]

[lints]
workspace = true

# docs.rs builds a crate with its DEFAULT features unless told otherwise, so the
# published page showed none of the feature-gated API — and this workspace's
# documentation links into that API from prose that is not gated (#1199).
# `all-features` makes the published page the whole crate.
[package.metadata.docs.rs]
all-features = true

[dependencies]
# Facade only: lets a refused escape hatch be reported from the single place that
# decides it (#882), without making this crate unreachable from any leaf crate.
tracing = "0.1"

[dev-dependencies]
temp-env = {workspace = true}
tracing-subscriber = {workspace = true}

[lints]
workspace = true

[package]
description = "The single outbound-address SSRF guard shared by every FraiseQL crate that makes network requests"
name = "fraiseql-guard"
readme = "README.md"
authors.workspace = true
categories.workspace = true
documentation.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

# docs.rs builds a crate with its DEFAULT features unless told otherwise, so the published
# page showed none of the feature-gated API — and this workspace's documentation links
# into that API from prose that is not gated (#1199). `all-features` makes the published
# page the whole crate.
[package.metadata.docs.rs]
all-features = true

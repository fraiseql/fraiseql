[dependencies]
fraiseql-guard = {workspace = true}
aes-gcm = "0.10"
anyhow = "1.0"
# Lock-free generation swap for the hot-reloaded SAML IdP registry (#947); `auth-saml` only.
arc-swap = {workspace = true, optional = true}
argon2 = "0.5"
bcrypt = "0.15"
async-trait = "0.1"
axum = {workspace = true, features = ["macros"]}
base64 = "0.22"
chacha20poly1305 = "0.10"
chrono = {workspace = true}
dashmap = {workspace = true}
fraiseql-error = {workspace = true}
hex = "0.4"
hmac = "0.13"
http = "1"
jsonwebtoken = {version = "10", features = ["rust_crypto"]}
parking_lot = {workspace = true}
rand = "0.9"
# Redis for distributed rate limiting (optional)
redis = {workspace = true, optional = true}
reqwest = {workspace = true}
# X.509 `notAfter` for the SAML IdP certificate-expiry warning (#947). Adds nothing to the
# tree: samael already pulls the same openssl under `auth-saml`.
openssl = {version = "0.10", optional = true}
# SAML 2.0 SP support (#381) — heavy XML/crypto C stack (libxml2 + openssl), kept
# behind the opt-in `auth-saml` feature so the default build stays lean.
samael = {version = "0.0.21", optional = true}
serde = {version = "1.0", features = ["derive"]}
serde_json = {workspace = true}
sha1 = "0.11"
sha2 = "0.11"
sqlx = {version = "0.8", features = ["postgres", "runtime-tokio", "uuid", "chrono"]}
subtle = "2.5"
totp-rs = {version = "5", features = ["gen_secret", "otpauth"]}
thiserror = "2.0"
tokio = {workspace = true}
tower = {version = "0.5"}
tracing = "0.1"
url = {workspace = true}
urlencoding = "2.1"
uuid = {workspace = true}
zeroize = "1.8"

[[bench]]
harness = false
name = "auth_bench"

# `PgSamlReplayStore` and friends live behind `auth-saml`, so this suite cannot
# build without it. Declared here rather than as a file-level `#![cfg]` because
# the two fail in opposite directions: an inner `cfg` compiles to an empty
# binary and reads GREEN in a leg that forgot the feature, while
# `required-features` makes cargo refuse the target by name and makes the
# mismatch visible to tools/check-suite-coverage.py, which reads this key and
# will report an ORPHAN unless some leg enables the feature.
[[test]]
name = "postgres_saml_replay"
required-features = ["auth-saml"]

# Same reasoning as above: the IdP store and registry (#947) live behind `auth-saml`.
[[test]]
name = "postgres_saml_idp_store"
required-features = ["auth-saml"]

[dev-dependencies]
criterion = {version = "0.5", features = ["html_reports"]}
fraiseql-test-support = {path = "../fraiseql-test-support"}
proptest = {workspace = true}
temp-env = {workspace = true}
tokio-test = "0.4"
# Lets the live-PG MFA suite (#984) drive the real TOTP path; same version as the
# runtime dependency above, so it adds nothing to the tree.
totp-rs = {version = "5", features = ["gen_secret", "otpauth"]}
wiremock = "0.6"

[features]
default = []
redis-pkce = ["redis"]
redis-rate-limiting = ["redis"]
# SAML 2.0 service-provider login + ACS (#381). Pulls samael (libxml2 + openssl).
auth-saml = ["dep:samael", "dep:arc-swap", "dep:openssl"]

[lints]
workspace = true

[package]
description = "Authentication, authorization, and session management for FraiseQL"
name = "fraiseql-auth"
readme = "README.md"
authors.workspace = true
categories.workspace = true
documentation.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

# docs.rs builds a crate with its DEFAULT features unless told otherwise, so the published
# page showed none of the feature-gated API — and this workspace's documentation links
# into that API from prose that is not gated (#1199). `all-features` makes the published
# page the whole crate.
[package.metadata.docs.rs]
all-features = true

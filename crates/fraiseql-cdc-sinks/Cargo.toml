[dependencies]
fraiseql-guard = {workspace = true}
async-nats = {version = "0.49", optional = true}
aws-config = {version = "1", optional = true}
# See the aws-sdk-s3 note in fraiseql-storage: the SDK's default `rustls` feature
# is the LEGACY rustls 0.21 connector, not the HTTPS client. Dropped by name;
# HTTPS comes from `default-https-client` (rustls 0.23) (#1111).
aws-sdk-kinesis = {version = "1", optional = true, default-features = false, features = [
  "default-https-client",
  "rt-tokio",
]}
chrono = {workspace = true}
fraiseql-kafka = {workspace = true, optional = true}
serde = {version = "1.0", features = ["derive"]}
serde_json = {workspace = true}
sqlx = {version = "0.8", features = ["postgres", "runtime-tokio", "uuid", "chrono", "json"]}
thiserror = "2.0"
tokio = {workspace = true}
tracing = {workspace = true}
uuid = {workspace = true}

[dev-dependencies]
# The #975 e2e builds a consumer to read back what the sink produced. Through
# fraiseql-kafka's re-export so it is provably the same rdkafka (#1198).
fraiseql-kafka = {workspace = true}
temp-env = {workspace = true}
fraiseql-test-support = {path = "../fraiseql-test-support"}
futures = "0.3"
tokio = {workspace = true, features = ["test-util"]}

[features]
# Off by default: each broker client is pulled only when a deployment enables its
# sink. The default build stays broker-free; the drain worker, the endpoint
# guards and all pure encoding/sanitisation logic compile unconditionally, so the
# refusing half of every transport guard runs in the cheap unit-test leg.
default = []
# Apache Kafka. Unlike async-nats this pulls a C library (librdkafka, built from
# source by rdkafka-sys) and links system libssl/libcrypto/libz — via fraiseql-kafka,
# the one place in this workspace that builds a producer (#1102).
cdc-kafka = ["dep:fraiseql-kafka"]
# AWS Kinesis Data Streams. Pulls the AWS SDK and, with it, a second optional
# aws-* dependency tree — see the RUSTSEC-2026-0098/0099/0104 entries in deny.toml,
# whose justification names this feature as well as aws-s3.
cdc-kinesis = ["dep:aws-sdk-kinesis", "dep:aws-config"]
cdc-nats-jetstream = ["dep:async-nats"]

[lints]
workspace = true

[package]
description = "Outbound change-data-capture: drains the FraiseQL change-log outbox to external brokers (#382)"
name = "fraiseql-cdc-sinks"
readme = "README.md"
authors.workspace = true
categories.workspace = true
documentation.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

# docs.rs builds a crate with its DEFAULT features unless told otherwise, so the published
# page showed none of the feature-gated API — and this workspace's documentation links
# into that API from prose that is not gated (#1199). `all-features` makes the published
# page the whole crate.
[package.metadata.docs.rs]
all-features = true

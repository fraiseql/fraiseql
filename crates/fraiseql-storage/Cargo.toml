[package]
name = "fraiseql-storage"
version.workspace = true
edition = "2021"
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true
homepage = "https://fraiseql.dev"
documentation = "https://docs.rs/fraiseql-storage"
description = "Object storage backends and HTTP handlers for FraiseQL"
readme = "README.md"
keywords = ["graphql", "storage", "s3", "object-store"]
categories = ["api-bindings", "web-programming"]
publish = true

[dependencies]
fraiseql-error = { workspace = true }

# The bucket map is republished wholesale when a policy is pushed over the
# admin API (#974), so readers take a lock-free snapshot rather than a lock.
arc-swap = { workspace = true }
bytes = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }
tokio = { version = "1", features = ["fs", "io-util", "rt"] }
axum = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = {workspace = true}
sha2 = "0.11"
hex = "0.4"
thiserror = "2"
tracing = "0.1"
async-trait = "0.1"
chrono = { workspace = true }
uuid = { workspace = true }
walkdir = "2"

# Storage backends (feature-gated)
aws-sdk-s3 = { version = "1", optional = true }
aws-config = { version = "1", optional = true }

# GCS backend (feature-gated)
jsonwebtoken = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
urlencoding = { version = "2.1", optional = true }

# Azure Blob backend also uses base64; the Tus Upload-Metadata parser (#369)
# needs it unconditionally.
base64 = { workspace = true }
hmac = { workspace = true, optional = true }

# Image transforms (feature-gated)
image = { version = "0.25", optional = true }
kamadak-exif = { version = "0.6", optional = true }
# Glyph rasterisation for text watermarks (#973). The typeface itself is the
# operator's — named by the bucket's `watermark_font` — so no font is vendored.
ab_glyph = { version = "0.2", optional = true }
# google-cloud-storage = { version = "...", optional = true }
# azure_storage_blobs = { version = "0.20", optional = true }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
# Integration tests connect through the test-support harness (env-URL first; optional
# local-testcontainers spawn). Dagger provides Postgres + the Azurite/fake-gcs emulators.
fraiseql-test-support = { path = "../fraiseql-test-support" }
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "storage_bench"
harness = false

[lints]
workspace = true

[features]
default = ["postgres"]
postgres = []
aws-s3 = ["aws-sdk-s3", "aws-config"]
transforms = ["image", "kamadak-exif", "ab_glyph"]
# Seam-carving retarget: opt-in because its cost is O(pixels x seams) rather
# than O(output), and it is bounded by a wall-clock budget rather than by size.
transforms-retarget = ["transforms"]
gcs = ["jsonwebtoken", "parking_lot", "reqwest", "urlencoding"]
azure-blob = ["hmac", "reqwest", "urlencoding"]
# gcs = ["google-cloud-storage"]
# azure-blob = ["azure_storage_blobs"]

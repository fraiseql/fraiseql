# An identity provider registered over the admin API on a running server gets this
# service provider's metadata to consume: the store the boot provisions, and the routes
# that manage it.
capability = "saml"

[env]
FRAISEQL_HS256_SECRET = "capability-fixture-hs256-secret-32b"

[[stimulus]]
http = { method = "POST", path = "/api/saml/idps", auth = "capability-fixture-admin-token-32-chars-long", body = '''{"idp_name":"fixture-idp","sp_entity_id":"https://sp.example.com/metadata","acs_url":"https://sp.example.com/auth/saml/acs","metadata_xml":"<EntityDescriptor xmlns=\"urn:oasis:names:tc:SAML:2.0:metadata\" entityID=\"https://idp.example.com/metadata\">\n  <IDPSSODescriptor protocolSupportEnumeration=\"urn:oasis:names:tc:SAML:2.0:protocol\">\n    <KeyDescriptor use=\"signing\">\n      <KeyInfo xmlns=\"http://www.w3.org/2000/09/xmldsig#\">\n        <X509Data><X509Certificate></X509Certificate></X509Data>\n      </KeyInfo>\n    </KeyDescriptor>\n    <SingleSignOnService Binding=\"urn:oasis:names:tc:SAML:2.0:bindings:HTTP-Redirect\" Location=\"https://idp.example.com/sso\"/>\n  </IDPSSODescriptor>\n</EntityDescriptor>"}''' }

[effect]
http = { path = "/auth/saml/metadata?idp=fixture-idp", status = 200 }

[schema]
name = "capability-saml"

[types.Note]
sql_source = "app.v_note"
fields.id = { type = "ID" }
fields.title = { type = "String" }

[queries.notes]
return_type = "Note"
return_array = true
sql_source = "app.v_note"

[mutations.createNote]
return_type = "Note"
operation = "INSERT"
sql_source = "app.fn_create_note"
args = [{ name = "title", type = "String", required = true }]

# SAML keeps its identity providers, accounts and sessions in schema `auth`, which first-party
# auth reaches through a pool of its own. Here one role serves both pools: the fixture's
# database URL.
[auth.database]
url_env = "DATABASE_URL"

# A session SAML mints lives this long; the first-party issuer requires it.
[auth.session]
ttl_secs = 900

# A REST `POST` with no bearer, on a resource that requires one, is refused and inserts
# nothing.
capability = "rest"
role = "hostile"
deadline_secs = 5

[[stimulus]]
http = { method = "POST", path = "/rest/v1/notes", body = '{"title":"over rest"}', status = 401 }

[effect]
none = { of = { row = { query = "SELECT title FROM app.tb_note", expect = [
  [
    "over rest",
  ],
] } } }

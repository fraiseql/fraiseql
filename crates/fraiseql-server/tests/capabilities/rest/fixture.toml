# A REST `POST` on a resource runs its insert mutation.
capability = "rest"

[[stimulus]]
http = { method = "POST", path = "/rest/v1/notes", body = '{"title":"over rest"}', auth = { oidc = { sub = "agent-1", aud = "fraiseql" } } }

[effect]
row = { query = "SELECT title FROM app.tb_note", expect = [["over rest"]] }

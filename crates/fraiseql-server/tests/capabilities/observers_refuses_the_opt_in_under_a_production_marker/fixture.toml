# The outbound opt-in is refused under a production marker: the outbound checks stay on,
# and a webhook action on a loopback address is not sent.
capability = "observers"
role = "hostile"
deadline_secs = 8

# The action aims at the harness's receiver, on loopback: had it been sent, it would be seen.
[env]
FRAISEQL_ENV = "production"
FRAISEQL_OBSERVERS_ALLOW_INSECURE = "true"

[[stimulus]]
sql = { statement = "INSERT INTO core.tb_observer (name, entity_type, event_type, actions) VALUES ('notify_orders', 'Order', 'INSERT', '[{\"type\": \"webhook\", \"url\": \"$RECEIVER_URL/orders\", \"method\": \"POST\"}]')" }

# One reload interval, so the runtime has read the new observer.
[[stimulus]]
wait = { secs = 3 }

[[stimulus]]
sql = { statement = "INSERT INTO core.tb_entity_change_log (object_type, modification_type, object_id, tenant_id, object_data) VALUES ('Order', 'INSERT', gen_random_uuid(), gen_random_uuid(), '{\"id\": 1}')" }

[effect]
none = { of = { received = { path = "/orders", count = 1 } } }

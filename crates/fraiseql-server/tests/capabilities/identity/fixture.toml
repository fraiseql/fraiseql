# A subject the actor table has never seen is provisioned on its first request.
capability = "identity"

[[stimulus]]
http = { method = "POST", path = "/graphql", body = '{"query":"{ notes { id } }"}', auth = { oidc = { sub = "agent-1", aud = "fraiseql" } } }

[effect]
row = { query = "SELECT sub FROM app.tb_actor", expect = [["agent-1"]] }

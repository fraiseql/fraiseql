# A TOML schema: this fixture authors its types here. The `cron` fixture declares `[mcp]`
# beside an SDK `schema.json`.
[schema]
name = "capability-mcp"

[types.Note]
sql_source = "app.v_note"
fields.id = { type = "ID" }
fields.title = { type = "String" }

[queries.notes]
return_type = "Note"
return_array = true
sql_source = "app.v_note"

[mutations.createNote]
return_type = "Note"
operation = "INSERT"
sql_source = "app.fn_create_note"
args = [{ name = "title", type = "String", required = true }]

[mcp]
enabled = true
transport = "http"
path = "/mcp"
require_auth = false

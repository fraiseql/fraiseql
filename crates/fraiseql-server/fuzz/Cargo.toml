[[bin]]
doc = false
name = "toml_config"
path = "fuzz_targets/toml_config.rs"

[[bin]]
doc = false
name = "graphql_request"
path = "fuzz_targets/graphql_request.rs"

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
toml = "0.8"
# `rest_params` decodes a query string as the router does.
url = "2"

[dependencies.fraiseql-core]
path = "../../fraiseql-core"

[dependencies.fraiseql-server]
path = ".."
# `rest_params` reaches the REST extractor, compiled only with this feature.
features = ["rest"]

[package]
edition = "2021"
name = "fraiseql-server-fuzz"
publish = false
version = "2.19.1"

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[[bin]]
doc = false
name = "rest_params"
path = "fuzz_targets/rest_params.rs"

[[bin]]
doc = false
name = "ws_client_message"
path = "fuzz_targets/ws_client_message.rs"

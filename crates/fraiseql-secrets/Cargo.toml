[package]
description = "Secrets management and field-level encryption for FraiseQL"
name = "fraiseql-secrets"
readme = "README.md"
authors.workspace = true
categories.workspace = true
documentation.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[[bench]]
harness = false
name = "secrets_bench"

[dependencies]
fraiseql-guard = {workspace = true}
# Encryption
aes-gcm = {version = "0.10", features = ["zeroize"]}
async-trait = "0.1"
base64 = "0.22"
chrono = {workspace = true}
dashmap = {workspace = true}
fraiseql-core = {workspace = true}
rand = "0.9"
reqwest = {workspace = true}
serde = {version = "1.0", features = ["derive"]}
serde_json = {workspace = true}
thiserror = {workspace = true}
tokio = {workspace = true}
tracing = "0.1"
uuid = {workspace = true}
zeroize = "1.8"

[dev-dependencies]
criterion = {version = "0.5", features = ["html_reports"]}
mutants = "0.0.4"
proptest = {workspace = true}
temp-env = {workspace = true}
tempfile = "3.13"
tokio-test = "0.4"
wiremock = "0.6"

[lints]
workspace = true

# docs.rs builds a crate with its DEFAULT features unless told otherwise, so the published
# page showed none of the feature-gated API — and this workspace's documentation links
# into that API from prose that is not gated (#1199). `all-features` makes the published
# page the whole crate.
[package.metadata.docs.rs]
all-features = true

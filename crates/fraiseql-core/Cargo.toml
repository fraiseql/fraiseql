# Suites that import `fraiseql_core::db::postgres`, which the `postgres` feature
# provides. `postgres` is a default feature, so these build and run exactly as
# before in every configuration CI uses — but without the declaration,
# `--no-default-features` did not merely skip them, it failed to compile the
# crate's test targets at all: 11 binaries, 219 errors, 11 of them
# `E0432: unresolved import` and the remaining 208 `E0282` fallout from the
# failed imports (#1083). Nothing built that shape afterwards, and 39 more
# suites went in without the declaration. The `core-no-default` feature-matrix
# combo now builds every test target without the defaults, so a suite added
# here without it fails there.
#
# `required-features` rather than a file-level `#![cfg]`: it is the form
# `tools/check-suite-coverage.py` can see, and the one #1082 settled on. Same
# declaration the `adapter_comparison` and `full_pipeline_comparison` benches
# above already carry for the same reason.
[[test]]
name = "aggregate_big_int_pg"
required-features = ["postgres"]

[[test]]

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
tokio = { version = "1", features = ["rt", "time"] }

[dependencies.fraiseql-core]
default-features = false
path = ".."

[dependencies.fraiseql-jwks]
path = "../../fraiseql-jwks"

[package]
edition = "2021"
name = "fraiseql-core-fuzz"
publish = false
version = "2.19.1"

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]


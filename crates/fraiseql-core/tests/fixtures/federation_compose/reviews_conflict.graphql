}

extend type Product @key(fields: "id") {
  id: ID! @external
  reviews: [Review!]!
}

type EntityChangeLog @tag(name: "requires-role/changelog_reader") {
  id: ID!
  pkEntityChangeLog: Int!
  fkCustomerOrg: String
  fkContact: String
  objectType: String!

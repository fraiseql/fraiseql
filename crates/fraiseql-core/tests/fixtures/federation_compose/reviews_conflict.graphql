  review_vote_aggregate(where: ReviewVoteAggregateWhere, groupBy: ReviewVoteAggregateGroupBy, aggregates: [ReviewVoteAggregateSelection!], having: ReviewVoteAggregateHaving, orderBy: ReviewVoteAggregateOrderBy, limit: Int, offset: Int): [ReviewVoteAggregateRow!]!

extend schema @link(url: "https://specs.apollo.dev/federation/v2.0", import: ["@key", "@external", "@requires", "@provides", "@shareable", "@inaccessible", "@override", "@extends"])
scalar DateTime
scalar JSON

enum SortDirection {
  ASC
  DESC
}

input EntityChangeLogWhereInput {
  id: IDFilter
  pkEntityChangeLog: IntFilter
  fkCustomerOrg: StringFilter
  fkContact: StringFilter
  objectType: StringFilter
  objectId: StringFilter
  modificationType: StringFilter
  changeStatus: StringFilter
  objectData: JSONFilter
  extraMetadata: JSONFilter
  createdAt: DateTimeFilter
  _and: [EntityChangeLogWhereInput!]
  _or: [EntityChangeLogWhereInput!]
  _not: EntityChangeLogWhereInput
}

input EntityChangeLogOrderByInput {
  field: String!
  direction: SortDirection
}

input DateTimeFilter {
  eq: DateTime
  neq: DateTime
  gt: DateTime
  gte: DateTime
  lt: DateTime
  lte: DateTime
  in: [DateTime!]
  nin: [DateTime!]
  isnull: Boolean
  is_not_null: Boolean
}

input IDFilter {
  eq: ID
  neq: ID
  gt: ID
  gte: ID
  lt: ID
  lte: ID
  in: [ID!]
  nin: [ID!]
  isnull: Boolean
  is_not_null: Boolean
}

input IntFilter {
  eq: Int
  neq: Int
  gt: Int
  gte: Int
  lt: Int
  lte: Int
  in: [Int!]
  nin: [Int!]
  isnull: Boolean
  is_not_null: Boolean
}

input JSONFilter {
  eq: JSON
  neq: JSON
  gt: JSON
  gte: JSON
  lt: JSON
  lte: JSON
  in: [JSON!]
  nin: [JSON!]
  isnull: Boolean
  is_not_null: Boolean
  array_contains: JSON
  array_contained_by: JSON
  array_overlaps: JSON
  len_eq: Int
  len_neq: Int
  len_gt: Int
  len_gte: Int
  len_lt: Int
  len_lte: Int
  strictly_contains: JSON
}

input StringFilter {
  eq: String
  neq: String
  gt: String
  gte: String
  lt: String
  lte: String
  in: [String!]
  nin: [String!]
  isnull: Boolean
  is_not_null: Boolean
  contains: String
  icontains: String
  startswith: String
  istartswith: String
  endswith: String
  iendswith: String
  like: String
  ilike: String
  nlike: String
  nilike: String
  regex: String
  iregex: String
  nregex: String
  niregex: String
}

type Money @shareable {
  amount: Int
  currency: String
}

type Product @key(fields: "id") {
  id: ID
  name: String
  price: Money
  createdAt: DateTime
}

type EntityChangeLog {
  id: ID
  pkEntityChangeLog: Int
  fkCustomerOrg: String
  fkContact: String
  objectType: String
  objectId: String
  modificationType: String
  changeStatus: String
  objectData: JSON
  extraMetadata: JSON
  createdAt: DateTime
}

type TransportCheckpoint {
  transportName: String
  lastPk: Int
  updatedAt: DateTime
}

type Query {
  products: [Product!]!
  entityChangeLogs(where: EntityChangeLogWhereInput, orderBy: [EntityChangeLogOrderByInput], limit: Int): [EntityChangeLog!]!
  transportCheckpoint(transportName: String!): TransportCheckpoint
}

type Mutation {
  upsertTransportCheckpoint(transportName: String!, lastPk: Int!): TransportCheckpoint!
}



directive @key(fields: String!, resolvable: Boolean = true) repeatable on OBJECT
directive @extends on OBJECT
directive @external on FIELD_DEFINITION
directive @requires(fields: String!) on FIELD_DEFINITION
directive @provides(fields: String!) on FIELD_DEFINITION
directive @shareable on FIELD_DEFINITION | OBJECT
directive @inaccessible on FIELD_DEFINITION | OBJECT | INTERFACE | UNION | ARGUMENT_DEFINITION | SCALAR | ENUM | ENUM_VALUE | INPUT_OBJECT | INPUT_FIELD_DEFINITION
directive @override(from: String!) on FIELD_DEFINITION
directive @link(url: String, as: String, for: link__Purpose, import: [link__Import]) repeatable on SCHEMA

enum link__Purpose {
  SECURITY
  EXECUTION
}

scalar link__Import

type _Service {
  sdl: String!
}

scalar _Any

union _Entity = Product

extend type Query {
  _service: _Service!
  _entities(representations: [_Any!]!): [_Entity]!
}

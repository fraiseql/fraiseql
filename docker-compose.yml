version: '3.8'

services:
  fraiseql:
    build: .
    # 8000, not 8815. The image binds 0.0.0.0:8000 (Dockerfile ENV
    # FRAISEQL_BIND_ADDR), so publishing 8815:8815 mapped the host to a container
    # port nothing listened on. #1216 corrected the image and left every consumer
    # of it behind; this is one of them.
    ports:
      - "8000:8000"
    environment:
      RUST_LOG: debug
      DATABASE_URL: postgresql://fraiseql:fraiseql@postgres:5432/fraiseql
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fraiseql-net

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fraiseql
      POSTGRES_PASSWORD: fraiseql
      POSTGRES_DB: fraiseql
    ports:
      # Loopback-only: reachable for local dev tooling, not from the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraiseql"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fraiseql-net

  redis:
    image: redis:7-alpine
    ports:
      # Loopback-only: reachable for local dev tooling, not from the network.
      - "127.0.0.1:6379:6379"
    networks:
      - fraiseql-net

volumes:
  postgres_data:

networks:
  fraiseql-net:
    driver: bridge

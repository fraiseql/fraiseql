# ─────────────────────────────────────────────────────────────────────────────────────
# Exemptions — an artifact with no executing leg, and the issue that owns the gap.
#
# `applies_to` is an exact artifact id or a `<kind>:*` wildcard. Two rules, both directions:
#
#   * an exemption matching ZERO artifacts fails — a stale row for something we stopped
#     shipping, the ledger equivalent of the dead job Phase 01 deleted;
#   * an exemption every one of whose artifacts HAS an executing leg fails — the gap it
#     describes has closed and the row is now a lie. This is the self-clearing half. It is
#     deliberately strict: a wildcard covering a class where SOME rows gain coverage must be
#     narrowed, because "mostly still true" is how an exemption survives its own reason.
# ─────────────────────────────────────────────────────────────────────────────────────

[[exempt]]
applies_to = "sdk:official/fraiseql-csharp"
issue = 1130
reason = "NuGet FraiseQL + FraiseQL.Tool: not published at any version; publish job gated on a csharp-sdk/v* tag that has never existed"

[[exempt]]
applies_to = "sdk:official/fraiseql-dart"
issue = 1223
reason = "pub.dev: not published; and the publish job's only publish step is `dart pub publish --dry-run`, so tagging would not change that"

[[exempt]]
applies_to = "sdk:official/fraiseql-elixir"
issue = 1130
reason = "Hex: not published at any version; publish job gated on an elixir-sdk/v* tag that has never existed"

[[exempt]]
applies_to = "sdk:official/fraiseql-fsharp"
issue = 1130
reason = "NuGet FraiseQL.FSharp + FraiseQL.Tool.FSharp: not published at any version; publish job gated on an fsharp-sdk/v* tag that has never existed"

[[exempt]]
applies_to = "sdk:official/fraiseql-go"
issue = 1224
reason = "the declared module path github.com/fraiseql/fraiseql-go is a 404 repository, and the monorepo path has no versions, so `go get` cannot obtain it by any path"

[[exempt]]
applies_to = "sdk:official/fraiseql-java"

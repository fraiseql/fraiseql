[[exempt]]
applies_to = "crate:fraiseql-kafka"
issue = 1102
reason = "same shape as fraiseql-guard above and for a sharper reason: nothing pulls it unless a Kafka feature is on (`cdc-kafka` on fraiseql-cdc-sinks, `kafka` on fraiseql-core, `subscription-kafka` on fraiseql-server), and none is default — a consumption tier that installed it by default would be pulling librdkafka, a C library built from source, into every install. Its code IS executed in CI: `cargo test -p fraiseql-kafka` on the workspace test leg, and through both callers on the integration leg's real broker (cdc_kafka_e2e, subscription_kafka_mirror_e2e)"


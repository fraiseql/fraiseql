# What this repository ships, and what proves each of those things works.
#
# Read by tools/check-delivery-coverage.py, which runs in preflight and in the Dagger
# ShellGates leg.
#
# ── Why this file exists ─────────────────────────────────────────────────────────────
#
# Every other gate here checks a property of the SOURCE. Almost nothing checked the thing
# we ship, and the two worst findings of the pre-2.15.0 backlog program were both
# "the artifact does not exist" defects that survived for weeks with eleven CI legs green:
# the release image could not be built at all (#1205), and `cargo deny check licenses` was
# red (#1204). No workflow built the release Dockerfile before the tag.
#
# `tools/check-suite-coverage.py` made TEST execution a checked artifact after the
# 2026-07-27 retrospective ("execution coverage must be a checked artifact, not an
# inference"). This file is that, one level up: DELIVERY coverage, as a checked artifact.
# The property it buys is narrow and worth stating exactly — **a new shipped artifact
# cannot arrive without a row, and a row cannot outlive the artifact it describes.**
#
# ── What it does NOT do ──────────────────────────────────────────────────────────────
#
# It is an INDEX, not a fifth parity gate. Four gates already hold the per-class lists
# honest and this file must not become a copy of any of them:
#
#   * tools/check-image-parity.py       — the image variant list, across three copies
#   * tools/check-publish-parity.py     — the crate set and its publish ORDER
#   * tools/check-sdk-workflow-coverage.py — every official SDK is gated on a branch push
#   * tools/check-suite-coverage.py     — every test suite maps to a leg that runs it
#
# So this gate DISCOVERS artifacts from the same sources those gates read, and then checks
# one thing they do not: that each artifact is claimed by a leg which EXECUTES it, and that
# every leg named here exists and is itself wired into CI. Anything else belongs in the gate
# that already owns it.
#
# ── The three columns ────────────────────────────────────────────────────────────────
#
#   publishes  the leg that puts the artifact where a consumer gets it
#   builds     the leg that produces it BEFORE the tag (the #1205 hole)
#   executes   the leg that RUNS it and requires an answer only a working artifact gives
#
# `executes` is the gated column. "The artifact exists" is not a test — that was the whole
# content of the two image jobs Phase 01 deleted, one of which asserted `docker image
# inspect` and the other `{ __typename }`, a query the GraphQL layer answers without
# touching a database. An empty `executes` is allowed only with an exemption carrying an
# issue number, and the exemption SELF-CLEARS: the day its artifact gains an executing leg,
# this gate fails until the row is narrowed or deleted. A stale exemption that quietly keeps
# claiming a gap that closed is the failure mode this pattern exists to prevent.
#
# ── Leg reference syntax ─────────────────────────────────────────────────────────────
#
#   workflow:<file>:<job>   a job that exists in .github/workflows/<file>
#   dagger:<Function>       a func (m *FraiseqlCi) <Function> in .dagger/, WHICH SOME
#                           WORKFLOW ACTUALLY CALLS as `dagger call <kebab-name>`
#   tool:<path>             a file that exists AND is invoked from a workflow run: block
#
# The "and is invoked" half is load-bearing and is not decoration. `.dagger/release.go`'s
# `PublishDryRun` is a real, working function that no workflow calls — it runs only from
# `make release-validate` on a developer's machine. A syntax that accepted a bare function
# name would let this file record CI coverage that CI does not perform, which is precisely
# the class of claim it was built to end (#1206: an unreachable job is invisible, not
# skipped; #1055: a gate that runs in no leg at all).
#
# ── Status of the whole ledger, measured 2026-08-28 at ebaf83a5c ─────────────────────
#
# Of everything below, THREE artifacts are executed by a leg that requires a working
# answer: the two fraiseql-server images, the Helm chart and the Compose stack (all four
# on the `Dagger — image` leg), plus one release asset. Every other row is exempt. That is
# not a comfortable picture and it is not meant to be — before this file, none of it was
# visible at all.

# ── Container images ─────────────────────────────────────────────────────────
#
# Discovered from `imageVariants` in .dagger/image.go — the same table
# tools/check-image-parity.py holds against docker-build.yml's two publish matrices, so a
# variant cannot reach a registry without arriving here as well.
#
# Two of the three carry the deepest coverage in this file: built before the tag, booted on
# their own CMD against a real Postgres, asserted for what they ARE (linkage, uid, labels,
# EXPOSE, an EXECUTED healthcheck), and — for fraiseql-server — deployed through both the
# Helm chart and the Compose stack. All five tiers are steps of the one `Dagger — image`
# leg, on push to dev and release/*.

[[artifact]]
id = "image:fraiseql-server"
kind = "container-image"
consumed_as = "ghcr.io/<owner>/server:<version> · docker.io/fraiseql/server:<version>"
publishes = ["workflow:docker-build.yml:build-and-push", "workflow:docker-build.yml:publish-to-docker-hub"]
builds = ["dagger:Images"]
executes = ["dagger:ImageBoots", "dagger:ImagePropertiesAll", "tool:tools/chart-deploy-test.sh", "tool:tools/compose-stack-test.sh"]

[[artifact]]
id = "image:fraiseql-server-full"
kind = "container-image"
consumed_as = "ghcr.io/<owner>/server-full:<version> · docker.io/fraiseql/server-full:<version>"
publishes = ["workflow:docker-build.yml:build-and-push", "workflow:docker-build.yml:publish-to-docker-hub"]
builds = ["dagger:Images"]
executes = ["dagger:ImageBoots", "dagger:ImagePropertiesAll"]

[[artifact]]
id = "image:tutorial"
kind = "container-image"
consumed_as = "ghcr.io/<owner>/tutorial:<version> · docker.io/fraiseql/tutorial:<version>"
publishes = ["workflow:docker-build.yml:build-and-push", "workflow:docker-build.yml:publish-to-docker-hub"]

# ── Operator-facing deployment artifacts ─────────────────────────────────────
#
# Neither is published to a registry: both are consumed by cloning this repository, which
# is why `publishes` is empty rather than omitted. That is a real property of how they
# ship, not a gap — the gap would be an empty `executes`, and neither has one.
#
# The chart is discovered from deploy/**/Chart.yaml. Before Phase 05 its only gate was
# `helm lint` + a render into /dev/null, and a lint never resolves an image: the chart
# shipped `repository: fraiseql` (docker.io/library/fraiseql, a namespace this project
# cannot publish to) for several releases (#1129). Measured 2026-08-27, fixing that
# reference alone would have changed nothing — the chart could not start a pod for five
# further reasons. It is now deployed into a throwaway k3s cluster and queried.
#
# The Compose stack is the ONE stack this repository ships and verifies. Five others were
# deleted in Phase 06 after measurement: not one of the six could serve a query, and the
# shared cause was in neither issue filed against them (#1189, #1202). Every other compose
# file in the tree must classify itself as CI-driven or say "Not CI-verified" in its own
# header — tools/compose-stack-test.sh fails on one it cannot classify.

[[artifact]]
id = "chart:fraiseql"
kind = "helm-chart"
consumed_as = "git clone · helm install fraiseql ./deploy/kubernetes/helm/fraiseql"
publishes = []
builds = []
executes = ["tool:tools/chart-deploy-test.sh"]

[[artifact]]
id = "compose:docker-compose.yml"
kind = "compose-stack"
consumed_as = "git clone · docker compose up (root docker-compose.yml)"
publishes = []
builds = []
executes = ["tool:tools/compose-stack-test.sh"]


[project]
name = "fraiseql-oracle-transports"
version = "0.0.0"
description = "Cross-transport differential oracle: one logical request on every FraiseQL transport, graded against POST /graphql."
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "cryptography==50.0.2",
  "httpx==0.28.1",
  "psycopg[binary]==3.3.9",
  "pyarrow==25.0.1",
  "pyjwt==2.15.1",
  "websockets==16.1.1",
]

[tool.uv]
package = false
# Every dependency must have been published at least two weeks before the lock.
exclude-newer = "2026-11-13T00:00:00Z"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
  "E",
  "W",
  "F",
  "I",
  "B",
  "C4",
  "UP",
  "ARG",
  "SIM",
  "TC",
  "PTH",
  "ERA",
  "PL",
  "RUF",
  "PERF",
  "FURB",
]
ignore = [
  "PLR2004", # protocol constants (HTTP statuses) read better inline
  "PLR0911", # a classifier returns one outcome per branch
  "PLR0912",
  "PLR0913", # renderers take the request's dimensions as arguments
]

[tool.ty.environment]
python-version = "3.10"

[dependency-groups]
dev = ["ruff==0.17.5", "ty==0.0.102"]

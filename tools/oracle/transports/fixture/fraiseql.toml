[project]
name = "oracle-transports"
version = "0.1.0"
database_target = "postgresql"

[validation]
max_query_depth = 4
max_query_complexity = 2000
max_page_size = 25

[rest]
enabled = true
path = "/rest/v1"
max_page_size = 25

[mcp]
enabled = true
transport = "http"
path = "/mcp"
require_auth = true

[[session_variables.variables]]
name = "app.tenant_id"
source = "jwt"
claim = "tenant_id"

[[session_variables.variables]]
name = "app.sub"
source = "jwt"
claim = "sub"

[[session_variables.variables]]
name = "app.hdr"
source = "header"
header = "x-probe"

[[security.role_definitions]]
name = "auditor"
scopes = ["read:secret", "read:note", "read:email"]

[[security.role_definitions]]
name = "admin"
scopes = ["read:secret", "read:note", "read:email"]

[[security.role_definitions]]
name = "viewer"
scopes = ["read:note"]

# The oracle sends many refused requests from one address. The default
# validation-error budget would start answering them with 429 partway through, so
# which response a request gets would depend on how fast the run goes.
[security.rate_limiting]
enabled = false
graphql_validation_error_max_requests = 4294967295

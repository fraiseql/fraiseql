# The check contexts that must pass before a commit reaches `dev`.
#
# This file is a MIRROR of GitHub ruleset 18506494 ("dev pre-merge gate"), which is
# the authority — a ruleset lives in GitHub, not in the tree, and no offline gate can
# read it. What this file buys is that the *rest* of the tree can reason about which
# legs can fail a merge: `tools/check-suite-coverage.py` uses it to refuse a test
# suite whose only coverage is a leg that runs but does not gate (#1289), which is
# how two `*_e2e_pg` tests stayed red on `dev` for two weeks with every required
# check green.
#
# ⚠ A mirror can drift. `tools/check-required-checks.sh` (`make lint-required-checks`)
# diffs this list against the live ruleset over the API and is the only thing that
# proves the two agree; it needs a network and a token, so it cannot run in the
# offline Dagger legs. Run it whenever this file or the ruleset changes, and before
# cutting a release. Since #1294 `required-checks-mirror.yml` also runs it on every
# push and is itself required, so drift now fails a merge rather than waiting for
# someone to remember the target.
#
# ⚠ Call the script, never `make lint-required-checks`, from anything that reads the
# exit code: GNU make reports every recipe failure as exit 2, which collapses the
# script's "they disagree" (1) into its "could not run" (2).
#
# To ADD a context: add the line HERE FIRST, on your branch. Then, once that branch
# is ready to merge, change the ruleset (`gh api --method PUT
# repos/fraiseql/fraiseql/rulesets/18506494 …`), re-run the branch's
# `required-checks mirror` job, and merge.
#
# The two artifacts cannot change atomically — one lives in a GitHub ruleset, the
# other in this tree — so one of the two windows is unavoidable. They are not
# equally bad, and the order that used to be documented here picked the worse one
# (#1302):
#
# ruleset first → `dev` carries a failing REQUIRED check for as long as the
# branch takes to validate and merge, which on this repository
# is hours. It happened while landing #1299: 23 → 25 contexts in
# the ruleset, the matching lines still on an unmerged branch,
# and the next push to `dev` failed `required-checks mirror`
# twelve seconds in. Nothing was broken; the trunk just read as
# broken, and the next person had to diagnose that.
#
# file first    → only YOUR branch goes red, on the branch you are already
# working on, and it clears the moment you update the ruleset.
# `dev` never carries a failure.
#
# ⚠ In between, `make lint-required-checks` / `tools/check-required-checks.sh` fail
# LOCALLY too — they diff against the LIVE ruleset, which does not have the context
# yet. That is the check working, not a mistake to revert. The script says so when
# the disagreement is one-sided in that direction.
#
# The cost of file-first, stated plainly: during the window this file names a
# context the ruleset does not enforce, so `check-suite-coverage.py` would accept a
# suite whose only coverage is that context. That is a branch-local
# over-estimate lasting until you update the ruleset, and it cannot wedge anything.
# The reverse order trades it for a red trunk on a required check, which can.
#
# To REMOVE a context, the order flips for the same reason: change the ruleset
# first, then delete the line. Dropping the line while the ruleset still enforces
# the context leaves this file under-counting what protects the branch, which
# produces false UNGATED findings whose obvious "fix" is to weaken a real gate.
#
# ⚠ A context may only be listed here if its workflow runs on a push to every
# in-repo working branch. A `branches: [dev]` leg produces no check on the branch
# being merged, and a path-filtered workflow produces none on a push its filter does
# not match — GitHub reports "not run", not "passed", so requiring one would block
# every unrelated push forever. `check-suite-coverage.py` enforces the first half by
# reading the workflow's own `on:` block, and rejects a `paths:`-filtered workflow
# outright.

branch = "dev"
required = [
  # dagger-preflight.yml:preflight — fmt, clippy, rustdoc, ~12 shell gates. Compiles
  # the tests; runs none of them.
  "preflight",
  # dagger-security.yml:security — cargo-deny, audit lockstep, secret scanning.
  "security",
  # dagger-test.yml:test — the workspace test suite, both toolchains. Binds no
  # service, so every DB-backed suite self-skips here (#1257 made it required).
  "test (msrv)",
  "test (stable)",
  # dagger-integration.yml:integration — the service-bound suites, one context per
  # matrix entry. Required as of #1289; the matrix in that workflow and this list
  # must name the same suites, and check-suite-coverage.py fails when they do not.
  "integration (postgres)",
  "integration (nats)",
  "integration (observers)",
  "integration (http-e2e)",
  "integration (tls)",
  "integration (server)",
  "integration (redis)",
  "integration (vault)",
  "integration (wire)",
  "integration (storage)",
  "integration (server-storage)",
  "integration (federation)",
  "integration (federation-compose)",
  "integration (saml)",
  "integration (quickstart)",
  "integration (examples)",
  # sdk-conformance.yml:generated-clients — the four `client_*_consumer` suites shell
  # out to tsc/ty/go/cargo and the network, so they cannot live in an offline Dagger
  # leg (#1120) and this GitHub-hosted job is the only thing that runs them. Its
  # `paths:` filter was removed in #1289 for exactly that reason: a filtered workflow
  # cannot be required.
  "Generated clients compile (tsc --strict / ty / go / cargo)",
  # dagger-feature-matrix.yml:matrix — clippy under narrow feature sets, which no
  # other gate lints. Required as of #1296.
  "feature matrix",
  # required-checks-mirror.yml:mirror — the job that diffs THIS FILE against the
  # live ruleset (#1294). Required for the same reason as everything above it: a
  # drift check that cannot fail a merge is a check nobody has to answer. It is a
  # GitHub-hosted job, so it costs no self-hosted runner time.
  "required-checks mirror",
  # changelog-check.yml:changelog-check — every issue closed since the last
  # release is documented. Required as of #1299. It was revived in #1127
  # *because* it had sat `workflow_dispatch:`-only through the Dagger migration
  # while 48 closed issues went undocumented, including a wave of production
  # fail-closed boot changes; it was given back its trigger and not given the
  # ability to stop anything, so the same drift could recur with the job red and
  # the merge green. GitHub-hosted.
  "Changelog Completeness",
  # sdk-conformance.yml:conformance — the authoring → export → compile → observe
  # round trip, plus "SDK examples compile". The sibling of the generated-clients
  # job above, in the same workflow and unfiltered since #1289, and required for
  # the same reason (#1299). GitHub-hosted.
  "Author → export → compile → observe"
]
ruleset = 18506494

# ⚠ A context is not required OR forgotten: `tools/check-suite-coverage.py` now
# asks the complementary question too (#1299). Every check produced on a push to a
# working branch by an unfiltered workflow must appear above, or carry an
# `[[unrequired]]` row in tools/suite-coverage-exemptions.toml stating why it must
# not gate. Four instances of "a real check that could fail nothing" — #1257,
# #1289, #1296, #1299 — were each found by a person noticing rather than by a
# check; that direction is now checked.

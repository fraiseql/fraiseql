# ── Exempt: guard-shaped calls that decide nothing ───────────────────────────────────

[[exempt]]
file = "crates/fraiseql-server/src/routes/after_mutation/mod.rs"
function = "record_and_run_capture"
reason = "an externally captured write has no request and no tenant: the call names the default executor, it does not choose one from the caller"

# An open policy, `USING (true)` or `WITH CHECK (true)` (family `rls-open-policy`): the
# grants guard its table, and each table's statement taking PUBLIC's privileges away is a
# `rls-grant` site below.

[[exempt]]
file = "crates/fraiseql-auth/src/account_linking/postgres.rs"
function = "SCHEMA_SQL"
anchor = "CREATE POLICY p_user_insert ON auth.tb_user FOR INSERT WITH CHECK (true)"
reason = "writes are the owner's, the store's; no grant, to PUBLIC or any other role, lets another role write: killed site rls-grant.auth.account_linking.postgres.tb_user"

[[exempt]]
file = "crates/fraiseql-auth/src/account_linking/postgres.rs"
function = "SCHEMA_SQL"
anchor = "CREATE POLICY p_auth_identity_insert ON auth.tb_auth_identity FOR INSERT WITH CHECK (true)"
reason = "writes are the owner's, the store's; no grant, to PUBLIC or any other role, lets another role write: killed site rls-grant.auth.account_linking.postgres.tb_auth_identity"

[[exempt]]
file = "crates/fraiseql-auth/src/local_password/reset.rs"

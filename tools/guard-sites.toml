# Guard-site inventory: every authorization, session and tenancy guard site, its mutant
# and the tests that kill it. Checked by tools/check-guard-sites.py on every PR; each
# mutant is run by tools/run-guard-mutants.py. See docs/testing.md, "Guard-Site Mutation".

# ── Families: guard-shaped calls that must each be an inventoried site ──────────────

[[family]]
name = "session"
patterns = ['\bcheck_revocation\s*\(']

[[family]]
name = "dispatch"
patterns = ['\btenant\s*\.\s*dispatch\s*\(']

[[family]]
name = "tenant-sql"
scan = "strings"
# A tenant predicate in SQL: a column compared to a bound value, a subquery or NULL.
# Row-level-security policy DDL (compared to `current_setting(...)`) is a different guard,
# enforced by Postgres for a non-owner role: family `rls-policy`. That includes a policy
# expression as PostgreSQL stores it, which a boot's guard compares against: the deparse
# wraps the `NULLIF` in parentheses, `tenant_id = (NULLIF(current_setting(…`, so one `(`
# directly before `NULLIF` is read as the same shape, and nothing else is.
patterns = [
  '\btenant_(?:id|key)(?:::text)?[\s\\]+(?:IS[\s\\]+NOT[\s\\]+DISTINCT[\s\\]+FROM|IS[\s\\]+NULL\b|=)(?![\s\\]*(?:\(?NULLIF[\s\\]*\([\s\\]*)?current_setting)',
]

[[family]]
name = "observer-scope"
# The observer admin API's tenant filter: an organisation sees its own and the global
# observers, changes and reads the executions of its own, and creates observers it owns.
patterns = ['\bscope\.(?:push_(?:visible|owned)|organisation)\s*\(']

[[family]]
name = "observer-scope-pass"
# A handler handing the caller's scope to the repository or to a check that reads it.
patterns = [
  '(?<!fn )\b(?:repository\.\w+|check_updated_observer|write_observer)\s*\([^;{]*?\bscope\b',
]

[[family]]
name = "operator-only"
# The extractor that refuses a tenant-scoped token on an observer surface spanning every tenant.
patterns = ['\b_\s*:\s*OperatorOnly\b']

[[family]]
name = "observer-refusal"
# Where the observer scope extractors refuse: no principal, a tenant that is no
# organisation, a tenant on an operator surface.
patterns = [
  '\bScopeRefusal::(?:Unauthenticated|TenantIsNotAnOrganisation|OperatorOnly)\b',
]

[[family]]
name = "principal"
# An admin-plane handler confining its principal: the tenant a request may act on, the
# rows it may see, the surfaces only the platform may write.
patterns = ['\bprincipal\s*\.\s*(?:scope|may_see|is_platform)\s*\(']

[[family]]
name = "rls-policy"
scan = "strings"
sql = true
# A row-level-security policy that restricts the rows a role reads or changes: its
# `USING (...)` clause (a `USING (true)` restricts nothing: family `rls-open-policy`).
# Policies are ENABLEd, not FORCEd, except where an example says otherwise, so a killer
# reads as a NOBYPASSRLS role that owns nothing; a read as the owner proves nothing.
patterns = [
  'CREATE[\s\\]+POLICY[\s\\]+\w+[\s\\]+ON[\s\\]+[\w.%]+[^;\0]*?\bUSING[\s\\]*\((?![\s\\]*true[\s\\]*\))',
]

[[family]]
name = "rls-enable"
scan = "strings"
sql = true
# Row-level security switched on for a table (`%I` where the DDL is built with `format`);
# without it a non-owner reads every row.
patterns = [
  'ALTER[\s\\]+TABLE[\s\\]+[\w.%]+[\s\\]+ENABLE[\s\\]+ROW[\s\\]+LEVEL[\s\\]+SECURITY',
]

[[family]]
name = "rls-open-policy"
scan = "strings"
sql = true
# A policy that restricts nothing, `USING (true)` or `WITH CHECK (true)`: the family
# `rls-policy` does not read it, so it is refused here unless an `[[exempt]]` row says
# what guards the table instead.
patterns = [
  'CREATE[\s\\]+POLICY[\s\\]+\w+[\s\\]+ON[\s\\]+[\w.%]+[^;\0]*?\b(?:USING|WITH[\s\\]+CHECK)[\s\\]*\([\s\\]*true[\s\\]*\)',
]

[[family]]
name = "with-tenant"
# A value scoped to the tenant a request or write resolved to: a run-as identity narrowed
# to the writing tenant, a REST handler's idempotency and cache scope, a change event's
# tenant stamp. Dropped, the value runs or is filed under no tenant.
patterns = ['\.with_tenant\s*\(']

[[family]]
name = "admin-failure-limiter"
# The admin planes' per-peer failure budget: a failure is counted, and a peer whose budget
# is spent is refused before its token is read.
patterns = ['\bfailure_limiter\.(?:is_blocked|record_failure)\s*\(']

[[family]]
name = "scope-check"
# A scope a caller or role must hold: the admin plane's admin scope, the scope that lets a
# caller end another user's sessions, the scopes a role grants for field-level access.
patterns = ['\.has_scope\s*\(']

[[family]]
name = "admin-principal-call"
# Each RBAC handler hands its caller's principal to the check that scopes it: a handler
# passing another principal, or none, would serve a tenant administrator another tenant's
# roles. The `principal` family covers the checks; this one covers every handler's call.
patterns = [
  '\b(?:visible_role|platform_only|scoped_tenant)\s*\(\s*(?:&state\s*,\s*)?principal\b(?!\s*:)',
]

[[family]]
name = "tenant-dispatch"
# A call that picks a tenant's executor and charges its quotas: an admission, a Flight
# session, a queued operation. Handed no tenant, it runs on the default executor, which
# serves another tenant's data.
patterns = ['(?<!fn )\bdispatch_to_tenant\s*\(']

[[family]]
name = "event-filter"
# The rule that keeps a tenant-scoped observer subscription to its tenant's events, and
# each transport's use of it: a transport that skipped it delivered every tenant's events.
patterns = ['\b[a-z_]*filter\.matches\s*\(', 'TenantScope::Tenant\s*\(\s*ref']

[[family]]
name = "enrichment-backstop"
# Each engine entry refuses a principal that never passed a transport's identity
# enrichment, when the schema declares an enriched-identity consumer: a transport that
# skipped the seam would otherwise reach the engine with an unresolved identity.
patterns = ['(?<!fn )\benforce_enrichment_resolved\s*\(']

[[family]]
name = "role-actor-gate"
# A read or write restricted to a role or to actor classes: each call to the shared
# gates, each inline role check, and the rule the role gate applies.
patterns = [
  '(?<!fn )\benforce_requires_(?:role|actor)\s*\(',
  'ctx\.roles\.iter\(\)\.any\(\|r\| r == role\)',
]

[[family]]
name = "field-authorizer-gate"
# A policy-gated field: each read and write path asks whether its selection reaches one
# (at the root, or below it, where the authorizer cannot decide), and refuses or puts the
# rows to the field authorizer.
patterns = [
  '(?<!fn )\bselection_set_(?:selects|has_nested)_gated_field\s*\(',
  '(?<!fn )\bdeny_if_gated_field_selected\s*\(',
]

[[family]]
name = "deployment-decision"
# Whether this process runs in production: where it is resolved from the environment
# (unset is production), and each check whose answer differs between the two.
patterns = [
  'Deployment::current\(\)',
  '(?<!fn )\bis_production\(\)',
  '!= Deployment::Production',
]

[[family]]
name = "executor"
patterns = ['\bexecutor_for(?:_tenant)?\s*\(']


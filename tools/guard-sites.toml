# Guard-site inventory: every authorization, session and tenancy guard site, its mutant
# and the tests that kill it. Checked by tools/check-guard-sites.py on every PR; each
# mutant is run by tools/run-guard-mutants.py. See docs/testing.md, "Guard-Site Mutation".

# ── Families: guard-shaped calls that must each be an inventoried site ──────────────

[[family]]
name = "session"
patterns = ['\bcheck_revocation\s*\(']

[[family]]
name = "dispatch"
patterns = ['\btenant\s*\.\s*dispatch\s*\(']

# ── Shards: the test command a site's killers run in ─────────────────────────────────

[[shard]]
name = "matrix"
crate = "crates/fraiseql-server"
command = "cargo test -p fraiseql-server --features 'arrow,auth,aws-s3,federation,grpc,mcp,metrics,observers,redis-apq,redis-pkce,redis-rate-limiting,rest,secrets,storage-transforms,testing,tracing-opentelemetry,webhooks' --test transport_refusal_matrix_e2e_pg -- --test-threads=1 --skip common"

[[shard]]
name = "grpc"
crate = "crates/fraiseql-server"
command = "cargo test -p fraiseql-server --features 'arrow,auth,aws-s3,federation,grpc,mcp,metrics,observers,redis-apq,redis-pkce,redis-rate-limiting,rest,secrets,storage-transforms,testing,tracing-opentelemetry,webhooks' --test grpc_transport_e2e_test refusal_cells"

[[shard]]
name = "bridge"
crate = "crates/fraiseql-server"
command = "cargo test -p fraiseql-server --features 'arrow,auth,aws-s3,federation,grpc,mcp,metrics,observers,redis-apq,redis-pkce,redis-rate-limiting,rest,secrets,storage-transforms,testing,tracing-opentelemetry,webhooks,admin-sql,export-csv,export-xlsx,functions-runtime-deno,inbound-email' --test tenant_rest_dispatch_e2e_pg function_writes -- --test-threads=1"

[[shard]]
name = "server-lib-auth"
crate = "crates/fraiseql-server"
command = "cargo test -p fraiseql-server --features auth --lib -- required_plane_revocation"

[[shard]]
name = "core-cache"
crate = "crates/fraiseql-core"
command = "cargo test -p fraiseql-core --lib cache::"


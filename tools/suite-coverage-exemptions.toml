# Exemptions for the no-orphan-suites gate (tools/check-suite-coverage.py).
#
# Every row is a suite that deliberately runs in no CI leg, with the published
# reason — opt-out is visible, never silent. A row whose target stops existing
# fails the gate (stale exemptions rot the ledger).

# ── Arrow Flight DB-backed binaries — pending gate G1 (#908 → P05) ───────────
# The Flight write/query surface itself is under a user decision (gate or
# delete, #953/#954). The DB fixtures and the `Closes #908` wiring are owned by
# P05 Cycle 3 of the 2026-08-06 remediation program; wiring them into the
# postgres leg before G1 would build fixtures for a surface that may be deleted.

[[exempt]]
target = "fraiseql-arrow::flight_integration"
reason = "pending G1 (#953/#954): Flight surface may be deleted; DB fixture + postgres-leg wiring owned by P05 Cycle 3 (#908)"

[[exempt]]
target = "fraiseql-arrow::flight_e2e_test"
reason = "pending G1 (#953/#954): Flight surface may be deleted; DB fixture + postgres-leg wiring owned by P05 Cycle 3 (#908)"

[[exempt]]
target = "fraiseql-arrow::flight_error_handling_test"
reason = "pending G1 (#953/#954): Flight surface may be deleted; DB fixture + postgres-leg wiring owned by P05 Cycle 3 (#908)"

# ── Codegen real-consumer gates — need network + external toolchains ─────────
# All four generate a client and compile it as a real consumer would, shelling
# out to that language's toolchain (uvx ty / npx tsc / go / cargo). The Dagger
# legs are offline by design, so these execute in `sdk-conformance.yml`'s
# `generated-clients` job — a GitHub-hosted, networked runner that installs all
# four toolchains and runs the four suites with `-- --ignored` on every push
# touching `crates/fraiseql-codegen/**`, `crates/fraiseql-cli/**` or `sdks/**`.
#
# They are exempt rather than covered because this gate reads `.dagger/main.go`
# only. Teaching it to read GitHub Actions `run:` blocks is the real fix and is
# tracked separately (#1120) — a parser that has to resolve `${{ matrix.* }}`
# and per-step `working-directory` is its own correctness surface, and a
# half-right one would report coverage that does not exist.

[[exempt]]
target = "fraiseql-codegen::client_py_consumer"
reason = "shells out to `uvx ty` (network + uv toolchain); offline Dagger legs cannot run it — executes in sdk-conformance.yml's `generated-clients` job, #1120 owns teaching this gate to see it"

[[exempt]]
target = "fraiseql-codegen::client_ts_consumer"
reason = "shells out to `npx`/`tsc` (network + Node toolchain); offline Dagger legs cannot run it — executes in sdk-conformance.yml's `generated-clients` job, #1120 owns teaching this gate to see it"

[[exempt]]
target = "fraiseql-codegen::client_go_consumer"
reason = "shells out to `gofmt`/`go build`/`go vet` (Go toolchain); offline Dagger legs cannot run it — executes in sdk-conformance.yml's `generated-clients` job, #1120 owns teaching this gate to see it"

[[exempt]]
target = "fraiseql-codegen::client_rust_consumer"
reason = "shells out to a nested `cargo check` (network: crates.io registry); offline Dagger legs cannot run it — executes in sdk-conformance.yml's `generated-clients` job, #1120 owns teaching this gate to see it"

# Exemptions for the no-orphan-suites gate (tools/check-suite-coverage.py).
#
# Every row is a deliberate opt-out with a published reason — visible, never
# silent. A row whose target stops existing fails the gate (stale exemptions rot
# the ledger), and so does one the tree has made unnecessary.
#
# THREE tables, and they are not interchangeable. Each names a different claim
# with a different remedy, and a shared table would let the cheapest one silently
# answer the others' question:
#
#   [[exempt]]      a test suite that runs in NO leg.  target = a suite id.
#   [[ungated]]     a suite that runs only where nothing can fail a merge (#1289).
#                   target = a suite id.
#   [[unrequired]]  a CHECK CONTEXT produced on every branch push that no rule
#                   requires (#1299).  target = a check context name, e.g.
#                   "Changelog Completeness" — not a suite id.
#
# There are no `[[unrequired]]` rows today: both contexts the gate found are
# required as of #1299. A row here is for a check that must run and must NOT
# gate — a flaky third-party probe, say — and the reason has to say which.

# ── Arrow Flight DB-backed binaries — pending gate G1 (#908 → P05) ───────────
# The Flight write/query surface itself is under a user decision (gate or
# delete, #953/#954). The DB fixtures and the `Closes #908` wiring are owned by
# P05 Cycle 3 of the 2026-08-06 remediation program; wiring them into the
# postgres leg before G1 would build fixtures for a surface that may be deleted.

[[exempt]]
target = "fraiseql-arrow::flight_integration"
reason = "pending G1 (#953/#954): Flight surface may be deleted; DB fixture + postgres-leg wiring owned by P05 Cycle 3 (#908)"

[[exempt]]
target = "fraiseql-arrow::flight_e2e_test"
reason = "pending G1 (#953/#954): Flight surface may be deleted; DB fixture + postgres-leg wiring owned by P05 Cycle 3 (#908)"

[[exempt]]
target = "fraiseql-arrow::flight_error_handling_test"
reason = "pending G1 (#953/#954): Flight surface may be deleted; DB fixture + postgres-leg wiring owned by P05 Cycle 3 (#908)"

# ── Codegen real-consumer gates: no longer exempt (#1120) ────────────────────
# The four `client_*_consumer` suites shell out to language toolchains and the
# network, so they cannot run in the offline Dagger legs and execute in
# `sdk-conformance.yml`'s `generated-clients` job instead. The gate now reads
# GitHub Actions `run:` blocks and sees that job directly, so the claim is
# checked rather than asserted: delete a `--test` flag from that step and the
# gate reports four orphans.

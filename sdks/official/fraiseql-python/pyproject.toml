[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[dependency-groups]
dev = [
  "pytest>=9.0.2",
  # anyio ships the `@pytest.mark.anyio` plugin itself; the separate
  # `pytest-anyio` PyPI name is a parked 2021 stub (0.0.0) that does nothing.
  "anyio[trio]>=4.0",
  "httpx>=0.27",
  "ruff>=0.8.0",
  # 0.0.107: an older ty narrowed a decorator's union return to the class, hiding the
  # union tests/test_decorator_typing.py pins.
  "ty>=0.0.107",
]

[project]
authors = [{ name = "FraiseQL Team" }]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Database :: Front-Ends",
]
dependencies = ["httpx>=0.27"]
description = "FraiseQL v2 - Compiled GraphQL execution engine (schema authoring)"
keywords = ["graphql", "database", "sql", "compiler", "schema"]
license = { text = "MIT" }
name = "fraiseql"
readme = "README.md"
requires-python = ">=3.15"
version = "2.19.1"

[project.optional-dependencies]
langchain = ["langchain-core>=0.2"]
llamaindex = ["llama-index-core>=0.10"]

[project.urls]
Documentation = "https://fraiseql.readthedocs.io"
Homepage = "https://github.com/fraiseql/fraiseql"
Issues = "https://github.com/fraiseql/fraiseql/issues"
Repository = "https://github.com/fraiseql/fraiseql"

[tool.hatch.build.targets.wheel]
packages = ["src/fraiseql"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
ignore = [
  "ANN401", # typing.Any usage allowed for dynamic types, **kwargs, runtime introspection
  # From Python 3.14 annotations are evaluated lazily, so these two treat an import used
  # only in annotations as runtime-unneeded. The decorators read annotations at runtime to
  # build the schema, so moving such imports under TYPE_CHECKING is not a mechanical fix.
  "TC001",
  "TC003",
]
# Select rule categories:
# E - pycodestyle errors
# F - pyflakes
# I - isort (import sorting)
# N - pep8-naming
# W - pycodestyle warnings
# UP - pyupgrade (modern Python syntax)
# ANN - flake8-annotations (type annotations)
# B - flake8-bugbear (likely bugs)
# C4 - flake8-comprehensions (better comprehensions)
# SIM - flake8-simplify (simplification suggestions)
# TCH - flake8-type-checking (type checking imports)
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "I",    # isort (import sorting)
  "N",    # pep8-naming
  "W",    # pycodestyle warnings
  "UP",   # pyupgrade (modern Python syntax)
  "ANN",  # flake8-annotations (type annotations)
  "B",    # flake8-bugbear (likely bugs)
  "C4",   # flake8-comprehensions (better comprehensions)
  "SIM",  # flake8-simplify (simplification suggestions)
  "TCH",  # flake8-type-checking (type checking imports)
  "ARG",  # flake8-unused-arguments
  "ERA",  # eradicate (commented-out code)
  "PL",   # pylint
  "RUF",  # Ruff-specific rules
  "PERF", # perflint
  "FURB", # refurb
]

[tool.ruff.lint.per-file-ignores]
"examples/**/*.py" = [
  "ERA001", # Field grouping comments are not commented-out code
]
"src/fraiseql/integrations/langchain.py" = [
  "ARG002", # run_manager is part of LangChain abstract interface; must be accepted but is unused
  "TC002",  # Runtime try/except imports cannot be moved to TYPE_CHECKING
]
"src/fraiseql/integrations/llamaindex.py" = [
  "TC001", # Runtime import used in __init__ constructor
]
"src/fraiseql/integrations/rag.py" = [
  "PLR0913", # The retrieval-source options are keyword-only configuration, not positional sprawl
]
"tests/**/*.py" = [
  "ANN",     # Don't require type annotations in tests
  "ARG",     # Mock handler signatures must accept unused arguments (e.g., request)
  "PLC0415", # Deferred imports in test functions are intentional (registry isolation)
  "PLR2004", # Magic values OK in tests
]

[tool.ty.environment]
python-version = "3.15"

[tool.ty.rules]
# Optional integration dependencies (langchain, llamaindex, pydantic) are not
# installed by default; suppress import-not-found for these extras.
import-not-found = "ignore"

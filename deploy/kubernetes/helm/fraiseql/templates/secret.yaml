{{- if not .Values.database.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fraiseql.databaseSecretName" . }}
  labels:
    {{- include "fraiseql.labels" . | nindent 4 }}
type: Opaque
{{/* ⚠ This lands in your values file AND in Helm's release storage. For anything
but a throwaway cluster, create the Secret yourself and set
database.existingSecret instead. */}}
stringData:
  {{ include "fraiseql.databaseSecretKey" . }}: {{ .Values.database.url | quote }}
{{- end }}

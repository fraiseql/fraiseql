{{- include "fraiseql.requireProductionConfig" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fraiseql.fullname" . }}
  labels:
    {{- include "fraiseql.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "fraiseql.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{/* Roll the pods when the schema changes. Without this a `helm upgrade`
        that only changes the compiled schema rewrites the ConfigMap and leaves
        every running pod serving the previous schema — kubelet eventually
        refreshes the mounted file, but the server reads it once, at startup. */}}
        fraiseql.io/schema-checksum: {{ include (print $.Template.BasePath "/schema-configmap.yaml") . | sha256sum }}
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "fraiseql.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "fraiseql.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: {{ .Chart.Name }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 12 }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.application.port }}
          protocol: TCP
        startupProbe:
          {{- toYaml .Values.startupProbe | nindent 12 }}
        livenessProbe:
          {{- toYaml .Values.livenessProbe | nindent 12 }}
        readinessProbe:
          {{- toYaml .Values.readinessProbe | nindent 12 }}
        resources:
          {{- toYaml .Values.resources | nindent 12 }}
        volumeMounts:
        - name: schema
          mountPath: {{ include "fraiseql.schemaMountDir" . }}
          readOnly: true
        {{- if include "fraiseql.configConfigMapName" . }}
        - name: config
          mountPath: {{ include "fraiseql.configMountDir" . }}
          readOnly: true
        {{- end }}
        env:
        {{- range $key, $value := .Values.env }}
        - name: {{ $key }}
          value: {{ $value | quote }}
        {{- end }}
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: {{ include "fraiseql.databaseSecretName" . }}
              key: {{ include "fraiseql.databaseSecretKey" . }}
        {{/* The compiled schema the server validates before it serves. The image
        bakes none; without this the container exits at startup. */}}
        - name: FRAISEQL_SCHEMA_PATH
          value: {{ include "fraiseql.schemaPath" . | quote }}
        {{/* Derived from application.port so the value means something. The image
        defaults to 0.0.0.0:8000; if the chart only set containerPort, changing
        application.port would move the probes and the Service off the port the
        process actually listens on — silently, which is exactly how #1216 was
        invisible for six months.

        0.0.0.0 rather than loopback for the reason the Dockerfile gives: the
        pod's network namespace is the boundary #874's loopback default asks for,
        and a probe runs INSIDE that namespace — so a loopback bind would let
        every probe pass over a pod that serves no traffic through the Service,
        which is worse than failing. */}}
        - name: FRAISEQL_BIND_ADDR
          value: "0.0.0.0:{{ .Values.application.port }}"
        {{- if include "fraiseql.configConfigMapName" . }}
        - name: FRAISEQL_CONFIG
          value: {{ include "fraiseql.configPath" . | quote }}
        {{- end }}
        {{- if .Values.tracing.otlpEndpoint }}
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: {{ .Values.tracing.otlpEndpoint | quote }}
        {{- end }}
      volumes:
      - name: schema
        configMap:
          name: {{ include "fraiseql.schemaConfigMapName" . }}
      {{- if include "fraiseql.configConfigMapName" . }}
      - name: config
        configMap:
          name: {{ include "fraiseql.configConfigMapName" . }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

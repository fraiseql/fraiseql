{{- if and .Values.authDatabase.url (not .Values.authDatabase.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fraiseql.authDatabaseSecretName" . }}
  labels:
    {{- include "fraiseql.labels" . | nindent 4 }}
type: Opaque
{{/* ⚠ Like database.url, this lands in your values file AND in Helm's release
storage. For anything but a throwaway cluster, create the Secret yourself and set
authDatabase.existingSecret instead. */}}
stringData:
  {{ include "fraiseql.authDatabaseSecretKey" . }}: {{ .Values.authDatabase.url | quote }}
{{- end }}

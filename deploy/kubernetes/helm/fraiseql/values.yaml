# Default values for the fraiseql Helm chart.
#
# ⚠ Every key below is READ BY A TEMPLATE. That is a property this chart did not
# have: it once shipped `ingress`, `podDisruptionBudget`, `persistence`,
# `monitoring`, `security`, `database.pool`, `service.targetPort` and a whole
# ConfigMap of environment variables that no template referenced and the server
# does not read. Rendering with every one of those toggles flipped to `true`
# produced output BYTE-IDENTICAL to the default render. They are gone rather than
# implemented — a value that does nothing is worse than an absent one, because it
# is configuration an operator believes they have set.
#
# tools/chart-deploy-test.sh holds this property: for every `<path>.enabled` key
# here it renders the chart both ways and requires the two renders to DIFFER.

# Image configuration
image:
  # Must be an image this project publishes. `fraiseql` alone resolved to
  # docker.io/library/fraiseql — the Docker Hub official-images namespace — so the
  # shipped defaults pulled nothing at all (#1129). The Docker Hub mirror is
  # `fraiseql/server`; tools/check-deploy-versions.sh accepts either.
  repository: ghcr.io/fraiseql/server
  pullPolicy: IfNotPresent
  # Pinned for reproducible deploys (never "latest"), and bumped by tools/release.sh —
  # not by remembering. It sat three releases stale because the comment below asked for
  # a manual step nobody had a reason to take. tools/check-deploy-versions.sh (ShellGates)
  # fails if it drifts from the workspace version again.
  tag: "2.15.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Replica configuration. Ignored while autoscaling.enabled is true — the HPA owns
# the replica count then, and setting both is how a Deployment and an HPA fight.
replicaCount: 3

# Pod annotations for metrics, logging, etc.
podAnnotations: {}

# Pod security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

# Container security context
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532

# Service configuration.
#
# `targetPort` is deliberately absent: the Service targets the container's NAMED
# port `http`, which is application.port below. A second number here could
# disagree with the container's, and a `targetPort` that no template read is
# exactly what this chart shipped.
service:
  type: ClusterIP
  port: 80
  annotations: {}

# Resource requests and limits
resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 512Mi

# Autoscaling configuration
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Health probes. All three pointed at /health, and all three were wrong for it.
#
# ⚠ /health is NOT a process-liveness endpoint, despite its own doc comment in
# crates/fraiseql-server/src/routes/health.rs claiming it is "always 200 while
# the process is alive". determine_status() returns "unhealthy" whenever the
# database health check fails, and the handler answers 503 for "unhealthy". The
# code and the comment above it disagree; the code is what runs.
#
# So a livenessProbe on /health makes the kubelet RESTART every pod for as long
# as Postgres is unreachable — a failover or a brief blip becomes a cluster-wide
# restart storm on top of the outage it was reacting to. A liveness probe must
# detect a broken PROCESS, never a broken dependency. There is no endpoint that
# reports process health alone, so liveness is a tcpSocket check: the process is
# up and holding its port.
#
# readinessProbe is /readiness, the endpoint built for it: 503 while the database
# is unreachable, so an affected pod leaves the Service's endpoints and stops
# receiving traffic — without being killed.
#
# startupProbe stays on /health deliberately. Before a pod has ever served,
# "cannot reach the database" IS a startup failure, and restarting is the right
# response to it.
startupProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 2
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 30    # 30 * 5s = 150s max startup time

livenessProbe:
  tcpSocket:
    port: http
  initialDelaySeconds: 0
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /readiness
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 2

# Node affinity and pod affinity
nodeSelector: {}

affinity: {}

tolerations: []

# Environment variables passed to the container verbatim.
#
# This map is the configuration escape hatch, and it is deliberately the ONLY
# one. fraiseql-server is configured by FRAISEQL_* environment variables (see
# `docs/` or `fraiseql-server --help` for the full list); typed value blocks that
# mapped onto a subset of them — `security.rate_limiting`, `monitoring.prometheus`
# — were removed because they were wired to nothing and could never cover the
# list. Anything the server reads can be set here:
#
#   env:
#     RUST_LOG: info
#     FRAISEQL_RATE_LIMITING_ENABLED: "true"
#     FRAISEQL_INTROSPECTION_ENABLED: "false"
env:
  RUST_LOG: info

# Database connection. Set EXACTLY ONE of `url` or `existingSecret`.
#
#   url             the chart creates a Secret containing it. Convenient for a
#                   throwaway or in-cluster database; the value lands in your
#                   values file and in Helm's release storage.
#   existingSecret  you create the Secret out of band; the chart only references
#                   it. This is the production shape.
#
# There is no default. The chart previously mounted DATABASE_URL from a Secret
# named `<release>-fraiseql-db` that no template created, so the shipped defaults
# installed cleanly and the pod never started (see _helpers.tpl).
database:
  url: ""
  existingSecret: ""
  existingSecretKey: url

# Compiled schema. Set EXACTLY ONE of `compiled` or `existingConfigMap`.
#
#   compiled           the compiled schema JSON itself. Supply it with
#                      `--set-file schema.compiled=schema.compiled.json` rather
#                      than pasting it; the chart creates the ConfigMap.
#   existingConfigMap  you create the ConfigMap; the chart mounts it.
#
# `key` is both the ConfigMap key and the file name it is mounted as. The
# published image bakes no schema, so without this the container exits at
# startup — fraiseql-server validates FRAISEQL_SCHEMA_PATH before it serves.
schema:
  compiled: ""
  existingConfigMap: ""
  key: schema.compiled.json

# Server configuration file (fraiseql.toml), mounted and passed as
# FRAISEQL_CONFIG. Set EXACTLY ONE of `content` or `existingConfigMap`.
#
# This is where everything the `env` map cannot express lives — cors_origins
# above all, which has no environment variable and which fraiseql-server
# REQUIRES before it will start in production mode. A minimal one:
#
#   cors_origins = ["https://app.example.com"]
#
# Supply it with `--set-file config.content=fraiseql.toml`. Required unless
# env.FRAISEQL_ENV is "development"; see fraiseql.requireProductionConfig in
# _helpers.tpl for why the chart refuses rather than deploying a pod that
# CrashLoopBackOffs.
config:
  content: ""
  existingConfigMap: ""
  key: fraiseql.toml

# Application configuration.
#
# `port` is the one number: the container's named port `http`, the port the
# Service targets, the port every probe hits, AND the address the server is told
# to bind (the Deployment derives FRAISEQL_BIND_ADDR from it). Those were four
# independent numbers, and the image's own was not among them — the chart said
# 8815 while the image binds 8000, so every probe was refused and the pod
# CrashLoopBackOff'd (#1216).
application:
  port: 8000

# Distributed tracing (OpenTelemetry)
tracing:
  # Set to an OTLP collector endpoint to enable distributed tracing.
  # When empty, no OTLP export occurs (zero overhead).
  otlpEndpoint: ""

# Service account configuration
serviceAccount:
  create: false
  annotations: {}
  name: ""

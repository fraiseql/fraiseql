# Hardened FraiseQL Kubernetes Manifests
# Security-first deployment with zero-trust principles
#
# ⚠ NOT CI-VERIFIED. The Helm chart under helm/fraiseql is the Kubernetes artifact
# this repository gates (tools/chart-deploy-test.sh deploys it into a throwaway
# k3s cluster and queries it). This file is a third hand-maintained copy of the
# same deployment and nothing executes it.

---
# Pod Security Policy (for K8s < 1.25)
apiVersion: policy/v1beta1
kind: PodSecurityPolicy
metadata:
  name: fraiseql-hardened
spec:
  privileged: false
  allowPrivilegeEscalation: false
  requiredDropCapabilities:
  - ALL
  volumes:
  - 'configMap'
  - 'emptyDir'
  - 'projected'
  - 'secret'
  - 'downwardAPI'
  - 'persistentVolumeClaim'
  hostNetwork: false
  hostIPC: false
  hostPID: false
  runAsUser:
    rule: 'MustRunAsNonRoot'
  seLinux:
    rule: 'MustRunAs'
    seLinuxOptions:
      level: "s0:c123,c456"
  readOnlyRootFilesystem: true

---
# NetworkPolicy - Deny all by default, allow specific ingress
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fraiseql-network-policy
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: fraiseql
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: default
    - podSelector:
        matchLabels:
          app: fraiseql
    ports:
    - protocol: TCP
      port: 8000
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8000
  egress:
  # Allow DNS
  - to:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
  # Allow traffic to PostgreSQL
  - to:
    - podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432
  # Allow traffic to Redis
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379

---
# Deployment - Hardened with security best practices
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraiseql
  namespace: default
  labels:
    app: fraiseql
    security-level: high
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fraiseql
  template:
    metadata:
      labels:
        app: fraiseql
      annotations:
        container.apparmor.security.beta.kubernetes.io/fraiseql: runtime/default
    spec:
      # Security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault

      # Pod disruption budget
      serviceAccountName: default
      terminationGracePeriodSeconds: 30

      containers:
      - name: fraiseql
        # Pinned for reproducible deploys (never :latest). Bumped by tools/release.sh.
        # `fraiseql:2.8.0` resolved to docker.io/library/fraiseql — the Docker Hub
        # official-images namespace, which this project cannot publish to (#1129).
        image: ghcr.io/fraiseql/server:2.15.0
        imagePullPolicy: IfNotPresent

        # Container security context
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add: []
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          seccompProfile:
            type: RuntimeDefault

        ports:
        - containerPort: 8000
          name: http
          protocol: TCP

        volumeMounts:
        - name: schema
          mountPath: /etc/fraiseql/schema
          readOnly: true

        # Environment variables
        env:
        - name: RUST_LOG
          value: "info"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: fraiseql-db
              key: url
        # The published image bakes no compiled schema, and fraiseql-server exits
        # at startup when FRAISEQL_SCHEMA_PATH names no file. Create it first:
        #   kubectl create configmap fraiseql-schema \
        #     --from-file=schema.compiled.json=schema.compiled.json
        - name: FRAISEQL_SCHEMA_PATH
          value: /etc/fraiseql/schema/schema.compiled.json
        # 8000 is the port the image binds. Every port above was 8815 — including
        # the NetworkPolicy rules, which would have dropped the traffic even once
        # the container listened (#1216).
        - name: FRAISEQL_BIND_ADDR
          value: "0.0.0.0:8000"

        # Resource constraints
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi

        # Probes
        # /live, not /health. /health answers 503 whenever the database health check
        # fails (routes/health.rs determine_status), so a liveness probe on it restarts
        # every pod for as long as Postgres is unreachable — turning a failover into a
        # restart storm, which restarting cannot fix. /live touches no dependency and is
        # always 200 (#1217). It replaces the tcpSocket stopgap this manifest used to
        # carry: a socket check cannot see a process that is deadlocked but still
        # holding its listener; answering /live requires the runtime to schedule a task.
        livenessProbe:
          httpGet:
            path: /live
            port: http
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3

        # /readiness, not /health. Both answer 503 when the database is down, so
        # this is not about admitting a broken pod — it is that /readiness is the
        # endpoint built for the question, and that liveness must NOT be an
        # endpoint which fails on a dependency (see the livenessProbe comment).
        readinessProbe:
          httpGet:
            path: /readiness
            port: http
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 2

        startupProbe:
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 30

      volumes:
      - name: schema
        configMap:
          name: fraiseql-schema

      # Pod affinity for distribution
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - fraiseql
              topologyKey: kubernetes.io/hostname

---
# Pod Disruption Budget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: fraiseql-pdb
  namespace: default
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: fraiseql

---
# Service
apiVersion: v1
kind: Service
metadata:
  name: fraiseql
  namespace: default
  labels:
    app: fraiseql
spec:
  type: ClusterIP
  selector:
    app: fraiseql
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http

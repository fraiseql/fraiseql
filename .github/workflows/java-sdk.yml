name: Java SDK

on:
  push:
    paths:
      - 'sdks/official/fraiseql-java/**'
      - '.github/workflows/java-sdk.yml'
      - 'tools/sdk-suite.sh'
  pull_request:
    paths:
      - 'sdks/official/fraiseql-java/**'
      - '.github/workflows/java-sdk.yml'
      - 'tools/sdk-suite.sh'

jobs:
  test:
    name: Java ${{ matrix.java-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sdks/official/fraiseql-java

    strategy:
      matrix:
        java-version: ['21']

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin
          cache: maven

      # The suite's commands live in tools/sdk-suite.sh, which `make test-sdks` also runs,
      # so this job and the local run cannot drift (#1346).
      - name: Verify, test and check style
        working-directory: .
        run: bash tools/sdk-suite.sh java

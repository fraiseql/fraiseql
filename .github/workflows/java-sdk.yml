name: Java SDK

on:
  push:
    paths:
      - 'sdks/official/fraiseql-java/**'
      - '.github/workflows/java-sdk.yml'
  pull_request:
    paths:
      - 'sdks/official/fraiseql-java/**'
      - '.github/workflows/java-sdk.yml'

jobs:
  test:
    name: Java ${{ matrix.java-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sdks/official/fraiseql-java

    strategy:
      matrix:
        java-version: ['21']

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin
          cache: maven

      - name: Verify and test
        run: mvn -B verify

      # No `continue-on-error`. It was there, over a checkstyle with no configured
      # ruleset, so 2149 `sun_checks.xml` violations rendered as a green check — a gate
      # that cannot fail, which reads as coverage (#1252). `pom.xml` now declares the
      # plugin against `checkstyle.xml` with `violationSeverity=warning`, and the tree is
      # clean, so this step failing means somebody introduced a violation.
      - name: Check style
        working-directory: sdks/official/fraiseql-java
        run: mvn -B checkstyle:check

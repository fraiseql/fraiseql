name: PHP SDK

on:
  push:
    paths:
      - 'sdks/official/fraiseql-php/**'
      - '.github/workflows/php-sdk.yml'
  pull_request:
    paths:
      - 'sdks/official/fraiseql-php/**'
      - '.github/workflows/php-sdk.yml'

jobs:
  test:
    name: PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sdks/official/fraiseql-php

    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3']

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc  # v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: json
          coverage: none

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      # #1184: PSR-4 compliance is not checked by anything else here. A plain
      # `composer install` autoloader cannot find a class whose file name does not
      # match it, so `SubscriptionBuilder::argument()` was an uncatchable fatal error
      # in any process that had not already loaded some other class from the same
      # file. `--optimize` alone hides it — the classmap it builds finds every class
      # in every scanned file regardless of name — which is why a production deploy
      # would not reproduce what a fresh install does. `--strict-psr` exits 1.
      - name: Check PSR-4 autoload correctness
        run: composer dump-autoload --optimize --strict-psr

      - name: Run PHPStan (level 8)
        run: vendor/bin/phpstan analyse src --level 8

      - name: Check code style
        run: vendor/bin/php-cs-fixer check src --diff

      - name: Run tests
        run: vendor/bin/phpunit

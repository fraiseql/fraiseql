name: PHP SDK

on:
  push:
    paths:
      - 'sdks/official/fraiseql-php/**'
      - '.github/workflows/php-sdk.yml'
      - 'tools/sdk-suite.sh'
  pull_request:
    paths:
      - 'sdks/official/fraiseql-php/**'
      - '.github/workflows/php-sdk.yml'
      - 'tools/sdk-suite.sh'

jobs:
  test:
    name: PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sdks/official/fraiseql-php

    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3']

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc  # v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: json
          coverage: none

      # The suite's commands live in tools/sdk-suite.sh, which `make test-sdks` also runs,
      # so this job and the local run cannot drift (#1346).
      - name: Install, PSR-4, PHPStan, style and tests
        working-directory: .
        run: bash tools/sdk-suite.sh php

name: Dagger — image

# Builds every image `docker-build.yml` publishes, on a trigger that PRECEDES the
# tag. Until this leg existed, `docker-build.yml` was the only thing that built a
# shipped image and it first ran after a `v*` tag already existed — which is how
# the release image stayed unbuildable for weeks without a single red check
# (#1205, #1107).
#
# ⚠ This workflow BUILDS and never pushes. `docker-build.yml` remains the only
# publisher, and its `build-and-push` step hardcodes `push: true` — correct only
# because that workflow's sole push trigger is a `v*` tag. Do NOT solve "build
# before the tag" by giving THAT file a branch trigger: the literal would start
# pushing branch builds to ghcr.io, and because it is a build-push-action input
# rather than a job `if:`, tools/check-workflow-job-reachability.py does not watch
# it and nothing would report the change (#1206's lesson, one layer down).
#
# One job calling one umbrella, not a matrix: a matrix here would be a fourth copy
# of the variant list, and tools/check-image-parity.py already holds the three
# that exist (both docker-build.yml matrices and .dagger/image.go) to each other.
# `dagger call images` iterates that table.
#
# Cost, measured 2026-08-26 on this runner: fraiseql-server 245s,
# fraiseql-server-full 260s, tutorial 12s; 8m00s for all three end to end. A re-run with a
# byte-identical context is 2s, but that is not what a push produces: Dagger keys
# the build on the whole context digest, so any change to a non-ignored file
# rebuilds everything (a docs-only edit cost a full 236s). Budget the full number.
#
# push-only (maintainer-controlled). fraiseql/fraiseql is PUBLIC, so a self-hosted
# runner must NOT execute fork `pull_request` code — NO pull_request trigger here.
on:
  push:
    branches: [dev, 'release/*']
  workflow_dispatch:

# packages: read lets the runner pull the private ghcr.io/fraiseql/* base-image
# mirror (.github/workflows/mirror-base-images.yml); contents: read for checkout.
# No packages: write — this leg builds and publishes nothing.
permissions:
  contents: read
  packages: read

concurrency:
  group: dagger-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: image
    runs-on: [self-hosted, fraiseql-8core]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      # The Dagger engine pulls the private ghcr.io/fraiseql/* base images via the
      # host's docker credentials; authenticate with the job's GITHUB_TOKEN first.
      - name: Log in to ghcr.io (private base-image mirror)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: dagger call images
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          dagger version
          dagger call images --source=.

      # What `images` above claims is exactly "these Dockerfiles build". This step
      # is what makes that mean something: it boots each server image on its own
      # CMD against a real Postgres, requires /health to report the database
      # connected, runs a GraphQL query that resolves THROUGH SQL to rows — and
      # then inserts a row behind the engine's back and requires it in the answer.
      #
      # That last check is the one that matters. The deleted `verify-deployment`
      # job asserted `{ __typename }`, which the GraphQL layer answers without
      # touching the database. Only "mutate the world, re-ask, require the answer
      # to change" separates a working engine from a healthy container.
      #
      # ⚠ `--run-id` is load-bearing, not decoration. Dagger caches a module
      # function call on its ARGUMENTS: called twice on a byte-identical context,
      # the second call returned in 2.1s replaying the first run's output, having
      # started no container and asserted nothing. Passing run_id + run_attempt
      # means a re-dispatch of an unchanged commit — how anyone re-verifies after
      # fixing infrastructure — executes for real instead of replaying a green.
      #
      # Cost: 5.8s measured for both variants, because the images this step boots
      # are the ones the step above just built and the engine cache is shared.
      - name: dagger call image-boots
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          dagger call image-boots --source=. \
            --run-id="${{ github.run_id }}-${{ github.run_attempt }}"

      # The two steps above claim "these Dockerfiles build" and "the artifact
      # answers". This one claims what the artifact IS — the properties the
      # v2.15.0 release-readiness pass verified BY HAND and wrote into #1133 and
      # #1129, which is to say the properties nothing has re-checked since.
      #
      # It reads the BUILT IMAGE, never the Dockerfile: linkage from `ldd` on the
      # binary the image's own CMD names, the package list from dpkg, the uid
      # from the process the image starts, the OCI label and the healthcheck from
      # the image config. tools/check-deploy-versions.sh greps the Dockerfile
      # text and stays the cheap floor; this asserts the text produced what it
      # describes.
      #
      # The HEALTHCHECK is EXECUTED: required to fail before the server exists,
      # pass while it serves, and fail again once it is killed. Without that last
      # state the tier is green for `HEALTHCHECK CMD true`.
      #
      # `--run-id` for the same reason as the step above: this tier's healthcheck
      # assertion is a claim about an execution, and Dagger will happily replay a
      # module function call it has seen these arguments for.
      - name: dagger call image-properties-all
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          dagger call image-properties-all --source=. \
            --run-id="${{ github.run_id }}-${{ github.run_attempt }}"

      # The three steps above cover the IMAGE. This one covers the Helm chart —
      # the other artifact an operator consumes, and the one `helm.yml` claimed
      # to check by running `helm lint` and rendering into /dev/null. A lint
      # never resolves an image, which is how the chart shipped
      # `repository: fraiseql` (docker.io/library/fraiseql, a namespace this
      # project cannot publish to) for several releases (#1129).
      #
      # Fixing that reference alone would have changed nothing: measured
      # 2026-08-27, `helm install` on the shipped defaults could not start a pod
      # for five further reasons — a Secret no template created, no mounted
      # schema, probes on a port the image does not bind (#1216 again), four
      # value toggles that rendered nothing, and no fraiseql.toml, without which
      # the server exits on cors_origins in production mode. So this step
      # deploys the chart into a throwaway k3s cluster, on the image the step
      # above built, and requires it to answer a GraphQL query through its
      # Service — then inserts a row behind it and requires that row back.
      #
      # ⚠ Not a `dagger call`, and that is measured rather than preferred: a
      # kubelet cannot start inside a Dagger exec on this engine, because the
      # exec's cgroup.controllers is empty (the engine's own cgroup root
      # delegates nothing). k3s exits with "failed to find cpu cgroup (v2)". The
      # cluster therefore runs under host docker, which does get delegation. The
      # image under test still comes from Dagger — `dagger call image-tarball`
      # exports what `buildVariant` builds, so this does not become a fourth
      # copy of the build arguments.
      #
      # `--run-id` names every docker object the script creates, so concurrent
      # or repeated runs cannot collide or silently reuse a stale cluster.
      - name: chart deploys into k3s and answers
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p target/chart-deploy
          dagger call image-tarball --source=. --variant=fraiseql-server \
            export --path=target/chart-deploy/fraiseql-server.tar
          bash tools/chart-deploy-test.sh \
            --run-id="${{ github.run_id }}-${{ github.run_attempt }}" \
            --image-tarball=target/chart-deploy/fraiseql-server.tar

name: Dagger — integration

# Phase 04 integration matrix (Track 0). The integration shards, onto
# Dagger-native service bindings (no testcontainers, no DinD): each suite binds its
# backing service(s) via dag.Container().AsService() + WithServiceBinding and the
# tests read the injected env URL through the fraiseql-test-support harness. Runs on
# the self-hosted runner (fraiseql-8core) at ~$0/min, reusing the box's
# cargo/target/sccache cache volumes (warm = fast). See docs/contributing/dagger-parity-notes.md Phase 04.
#
# max-parallel: 1 — the runner box is RAM-bound (31 GiB); suites run one at a time
# (preflight/test may still run alongside, up to the org-wide 2-runner cap).
#
# Runs on a push to every in-repo branch, not only `dev` (#1289). It used to be
# `branches: [dev]`, which is the same reasoning #1257 already had to undo for
# `Dagger — test`, and with the same consequence: a leg that runs only after the
# merge cannot fail one. Every `crates/*/tests/*_e2e_pg` suite executes HERE and
# nowhere else — they self-skip without DATABASE_URL, so on the DB-less required
# legs they read green while asserting nothing — and that is where the execution
# proof of most recent REST work lives. `dev` merged red on two of them and stayed
# red for two weeks with all four required checks green.
#
# The cost is bounded the same way `Dagger — test`'s is: the fast-forward to `dev`
# pushes the identical tree, so that run replays this one out of Dagger's
# content-addressed exec cache rather than repeating it. What it adds is runner
# occupancy on intermediate branch pushes — `cancel-in-progress` keeps only the
# head of each ref, and a cancelled run now BLOCKS rather than passing silently,
# which is the correct reading of "cancelled ≠ ran".
#
# Every `integration (<suite>)` context is a required check on `dev`; the list is
# mirrored in tools/required-checks.toml and enforced by
# tools/check-suite-coverage.py, which fails when a suite's only coverage is a leg
# that cannot fail a merge. Adding a suite to the matrix below means adding its
# context to both.
#
# push-only (maintainer-controlled). fraiseql/fraiseql is PUBLIC, so a self-hosted
# runner must NOT execute fork `pull_request` code — NO pull_request trigger here.
# `dependabot/**` is excluded for the same reason as in dagger-preflight.yml:
# Dependabot's degraded token cannot pull the private ghcr base image.
on:
  push:
    branches-ignore: ['dependabot/**', 'gh-readonly-queue/**']
  workflow_dispatch:

# packages: read lets the runner pull the private ghcr.io/fraiseql/* base + service
# image mirror (.github/workflows/mirror-base-images.yml); contents: read for checkout.
permissions:
  contents: read
  packages: read

concurrency:
  group: dagger-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: integration (${{ matrix.suite }})
    runs-on: [self-hosted, fraiseql-8core]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        suite: [postgres, nats, observers, http-e2e, tls, server, redis, vault, wire, storage, server-storage, federation, federation-compose, saml, quickstart, examples]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      # The Dagger engine pulls the private ghcr.io/fraiseql/* base + service images
      # via the host's docker credentials; authenticate with GITHUB_TOKEN first.
      - name: Log in to ghcr.io (private base-image mirror)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: dagger call test-integration --suite=${{ matrix.suite }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          dagger version
          dagger call test-integration --source=. --suite=${{ matrix.suite }}

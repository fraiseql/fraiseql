name: Dagger — integration

# Phase 04 integration matrix (Track 0). The integration shards, onto
# Dagger-native service bindings (no testcontainers, no DinD): each suite binds its
# backing service(s) via dag.Container().AsService() + WithServiceBinding and the
# tests read the injected env URL through the fraiseql-test-support harness. Runs on
# the self-hosted runner (fraiseql-8core) at ~$0/min, reusing the box's
# cargo/target/sccache cache volumes (warm = fast). See docs/contributing/dagger-parity-notes.md Phase 04.
#
# max-parallel: 2 — one suite per runner box. Every suite builds into ONE target
# cache volume (integrationBase), mounted PRIVATE, so two suites on the same
# engine serialize on it. Each box runs its own engine with its own copy of the
# volume, so with one runner per box (archbox, forge) two suites never share one.
# Raising this past the number of boxes, or adding a second runner to a box,
# buys queueing inside Dagger, not parallelism — that needs per-lane target
# volumes first, as feature-combos.go does. RAM is not the limit: the 31 GiB
# ceiling that set this to 1 is gone (archbox 94 GiB, forge 125 GiB).
#
# Runs on a push to every in-repo branch, not only `dev` (#1289). It used to be
# `branches: [dev]`, which is the same reasoning #1257 already had to undo for
# `Dagger — test`, and with the same consequence: a leg that runs only after the
# merge cannot fail one. Every `crates/*/tests/*_e2e_pg` suite executes HERE and
# nowhere else — they self-skip without DATABASE_URL, so on the DB-less required
# legs they read green while asserting nothing — and that is where the execution
# proof of most recent REST work lives. `dev` merged red on two of them and stayed
# red for two weeks with all four required checks green.
#
# The cost is bounded the same way `Dagger — test`'s is: the fast-forward to `dev`
# pushes the identical SHA, and the `already-passed` job skips the leg there when
# the branch run passed (the exec cache did not replay it: 2h06m on `dev` after
# 2h23m on the branch, 2026-09-08). What it adds is runner
# occupancy on intermediate branch pushes — `cancel-in-progress` keeps only the
# head of each ref, and a cancelled run now BLOCKS rather than passing silently,
# which is the correct reading of "cancelled ≠ ran".
#
# Every `integration (<suite>)` context is a required check on `dev`; the list is
# mirrored in tools/required-checks.toml and enforced by
# tools/check-suite-coverage.py, which fails when a suite's only coverage is a leg
# that cannot fail a merge. Adding a suite to the matrix below means adding its
# context to both.
#
# push-only (maintainer-controlled). fraiseql/fraiseql is PUBLIC, so a self-hosted
# runner must NOT execute fork `pull_request` code — NO pull_request trigger here.
# `dependabot/**` is excluded for the same reason as in dagger-preflight.yml:
# Dependabot's degraded token cannot pull the private ghcr base image.
on:
  push:
    branches-ignore: ['dependabot/**', 'gh-readonly-queue/**']
  workflow_dispatch:

# packages: read lets the runner pull the private ghcr.io/fraiseql/* base + service
# image mirror (.github/workflows/mirror-base-images.yml); contents: read for checkout.
permissions:
  contents: read
  packages: read
  # actions: read lets already-passed.yml see this workflow's earlier runs.
  actions: read

concurrency:
  group: dagger-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Skips the leg when this SHA already passed it — the fast-forward to `dev`
  # pushes a commit its branch push just tested. See already-passed.yml.
  already-passed:
    name: already passed
    uses: ./.github/workflows/already-passed.yml
    with:
      workflow: dagger-integration.yml

  integration:
    needs: already-passed
    if: ${{ !cancelled() && needs.already-passed.outputs.passed != 'true' }}
    name: integration (${{ matrix.suite }})
    runs-on: [self-hosted, fraiseql-8core]
    # Per-suite limits (#1885, #1890): the slowest successful first-attempt runtime
    # (the `dagger call` step) ×1.3, with a 20-min floor. A leg is slowest the first
    # time a runner builds a tree its cache has not seen, and slowest of all on
    # `forge`, so a limit taken from warm runs cancels a healthy cold one. MEASURED is
    # a runtime from the jobs API over 2026-10-24 → 11-02; PROJECTED is an
    # extrapolation, not a forge measurement.
    #   MEASURED, under the floor: examples 2.5 · federation-compose 3.8 · nats 9.9 ·
    #     server-storage 6.2 · vault 6.3 · wire 7.5 → 20
    #   MEASURED: quickstart 15.9 → 21 · http-e2e 20.6 → 28 · saml 22.4 → 30
    #     tls 17.9 → 24 (forge, the v2.19.0 tree on dev)
    #     federation 25.1 → 33 (forge, cold: 7.4 min compiling the binary, 17.4 the
    #       test; the 20 floor cancelled the next cold run at 20.2)
    #     redis 47.1 → 62 (forge, the v2.19.0 tree on dev; 50 left it 6% headroom)
    #   PROJECTED from one same-tree pair. PR #1899's tree ran observers first on
    #   forge, cancelled at 49.3, and then on fraiseql-8core, 27.4. Their first 19
    #   cargo builds took 40.8 min on forge and 5.0 on 8core: 8.2×. For each leg, its
    #   8core compile time on that tree ×8.2, plus its other time ×2.5 (forge's
    #   per-job slowness):
    #     server: 15.6 compile + 4.6 other → 139.3 → 182 (8core 20.2; no forge run
    #       of the post-#1885 shape exists; the old shape was cut at 60.2 on forge)
    #     observers: 40.8 done on forge + 7.4 ×8.2 still to compile + 15.0 ×2.5 other
    #       → 139.3 → 182
    #     storage: 3.7 compile + 0.6 other → 31.8 → 42
    #   These three are the cost of compiling every feature set again on a cold
    #   forge; a hung leg can now hold it ~3 h. Re-derive them from cold runs once the
    #   observers superset (#1902) and #1886 land.
    #   postgres: 100, a projection, not a measurement. Its worst completed first
    #     attempt is 54.9 (×1.3 = 72), but on the tree at 4e80193f0 the leg has not
    #     completed: two attempts were cut off at 60, still compiling, its --lib
    #     feature-set builds 2.2-2.7× slower than in a 51.5-min run before them.
    #     Aligned build by build against that run, they project to ~68 warm and
    #     ~77 cold; 77 ×1.3 = 100. Its serial feature-set builds are the cause,
    #     tracked in #1886; re-set this from measured runs when that lands.
    # A suite missing from the map gets 60.
    timeout-minutes: ${{ fromJSON('{"examples":20,"federation":33,"federation-compose":20,"http-e2e":28,"nats":20,"observers":182,"postgres":100,"quickstart":21,"redis":62,"saml":30,"server":182,"server-storage":20,"storage":42,"tls":24,"vault":20,"wire":20}')[matrix.suite] || 60 }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        suite: [postgres, nats, observers, http-e2e, tls, server, redis, vault, wire, storage, server-storage, federation, federation-compose, saml, quickstart, examples]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      # The Dagger engine pulls the private ghcr.io/fraiseql/* base + service images
      # via the host's docker credentials; authenticate with GITHUB_TOKEN first.
      - name: Log in to ghcr.io (private base-image mirror)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: dagger call test-integration --suite=${{ matrix.suite }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          dagger version
          dagger call test-integration --source=. --suite=${{ matrix.suite }}

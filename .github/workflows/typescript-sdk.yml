name: TypeScript SDK

on:
  push:
    paths:
      - 'sdks/official/fraiseql-typescript/**'
      - '.github/workflows/typescript-sdk.yml'
      - 'tools/sdk-suite.sh'
  pull_request:
    paths:
      - 'sdks/official/fraiseql-typescript/**'
      - '.github/workflows/typescript-sdk.yml'
      - 'tools/sdk-suite.sh'

jobs:
  test:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sdks/official/fraiseql-typescript

    strategy:
      matrix:
        node-version: ['20', '22']

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: sdks/official/fraiseql-typescript/package-lock.json

      # The suite's commands live in tools/sdk-suite.sh, which `make test-sdks` also runs,
      # so this job and the local run cannot drift (#1346).
      - name: Lint, type-check, test and build
        working-directory: .
        run: bash tools/sdk-suite.sh typescript

  # npm publishing is handled exclusively by .github/workflows/npm-publish.yml
  # (Trusted Publishing / OIDC, no NPM_TOKEN). This workflow is CI-only.

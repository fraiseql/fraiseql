name: Mirror base images to ghcr.io

# The CI base + service images are Docker Hub images, whose pull-rate-limit (429)
# periodically red-lines the self-hosted runner — one authenticated `fraiseql`
# Docker Hub account is shared across the whole release+CI load, so a busy day
# (a release + Dependabot + a few pushes) exhausts the 6-hour pull budget and every
# `dagger call` leg fails resolving `rust:1.95` / `postgres:18` / etc.
#
# This job mirrors each of those images into ghcr.io/fraiseql/*, which the Dagger
# engine then pulls with the workflow GITHUB_TOKEN (`permissions: packages: read`) and
# NO Docker Hub involvement. All the mirrors are PRIVATE packages; the legs authenticate
# rather than pulling anonymously, unlike the public ghcr.io/apollographql/router. crane
# copies registry-to-registry (all platforms, no local `docker pull`), so it does not
# itself touch the self-hosted runner: it runs on a GitHub-hosted runner with a fresh
# IP and its own Docker Hub budget, pulling each image once.
#
# Keep IMAGES below in sync with the image constants in `.dagger/main.go` (and the
# shared `rustImage` used by `.dagger/security.go`). The `.dagger` side points at the
# ghcr.io/fraiseql/* tags this job publishes. tools/check-image-mirror.py (preflight)
# requires every one of those tags to be a destination here, and every row to be
# pinned on both sides: a version tag or a @sha256: digest, never `:latest`.
#
# MinIO stopped publishing community images in 2025: docker.io/minio/minio stopped
# resolving anonymously, and quay.io/minio/minio now grants an anonymous token no pull
# access. The minio row copies Chainguard's from-source build, which publishes only a
# moving `:latest`, so the row pins its multi-arch index digest and names the
# destination tag after the MinIO release inside it (`minio --version`) (#1453).

on:
  workflow_dispatch:
  schedule:
    # Weekly re-copy, so a deleted or expired ghcr package comes back within a week
    # and an upstream that stops serving a pinned row turns this job red. Every row is
    # pinned, so a re-copy changes no bytes. Monday 04:17 UTC.
    - cron: "17 4 * * 1"

permissions:
  contents: read
  packages: write

concurrency:
  group: mirror-base-images
  cancel-in-progress: false

jobs:
  mirror:
    name: crane copy docker.io -> ghcr.io/fraiseql
    runs-on: ubuntu-latest
    steps:
      - name: Install crane (pinned + checksum-verified)
        run: |
          set -euo pipefail
          VERSION=v0.21.6
          SHA256=7ebbdcd05b652345c1f5105f8475e518534b90d66f3bdb50017be63f426ea435
          curl -fsSL -o crane.tgz \
            "https://github.com/google/go-containerregistry/releases/download/${VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "${SHA256}  crane.tgz" | sha256sum -c -
          tar -xzf crane.tgz crane
          sudo install -m 0755 crane /usr/local/bin/crane
          crane version

      - name: Log in to ghcr.io
        run: crane auth login ghcr.io -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"

      - name: Mirror images
        run: |
          set -euo pipefail
          # src (Docker Hub) | dst (ghcr.io/fraiseql, org/name flattened to fraiseql/<name>)
          #
          # DATA ONLY between the quotes: every non-blank line is split on '|' and fed to
          # crane, so a comment line inside the string is copied as an image name and fails
          # the job. The string is double-quoted, so a backtick in there would also run as
          # command substitution. Keep prose out here.
          #
          # Both the floating rust:1.95 and the patch-pinned rust:1.95.0 are mirrored (the
          # MSRV), and the 1.94 pair stays so an older checkout still resolves. Docker's
          # rust:1.95 tracks the newest 1.95.x, so a leg pinned to it silently stops testing
          # the rust-version we declare the day 1.95.1 ships; .dagger pins the exact patch.
          #
          # PostgreSQL 18 is the supported floor (#1452): pgvector:pg18 is the service image.
          # postgres:17 is mirrored because the floor-refusal suites need a server below it.
          # The pg16 pair stays so an older checkout still resolves.
          IMAGES="
          docker.io/library/rust:1.94|ghcr.io/fraiseql/rust:1.94
          docker.io/library/rust:1.94.1|ghcr.io/fraiseql/rust:1.94.1
          docker.io/library/rust:1.95|ghcr.io/fraiseql/rust:1.95
          docker.io/library/rust:1.95.0|ghcr.io/fraiseql/rust:1.95.0
          docker.io/library/ubuntu:24.04|ghcr.io/fraiseql/ubuntu:24.04
          docker.io/library/postgres:16|ghcr.io/fraiseql/postgres:16
          docker.io/pgvector/pgvector:pg16|ghcr.io/fraiseql/pgvector:pg16
          docker.io/library/postgres:17|ghcr.io/fraiseql/postgres:17
          docker.io/library/postgres:18|ghcr.io/fraiseql/postgres:18
          docker.io/pgvector/pgvector:pg18|ghcr.io/fraiseql/pgvector:pg18
          docker.io/library/redis:7-alpine|ghcr.io/fraiseql/redis:7-alpine
          docker.io/library/nats:2.10-alpine|ghcr.io/fraiseql/nats:2.10-alpine
          docker.io/apache/kafka:4.3.1|ghcr.io/fraiseql/kafka:4.3.1
          docker.io/localstack/localstack:3.8|ghcr.io/fraiseql/localstack:3.8
          docker.io/hashicorp/vault:1.17|ghcr.io/fraiseql/vault:1.17
          docker.io/mailhog/mailhog:v1.0.1|ghcr.io/fraiseql/mailhog:v1.0.1
          docker.io/fsouza/fake-gcs-server:1.56.1|ghcr.io/fraiseql/fake-gcs-server:1.56.1
          cgr.dev/chainguard/minio@sha256:e7ca559d9f7c0b5f24f5f669bb92f40f3ca88d56273b808bf3a7c116c17d2ffa|ghcr.io/fraiseql/minio:RELEASE.2026-09-22T19-25-18Z
          "
          rc=0
          # here-string, not `echo | while`: a pipe would run the loop in a subshell
          # and `rc` would not survive to `exit`.
          while IFS='|' read -r src dst; do
            [ -z "${src// }" ] && continue
            echo "::group::$src -> $dst"
            # A digest-pinned row whose destination already holds that digest is done:
            # nothing upstream can change it, and an upstream that has since dropped
            # the digest (Chainguard's free tier keeps only a moving tag) must not
            # redden a mirror that is already correct.
            if [[ "$src" == *@sha256:* ]] && [ "$(crane digest "$dst" 2>/dev/null)" = "${src##*@}" ]; then
              echo "✅ $dst already holds ${src##*@}"
            elif crane copy "$src" "$dst"; then
              echo "✅ mirrored $dst"
            else
              echo "::error::failed to mirror $src -> $dst"
              rc=1
            fi
            echo "::endgroup::"
          done <<< "$IMAGES"
          exit $rc

      - name: Reminder — a NEW package name needs repository access, a new tag does not
        run: |
          echo "Mirror complete. All the mirrored packages are PRIVATE, and every Dagger leg"
          echo "pulls them fine: the legs authenticate with the workflow GITHUB_TOKEN under"
          echo "'permissions: packages: read'. Nothing here needs to be made public."
          echo
          echo "A ghcr package is the IMAGE NAME; tags live inside it. So adding a tag to an"
          echo "existing name (rust:1.94 -> rust:1.94.1) inherits that package's access and"
          echo "needs no action. Only a brand-new package NAME does, and then the fix is to"
          echo "grant the fraiseql/fraiseql repo access — not to publish it publicly:"
          echo "  https://github.com/orgs/fraiseql/packages/container/<name>/settings"
          echo "Packages: rust ubuntu postgres pgvector redis nats vault mailhog fake-gcs-server minio"

name: SDK Schema Parity

# Every SDK's `schema.json` must agree with Python's, and with the committed golden
# fixture, before any of it reaches the compiler.
#
# One gate, one definition. The comparison lives in `sdks/official/tests/run_parity.sh`
# and is what `make test-parity` runs too. There used to be two: this workflow compared
# three SDKs strictly and seven more behind `continue-on-error`, while `make test-parity`
# compared a different five plus the golden fixture and ran only in a legacy workflow that
# had been failing for unrelated reasons. Between them they read as full coverage — while
# the soft comparison had in fact been crashing on PHP's field shape every single run, so
# PHP, Java, Ruby, Rust and the golden had never been compared once (#952).
#
# Deliberately narrower than `sdk-conformance.yml`, which compiles: this compares the
# authored document, before the compiler has had a chance to normalise anything.

on:
  push:
    paths:
      - 'sdks/official/**'
      - 'tests/fixtures/golden/parity-schema.json'
      - '.github/workflows/sdk-parity.yml'
  pull_request:
    paths:
      - 'sdks/official/**'
      - 'tests/fixtures/golden/parity-schema.json'
      - '.github/workflows/sdk-parity.yml'
  workflow_dispatch:

concurrency:
  group: sdk-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    name: Cross-SDK schema parity
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      # Every toolchain the script requires, installed without `continue-on-error`.
      # A setup step that is allowed to fail turns its SDK into a silent skip, and a
      # skipped SDK reads exactly like a passing one — the failure mode this gate exists
      # to end. If a toolchain cannot be installed, this job goes red.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install uv

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '20'

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6
        with:
          go-version: '1.23'
          cache-dependency-path: sdks/official/fraiseql-go/go.sum

      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc  # v2
        with:
          php-version: '8.2'
          tools: composer

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1  # v2
        with:
          shared-key: sdk-parity
          workspaces: sdks/official/fraiseql-rust

      - name: Install SDK dependencies
        working-directory: sdks/official
        run: |
          set -euo pipefail
          (cd fraiseql-python && uv sync)
          (cd fraiseql-typescript && npm ci)
          (cd fraiseql-go && go mod download)
          (cd fraiseql-php && composer install --prefer-dist --no-progress)

      # No `--allow-missing`: every SDK listed in the script must produce a schema and
      # be compared, or this job fails.
      - name: Cross-SDK parity
        run: sdks/official/tests/run_parity.sh

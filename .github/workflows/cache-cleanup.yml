name: Cache Cleanup

# Deletes caches older than N days, keeping refs/heads/dev and refs/heads/main.
#
# Hosted CI disabled 2026-05-31 — Dagger CI migration (Track 0). The PR and schedule
# triggers were stripped and workflow_dispatch kept, so this runs only when a human
# presses Run. The PR-close job that survived that strip was gated on a pull_request
# this workflow could no longer receive and had never run since; it was deleted with
# the rest of that class (#1206), and the second job's `!= 'pull_request'` guard — a
# constant once the first job was gone — went with it.
on:
  workflow_dispatch:
    inputs:
      max_age_days:
        description: 'Delete caches older than N days (dev/main excluded). Default 7.'
        required: false
        default: '7'
        type: string

permissions:
  actions: write
  contents: read

jobs:
  age-cleanup:
    name: Delete caches older than N days
    runs-on: ubuntu-latest
    steps:
      - name: Delete old caches (excluding dev/main)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          MAX_AGE_DAYS: ${{ inputs.max_age_days || '7' }}
        run: |
          set -euo pipefail
          cutoff=$(date -u -d "${MAX_AGE_DAYS} days ago" +%s)
          echo "Deleting caches created before $(date -u -d "@$cutoff" --iso-8601=seconds)"
          echo "Preserving refs/heads/dev and refs/heads/main"

          # gh cache list paginates; --limit 1000 is the API max per call
          mapfile -t rows < <(
            gh cache list --limit 1000 \
              --json id,createdAt,ref \
              --jq '.[] | "\(.id)|\(.createdAt)|\(.ref)"'
          )

          deleted=0
          kept=0
          for row in "${rows[@]}"; do
            IFS='|' read -r id created ref <<<"$row"
            created_ts=$(date -u -d "$created" +%s)

            if [ "$ref" = "refs/heads/dev" ] || [ "$ref" = "refs/heads/main" ]; then
              kept=$((kept + 1))
              continue
            fi
            if [ "$created_ts" -ge "$cutoff" ]; then
              kept=$((kept + 1))
              continue
            fi

            if gh cache delete "$id"; then
              deleted=$((deleted + 1))
            else
              echo "::warning::Failed to delete cache $id"
            fi
          done

          echo "Deleted: $deleted   Kept: $kept"

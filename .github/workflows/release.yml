name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: "sccache"

permissions:
  contents: write
  packages: write

jobs:
  # Validate release prerequisites
  validate-release:
    name: Validate Release Prerequisites
    environment: release
    runs-on: ubuntu-latest
    # The dry run below verify-builds all 21 publishable crates (15 minutes on a
    # 24-core box, with no sccache here). Its predecessor stopped early at every crate
    # whose new sibling was not yet published, so it fitted in 30.
    timeout-minutes: 90
    env:
      RUSTC_WRAPPER: ""
    steps:
      - name: Validate required secrets
        run: |
          echo "## Secrets Validation" >> "$GITHUB_STEP_SUMMARY"
          MISSING=0

          if [ -z "${{ secrets.CARGO_TOKEN }}" ]; then
            echo "CARGO_TOKEN missing" >> "$GITHUB_STEP_SUMMARY"; MISSING=1
          else
            echo "CARGO_TOKEN present" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -z "${{ secrets.PYPI_TOKEN }}" ]; then
            echo "PYPI_TOKEN missing" >> "$GITHUB_STEP_SUMMARY"; MISSING=1
          else
            echo "PYPI_TOKEN present" >> "$GITHUB_STEP_SUMMARY"
          fi

          # npm uses Trusted Publishing (OIDC) in npm-publish.yml — no NPM_TOKEN.

          if [ "$MISSING" -eq 1 ]; then
            echo "::error::Required secrets missing — cannot proceed with release"
            exit 1
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          # The changelog gate below resolves its base from the newest v* tag that
          # is not the tag being validated, and reads `Closes #N` across the whole
          # release range. A shallow, tagless checkout gives it an empty range and
          # a vacuous pass (#1127).
          fetch-depth: 0

      # A tag cannot be cut on an incomplete changelog. 48 issues closed since
      # v2.14.1 — including an entire security wave of production fail-closed boot
      # changes — were absent from CHANGELOG.md when this release was scoped, and
      # nothing in the pipeline noticed (#1127).
      - name: Changelog documents every issue closed since the last release
        run: bash tools/check-changelog-issues.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      # Packages and verify-builds every publishable crate before anything is
      # published, catching packaging regressions (gitignored files or build.rs side
      # effects in the .crate tarball) that shipped v2.3.0/v2.3.1 tags whose publish
      # then failed. `cargo package` resolves each workspace sibling from the packages
      # it has just built rather than from crates.io, so a crate whose new sibling
      # version is not published yet verifies like any other: no failure is forgiven.
      # It needs no token and uploads nothing.
      #
      # A crate already on crates.io at this version (a rerun after a partial
      # publish) is left out, as the publish job skips it. Packaged again, it would
      # sit beside the published copy with a different checksum, and the dependents
      # that lock both fail ("checksum for `fraiseql-cli` changed between lock
      # files"); left out, they verify against the published copy they will resolve.
      - name: Package and verify every publishable crate
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/v}"
          ORDER="$(python3 tools/publish-order.py)"
          args=()
          while read -r crate; do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' -H 'User-Agent: fraiseql-ci' "https://crates.io/api/v1/crates/$crate/$VERSION")" = "200" ]; then
              echo "$crate $VERSION already published, not packaged"
            else
              args+=(--package "$crate")
            fi
          done <<<"$ORDER"
          if [ "${#args[@]}" -eq 0 ]; then
            echo "every crate is already published at $VERSION"
            exit 0
          fi
          cargo package "${args[@]}"

  # Create GitHub release using gh CLI
  create-github-release:
    name: Create GitHub Release
    needs: validate-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          TAG="v${VERSION}"
          PRERELEASE="false"
          [[ "$VERSION" =~ alpha|beta|rc ]] && PRERELEASE="true"

          # Check if release already exists (use tag name, not full ref)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, updating..."
            gh release edit "$TAG" \
              --title "Release $TAG" \
              --prerelease=$PRERELEASE
          else
            echo "Creating release $TAG..."
            gh release create "$TAG" \
              --title "Release $TAG" \
              --notes "FraiseQL $VERSION — see [CHANGELOG.md](CHANGELOG.md) for details." \
              --draft=false \
              --prerelease=$PRERELEASE
          fi

  # Kick off SBOM generation for this release.
  #
  # The release above is created with the default GITHUB_TOKEN, and GitHub suppresses
  # workflow runs from events triggered by that token (recursion prevention). So the
  # `release: published` event NEVER reaches sbom-generation.yml — which is exactly why
  # the v2.13.1 release produced no SBOM. `workflow_dispatch` and `repository_dispatch`
  # are the ONLY events exempt from that suppression, so dispatch the SBOM workflow
  # explicitly here instead of relying on the (suppressed) release event.
  trigger-sbom:
    name: Trigger SBOM generation
    needs: create-github-release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Least-privilege: a job-level permissions block REPLACES the workflow default, so
    # this grants ONLY the actions:write needed to dispatch another workflow.
    permissions:
      actions: write
    steps:
      - name: Dispatch SBOM Generation for this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          TAG="v${VERSION}"
          gh workflow run sbom-generation.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$TAG" \
            -f version="$VERSION"
          echo "Dispatched sbom-generation.yml for $VERSION (ref $TAG)."

  # Build binaries for multiple platforms
  build-binaries:
    name: Build Binary (${{ matrix.target }})
    needs: create-github-release
    runs-on: ${{ matrix.os }}
    # Native targets build the lean umbrella, the `-full` (V8) umbrella, AND the
    # standalone `fraiseql-server` (#643) in one job. The V8 crate artifact is shared
    # across the two -full builds, but fraiseql-server is a large crate; V8 release
    # compilation is heavy, so allow generous headroom over the lean-only 60m.
    # 2.17.0's slowest target (aarch64-apple-darwin) took 107m of the old 120m, and
    # #1621 adds rest, arrow and cdc-outbound to both -full builds (+14-15% each,
    # measured on the arm64 smoke). A timeout here strands a half-published release.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: fraiseql
            archive_ext: tar.gz
            # Build against an OLD glibc floor with cargo-zigbuild so the binaries
            # run on Debian 12 (glibc 2.36) and older. `ubuntu-latest` is glibc 2.39,
            # and std's weak pidfd spawn symbols (pidfd_getpid/pidfd_spawnp@GLIBC_2.39)
            # otherwise make the umbrella binary refuse to load on <2.39 (#gh issue).
            zig_target: x86_64-unknown-linux-gnu.2.28
          # Native arm64 (#649). This used to be a `cross` build, which forced
          # `lean_only` because V8 does not build under the cross Docker images —
          # so ARM-Linux adopters got neither the platform-feature umbrella nor a
          # prebuilt `fraiseql-server`, and had to build from source or use Docker.
          # A native arm64 runner removes the constraint at the root. `zig_target`
          # applies the same glibc floor as every other Linux row: the runner is
          # glibc 2.39 and the ceiling gate below rejects anything above 2.34.
          # `release-smoke.yml`'s `arm64-full` job builds and BOOTS this artefact on
          # a real arm64 runner, and is dispatchable so it can be proven outside a
          # release cut.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: fraiseql
            archive_ext: tar.gz
            zig_target: aarch64-unknown-linux-gnu.2.28
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary: fraiseql
            archive_ext: tar.gz
            # Fully-static lean binary (no libc at all) for Alpine / distroless /
            # scratch containers. V8 (-full) does not link against musl, so this
            # target ships the lean artifact only.
            zig_target: x86_64-unknown-linux-musl
            lean_only: true
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: fraiseql
            archive_ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: fraiseql
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: fraiseql.exe
            archive_ext: zip

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad  # v0.0.9

      - name: Add Rust target (explicit, for cross-compilation)
        run: rustup target add ${{ matrix.target }}

      # cargo-zigbuild pins the target glibc floor (`.2.28`) using zig as the linker,
      # and produces fully-static musl binaries — the mechanism that keeps the release
      # binaries runnable on Debian 12 / old distros. Only the `zig_target` matrix rows
      # use it; native macОS/Windows and the aarch64 `cross` build are unchanged.
      - name: Install zig + cargo-zigbuild
        if: matrix.zig_target
        shell: bash
        run: |
          # Arch-aware: the aarch64-linux row (#649) builds natively on an arm64
          # runner, so a hardcoded x86_64 zig tarball would be the wrong binary.
          case "$(uname -m)" in
            x86_64)  zig_arch=x86_64 ;;
            aarch64) zig_arch=aarch64 ;;
            *) echo "::error::no zig tarball selected for $(uname -m)"; exit 1 ;;
          esac
          curl -fsSL "https://ziglang.org/download/0.13.0/zig-linux-${zig_arch}-0.13.0.tar.xz" | tar -xJ
          echo "$PWD/zig-linux-${zig_arch}-0.13.0" >> "$GITHUB_PATH"
          cargo install cargo-zigbuild --version 0.23.0 --locked

      # Both native linux-gnu rows need these; the aarch64 row builds natively
      # since #649 rather than inside a cross image that carried its own.
      - name: Install system dependencies (Linux gnu)
        if: contains(matrix.target, 'linux-gnu')
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Build binary (cargo)
        if: '!matrix.zig_target'
        run: cargo build --release --target ${{ matrix.target }} --package fraiseql --features cli,server

      - name: Build binary (zigbuild, glibc-floored / musl)
        if: matrix.zig_target
        run: cargo zigbuild --release --target ${{ matrix.zig_target }} --package fraiseql --features cli,server

      - name: Strip binary (Linux/macOS native)
        if: matrix.os != 'windows-latest'
        run: strip target/${{ matrix.target }}/release/${{ matrix.binary }}

      - name: Create archive (tar.gz)
        if: matrix.archive_ext == 'tar.gz'
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} fraiseql
          tar czf fraiseql-${{ matrix.target }}.tar.gz fraiseql

      - name: Create archive (zip)
        if: matrix.archive_ext == 'zip'
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} fraiseql.exe
          7z a fraiseql-${{ matrix.target }}.zip fraiseql.exe

      - name: Upload archive to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          files: fraiseql-${{ matrix.target }}.${{ matrix.archive_ext }}
          fail_on_unmatched_files: true

      # ── Feature-complete "-full" variant (phase 01, option a) ──────────────────
      # A SECOND artifact per native target — `fraiseql-full-<target>` — carrying the
      # stable opt-in transports and platform features (REST, Arrow Flight,
      # federation, outbound CDC, Deno functions, sources, observers, /mcp, inbound,
      # metrics) via the umbrella `release-full` bundle. The lean default
      # artifact above is UNCHANGED. Adopters of the platform features download the
      # `-full` binary instead of rebuilding cli+server from source at the same
      # revision (the #507 jsonb_column same-revision contract makes mixing a stock
      # cli with a custom server dangerous).
      #
      # Native targets only: `functions-runtime-deno` compiles V8, which does not
      # build under the `cross` Docker images used for aarch64-linux. That target
      # therefore ships the lean artifact only — a documented gap (docs/releases.md),
      # never a silent one.
      - name: Build full binary (cargo)
        if: '!matrix.lean_only && !matrix.zig_target'
        run: cargo build --release --target ${{ matrix.target }} --package fraiseql --features release-full

      - name: Build full binary (zigbuild, glibc-floored)
        if: matrix.zig_target && !matrix.lean_only
        run: cargo zigbuild --release --target ${{ matrix.zig_target }} --package fraiseql --features release-full

      - name: Smoke the full binary's function-invoke harness (phase 08)
        if: matrix.os != 'windows-latest' && !matrix.lean_only
        # `fraiseql functions invoke` exists only when `functions-invoke` is compiled
        # in. Assert the -full artifact ships the author test loop rather than leaving
        # it from-source-only — the same adopter dead-end this -full variant closes for
        # the other platform features.
        run: |
          bin="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          "$bin" functions invoke --help | grep -q -- "--payload" \
            || { echo "::error::the -full binary is missing 'functions invoke' — functions-invoke is not compiled in"; exit 1; }
          echo "✅ -full binary ships 'fraiseql functions invoke' (functions-invoke compiled in)."

      # Second binary in the `-full` tarball: the standalone `fraiseql-server`, the
      # production `--config server.toml` entrypoint. The umbrella `fraiseql run` is a
      # dev quick-launcher that reads only [server]/[database] (#643); a real deployment
      # of auth/federation/observers/enrichment/tenancy/storage needs `fraiseql-server`,
      # which was previously reachable only by rebuilding from source. Built with the
      # same server surface `release-full` compiles into the umbrella (auth and cli are
      # on by default in fraiseql-server); tools/check-artifact-features.py holds both to
      # the list in docs/releases.md (#1621). One archive now carries the compiler
      # CLI and the server at a single revision — the #507 same-revision contract made
      # physical.
      - name: Build fraiseql-server binary (cargo, -full)
        if: '!matrix.lean_only && !matrix.zig_target'
        run: cargo build --release --target ${{ matrix.target }} --package fraiseql-server --features rest,arrow,cdc-outbound,functions-runtime-deno,sources,mcp,inbound,inbound-email,metrics,observers,federation

      - name: Build fraiseql-server binary (zigbuild, glibc-floored, -full)
        if: matrix.zig_target && !matrix.lean_only
        run: cargo zigbuild --release --target ${{ matrix.zig_target }} --package fraiseql-server --features rest,arrow,cdc-outbound,functions-runtime-deno,sources,mcp,inbound,inbound-email,metrics,observers,federation

      - name: Strip full binaries (Linux/macOS native)
        if: matrix.os != 'windows-latest' && !matrix.lean_only
        run: |
          strip target/${{ matrix.target }}/release/${{ matrix.binary }}
          strip target/${{ matrix.target }}/release/fraiseql-server

      - name: Create full archive (tar.gz)
        if: matrix.archive_ext == 'tar.gz' && !matrix.lean_only
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} fraiseql
          cp target/${{ matrix.target }}/release/fraiseql-server fraiseql-server
          tar czf fraiseql-full-${{ matrix.target }}.tar.gz fraiseql fraiseql-server

      - name: Create full archive (zip)
        if: matrix.archive_ext == 'zip' && !matrix.lean_only
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} fraiseql.exe
          cp target/${{ matrix.target }}/release/fraiseql-server.exe fraiseql-server.exe
          7z a fraiseql-full-${{ matrix.target }}.zip fraiseql.exe fraiseql-server.exe

      - name: Upload full archive to release
        if: '!matrix.lean_only'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          files: fraiseql-full-${{ matrix.target }}.${{ matrix.archive_ext }}
          fail_on_unmatched_files: true

      # Fail the release if any Linux binary would refuse to load on Debian 12
      # (glibc 2.36) — the regression this whole zig_target machinery prevents.
      # gnu binaries must top out at GLIBC_2.34 (zigbuild pins 2.28; aarch64 `cross`
      # is ~2.31); musl binaries carry no glibc symbols at all, so they trivially pass.
      - name: Verify glibc ceiling (Linux)
        if: contains(matrix.target, 'linux')
        shell: bash
        run: |
          ceiling="2.34"
          fail=0
          for b in "${{ matrix.binary }}" fraiseql-server; do
            p="target/${{ matrix.target }}/release/$b"
            [ -f "$p" ] || continue
            # `|| true`: a fully-static binary (musl) has NO glibc symbols, so `grep`
            # matches nothing and exits 1. Under `shell: bash` (which runs with
            # `-eo pipefail`), that non-zero pipeline status would abort the step
            # before the `-z "$max"` skip below — false-failing every static binary.
            # Keep the guard so `max` is simply empty when there is no glibc dep.
            max=$(objdump -T "$p" 2>/dev/null | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sed 's/GLIBC_//' | sort -V | tail -1 || true)
            if [ -z "$max" ]; then
              echo "✅ $b: no glibc version dependency"
              continue
            fi
            echo "· $b needs up to GLIBC_$max"
            if [ "$(printf '%s\n%s\n' "$ceiling" "$max" | sort -V | tail -1)" != "$ceiling" ]; then
              echo "::error::$b requires GLIBC_$max > $ceiling — would not load on Debian 12 (glibc 2.36)"
              fail=1
            fi
          done
          exit "$fail"

  # SBOM generation handled by sbom-generation.yml (Cosign-signed, validated)

  # Publish to crates.io
  publish-crates:
    name: Publish to crates.io
    environment: release
    needs: create-github-release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad  # v0.0.9

      - name: Verify all crates can be built
        run: |
          echo "Verifying Rust build compatibility..."
          cargo check --features "arrow,kafka,postgres,redis-apq,schema-lint,test-utils,wire-backend"
          echo "✅ All crates build successfully"

      # Every publishable workspace crate, each after every workspace crate it depends
      # on: tools/publish-order.py derives both from the manifests, so a new crate or
      # a new edge needs no edit here. A rerun after a partial failure skips what is
      # already on crates.io.
      #
      # Not `cargo publish --workspace`: it waits for each crate to reach the index for
      # 60 seconds at most, then warns and publishes the next crate anyway, so a slow
      # index fails a dependent mid-release (v2.13.0). wait-for-crates-index.sh waits
      # longer and stops the release when it runs out.
      - name: Publish crates in dependency order
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/v}"
          # An assignment, not `< <(…)`: errexit sees a failed derivation here, and
          # an empty list would otherwise publish nothing and pass.
          ORDER="$(python3 tools/publish-order.py)"
          mapfile -t CRATES <<<"$ORDER"
          echo "## 📦 Crates.io Publishing Results" >> "$GITHUB_STEP_SUMMARY"
          for crate in "${CRATES[@]}"; do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' -H 'User-Agent: fraiseql-ci' "https://crates.io/api/v1/crates/$crate/$VERSION")" = "200" ]; then
              echo "$crate $VERSION already published, skipping"
              echo "- ⏭️ $crate (already published)" >> "$GITHUB_STEP_SUMMARY"
            else
              if ! cargo publish --package "$crate" --token "${{ secrets.CARGO_TOKEN }}"; then
                echo "- ❌ $crate" >> "$GITHUB_STEP_SUMMARY"
                echo "::error::$crate failed to publish; the crates after it were not attempted"
                exit 1
              fi
              echo "- ✅ $crate" >> "$GITHUB_STEP_SUMMARY"
            fi
            bash tools/wait-for-crates-index.sh "$VERSION" "$crate"
          done

  # Build and publish Python package
  publish-python:
    name: Publish Python Package to PyPI
    environment: release
    needs: create-github-release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      # Honesty gate (audit H30): refuse to publish when the manifest version
      # does not match the release tag. The Python manifest was frozen at 2.1.6
      # while v2.3.0–v2.6.0 tags were cut, so `twine upload --skip-existing` (and
      # the validation step that installed the stale version) reported success
      # while shipping nothing. With release.sh now bumping the manifest, a
      # mismatch here means the bump was skipped — fail loudly instead.
      - name: Assert Python SDK version matches the release tag
        run: |
          source tools/lib/release_helpers.sh
          RELEASE_VERSION="${GITHUB_REF#refs/tags/v}"
          MANIFEST_VERSION=$(grep '^version = ' sdks/official/fraiseql-python/pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          assert_sdk_version_matches "$MANIFEST_VERSION" "$RELEASE_VERSION" "Python SDK"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'build==1.6.1' 'twine==7.0.0'

      - name: Build distributions
        id: build-python
        working-directory: sdks/official/fraiseql-python
        run: python -m build

      - name: Publish to PyPI
        id: publish-pypi
        working-directory: sdks/official/fraiseql-python
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: twine upload dist/* --skip-existing

      # Blocking (trust closure, 2026-09-21). verify-release below proves only that the
      # version is visible on the index; this is the one step that installs and imports
      # what was published, as a user would, so an indexed-but-broken wheel must redden
      # the release rather than print a warning nobody reads.
      - name: Validate PyPI package
        id: validate-pypi
        run: |
          # Assert the NEW release version specifically — not whatever the manifest
          # happens to carry — so a no-op publish can never validate green (H30).
          VERSION="${GITHUB_REF#refs/tags/v}"
          # Bounded retry-then-FAIL. On v2.15.0 one attempt after a fixed 10 s sleep ran
          # before the index served the upload, and a published, working wheel reddened
          # the release. pip's own cache would replay the miss, hence --no-cache-dir.
          for attempt in $(seq 1 20); do
            if python -m pip install --no-cache-dir --upgrade "fraiseql==${VERSION}"; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              echo "::error::fraiseql==${VERSION} not installable from PyPI after 20 attempts"
              exit 1
            fi
            echo "PyPI does not serve fraiseql==${VERSION} yet (attempt ${attempt}/20); retrying in 15s"
            sleep 15
          done
          python -c "import fraiseql, sys; assert fraiseql.__version__ == '${VERSION}', f'installed {fraiseql.__version__}, expected ${VERSION}'; print(f'✅ fraiseql {fraiseql.__version__} successfully published to PyPI')"

      - name: Report Python publishing results
        if: always()
        run: |
          echo "## 🐍 Python Package Publishing Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          [ "${{ steps.build-python.outcome }}" = "success" ] && echo "- ✅ Build: SUCCESS" >> "$GITHUB_STEP_SUMMARY" || echo "- ❌ Build: FAILED" >> "$GITHUB_STEP_SUMMARY"
          [ "${{ steps.publish-pypi.outcome }}" = "success" ] && echo "- ✅ PyPI upload: SUCCESS" >> "$GITHUB_STEP_SUMMARY" || echo "- ❌ PyPI upload: FAILED" >> "$GITHUB_STEP_SUMMARY"
          # `outcome` is success, failure, cancelled or skipped; print the one it is. The old
          # line printed "SKIPPED" for anything but success, including v2.15.0's failure.
          case "${{ steps.validate-pypi.outcome }}" in
            success) echo "- ✅ Validation: SUCCESS" ;;
            failure) echo "- ❌ Validation: FAILED" ;;
            *)       echo "- ⚠️ Validation: ${{ steps.validate-pypi.outcome }}" ;;
          esac >> "$GITHUB_STEP_SUMMARY"

  # Build and publish the Rust SDK crate
  #
  # ADR-0019 puts Rust in the published set alongside Python and TypeScript, and
  # `tools/release.sh` bumps `sdks/official/fraiseql-rust/Cargo.toml` accordingly. It had
  # no publisher on this tag: `rust-sdk.yml:publish` fires on a `rust-sdk/v*` tag, which
  # release.sh does not create and which has never existed, so `fraiseql-rust` was 404 on
  # crates.io while the README said otherwise. `check-sdk-publication-claims.py` now
  # requires every published SDK to have a publisher reachable from the release tag, so
  # deleting this job fails the gate rather than silently un-publishing the SDK again.
  #
  # NOT `--package`: this crate is not a workspace member, so it publishes from its own
  # directory, and `tools/publish-order.py`, which reads the workspace, never lists it.
  publish-rust-sdk:
    name: Publish Rust SDK to crates.io
    environment: release
    needs: create-github-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The workflow-level `RUSTC_WRAPPER: "sccache"` reaches every job, and this one never
    # installs sccache: v2.15.0's `cargo publish` died on `sccache … No such file or
    # directory` and fraiseql-rust never shipped. `tools/check-rustc-wrapper.py` now
    # refuses a job that runs cargo under a wrapper it does not install.
    env:
      RUSTC_WRAPPER: ""

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      # Honesty gate (audit H30, #1130): refuse to publish when the manifest version
      # does not match the release tag.
      - name: Assert Rust SDK version matches the release tag
        run: |
          source tools/lib/release_helpers.sh
          RELEASE_VERSION="${GITHUB_REF#refs/tags/v}"
          MANIFEST_VERSION=$(
            grep -m1 '^version' sdks/official/fraiseql-rust/Cargo.toml \
              | sed -E 's/.*"([^"]+)".*/\1/'
          )
          assert_sdk_version_matches "$MANIFEST_VERSION" "$RELEASE_VERSION" "Rust SDK"

      - name: Publish to crates.io
        id: publish-rust-sdk
        working-directory: sdks/official/fraiseql-rust
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}

      # No per-job probe here on purpose: the one beside publish-python is
      # `continue-on-error: true` and so can never redden anything. `verify-release`
      # below is the collect-all check that MUST fail, and fraiseql-rust is in its list.

  # npm publishing moved to .github/workflows/npm-publish.yml (Trusted Publishing
  # / OIDC, no NPM_TOKEN). It triggers on the same `v*` tag, so npm ships in
  # lockstep with this pipeline.

  # Verify all packages published correctly
  verify-release:
    name: Verify Published Packages
    needs: [create-github-release, publish-crates, build-binaries, publish-python, publish-rust-sdk]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: always()
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Verify every crate is published on crates.io (+ PyPI + npm)
        run: |
          # Disable errexit: this is a collect-ALL check that tracks failures itself
          # and fails once at the end (GitHub runs `run:` as `bash -e`). No
          # continue-on-error — a version that never becomes visible MUST redden the job.
          set +e
          echo "## 📦 Package Verification" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          VERSION="${{ steps.get_version.outputs.version }}"

          # Every crate the `publish-crates` job ships — keep in sync with the CRATES
          # list in the validate-release "Dry-run publish" step. The old step checked
          # only `fraiseql` (1 of 16) and soft-passed a miss as "indexing in progress".
          CRATES="fraiseql-guard fraiseql-kafka fraiseql-jwks fraiseql-error fraiseql-auth fraiseql-webhooks \
                  fraiseql-wire fraiseql-cdc-sinks \
                  fraiseql-db fraiseql-storage fraiseql-federation fraiseql-core \
                  fraiseql-codegen fraiseql-arrow fraiseql-secrets fraiseql-observers \
                  fraiseql-functions fraiseql-saga fraiseql-server fraiseql-cli fraiseql"

          # One "label|url" channel-item per array element.
          PENDING=()
          for c in $CRATES; do
            PENDING+=("crates.io: $c v$VERSION|https://crates.io/api/v1/crates/$c/$VERSION")
          done
          PENDING+=("PyPI: fraiseql v$VERSION|https://pypi.org/pypi/fraiseql/$VERSION/json")
          PENDING+=("npm: fraiseql v$VERSION|https://registry.npmjs.org/fraiseql/$VERSION")
          # The third published SDK (ADR-0019). It is not a workspace member, so it is
          # absent from CRATES above and was absent from this check entirely.
          PENDING+=("crates.io: fraiseql-rust v$VERSION|https://crates.io/api/v1/crates/fraiseql-rust/$VERSION")

          # Bounded retry-then-FAIL: absorbs registry indexing lag (tens of seconds)
          # without the old warn-and-proceed. ~3 min ceiling; usually one round.
          MAX_ROUNDS=12
          SLEEP=15
          for round in $(seq 1 "$MAX_ROUNDS"); do
            STILL=()
            for item in "${PENDING[@]}"; do
              label="${item%%|*}"; url="${item##*|}"
              code="$(curl -s -o /dev/null -w '%{http_code}' -H 'User-Agent: fraiseql-ci' "$url")"
              if [ "$code" = "200" ]; then
                echo "✅ $label" >> "$GITHUB_STEP_SUMMARY"
              else
                STILL+=("$item")
              fi
            done
            PENDING=("${STILL[@]}")
            [ "${#PENDING[@]}" -eq 0 ] && break
            echo "… ${#PENDING[@]} not yet visible; retry in ${SLEEP}s (round $round/$MAX_ROUNDS)"
            sleep "$SLEEP"
          done

          if [ "${#PENDING[@]}" -ne 0 ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### ❌ Never became visible" >> "$GITHUB_STEP_SUMMARY"
            for item in "${PENDING[@]}"; do echo "- ${item%%|*}" >> "$GITHUB_STEP_SUMMARY"; done
            echo "::error::one or more published artifacts never became visible after ~3min — see the job summary"
            exit 1
          fi
          echo "All crates + the Rust SDK (crates.io) + PyPI + npm are published and visible at v$VERSION."

      - name: Verify all expected release assets are present
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          RELEASE_TAG="${{ github.ref_name }}"
          mapfile -t ACTUAL < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')

          # Expected assets are DERIVED from the build-binaries matrix, not a magic
          # count: 6 lean (one per target, incl. the static musl one) + 5 -full.
          # Every target except musl now ships a -full artifact; musl stays
          # lean_only because V8 does not link against musl. aarch64-linux joined
          # the -full set in #649, when it moved from a `cross` build (where V8
          # cannot build) to a native arm64 runner. Assert each by NAME — a bare
          # count would pass a duplicate-plus-missing swap.
          EXPECTED=(
            fraiseql-x86_64-unknown-linux-gnu.tar.gz
            fraiseql-x86_64-unknown-linux-musl.tar.gz
            fraiseql-aarch64-unknown-linux-gnu.tar.gz
            fraiseql-x86_64-apple-darwin.tar.gz
            fraiseql-aarch64-apple-darwin.tar.gz
            fraiseql-x86_64-pc-windows-msvc.zip
            fraiseql-full-x86_64-unknown-linux-gnu.tar.gz
            fraiseql-full-aarch64-unknown-linux-gnu.tar.gz
            fraiseql-full-x86_64-apple-darwin.tar.gz
            fraiseql-full-aarch64-apple-darwin.tar.gz
            fraiseql-full-x86_64-pc-windows-msvc.zip
          )
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## 📎 Release Assets (${#ACTUAL[@]} present, ${#EXPECTED[@]} expected)" >> "$GITHUB_STEP_SUMMARY"
          MISSING=0
          for a in "${EXPECTED[@]}"; do
            if printf '%s\n' "${ACTUAL[@]}" | grep -qx "$a"; then
              echo "- ✅ $a" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- ❌ $a (MISSING)" >> "$GITHUB_STEP_SUMMARY"
              echo "::error::missing expected release asset: $a"
              MISSING=1
            fi
          done
          [ "$MISSING" -eq 0 ] || { echo "::error::one or more expected release assets are missing"; exit 1; }
          echo "All ${#EXPECTED[@]} expected release assets are present."

      # success() only: this job now fails when a package/asset is missing (no more
      # continue-on-error), so a green "Release complete!" must not print over a red
      # verification. On failure the job is red and the per-step ::error:: annotations
      # are the signal.
      - name: Summary
        if: success()
        run: |
          {
            echo ""
            echo "---"
            echo ""
            echo "🎉 **Release v${{ steps.get_version.outputs.version }} complete!**"
            echo ""
            echo "**Installation:** https://fraiseql.dev/install"
          } >> "$GITHUB_STEP_SUMMARY"

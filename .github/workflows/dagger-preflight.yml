name: Dagger — preflight

# Phase 02 fast-gate umbrella (Track 0). Runs the cheap-but-frequent lint/format/doc
# gates on the self-hosted runner forge at ~$0/min, replacing the retired legacy hosted workflow's
# fmt / clippy / documentation / check-test-imports / axum-route-syntax jobs.
# `dagger call preflight` runs shell-gates → fmt → rustdoc → clippy fail-fast; the
# clippy compile reuses the box's cargo/target/sccache cache volumes (shared with
# local `dagger call` runs), so warm runs are fast.
#
# push-only by design: push events are inherently same-repo (forks cannot push
# here), so the self-hosted runner never sees fork code — `pull_request` is
# deliberately absent because those runs execute the PR merge-ref's workflow
# definition (a fork could edit out any in-workflow guard). Push runs on every
# in-repo working branch, so this leg's check lands on the PR head SHA and gates the
# merge via the `dev` ruleset. Fork PRs get no check by design — unblock by pushing
# the reviewed head commit to an in-repo branch (identical SHA → the check lands).
# See docs/contributing/branching-model.md.
on:
  push:
    branches-ignore: ['dependabot/**', 'gh-readonly-queue/**']
  workflow_dispatch:

# packages: read lets the runner pull the private ghcr.io/fraiseql/* base-image
# mirror (.github/workflows/mirror-base-images.yml); contents: read for checkout.
permissions:
  contents: read
  packages: read
  # actions: read lets already-passed.yml see this workflow's earlier runs.
  actions: read

concurrency:
  group: dagger-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Skips the leg when this SHA already passed it — the fast-forward to `dev`
  # pushes a commit its branch push just tested. See already-passed.yml.
  already-passed:
    name: already passed
    uses: ./.github/workflows/already-passed.yml
    with:
      workflow: dagger-preflight.yml

  preflight:
    needs: already-passed
    if: ${{ !cancelled() && needs.already-passed.outputs.passed != 'true' }}
    name: preflight
    # forge only. Every push queues preflight at the same moment as archbox's test
    # and feature-matrix legs; on archbox the four together loaded 24 threads to 76
    # and stretched preflight to 33 min (2026-10-06), against ~12 on forge, which
    # has no test leg to compete with. It is a lint/compile gate that starts at once,
    # so forge's slower cores land nowhere near the push's critical path.
    runs-on: [self-hosted, forge]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      # The Dagger engine pulls the private ghcr.io/fraiseql/* base images via the
      # host's docker credentials; authenticate with the job's GITHUB_TOKEN first.
      - name: Log in to ghcr.io (private base-image mirror)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: dagger call preflight
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          dagger version
          dagger call preflight --source=.

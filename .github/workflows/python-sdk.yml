name: Python SDK

on:
  push:
    paths:
      - 'sdks/official/fraiseql-python/**'
      - '.github/workflows/python-sdk.yml'
  pull_request:
    paths:
      - 'sdks/official/fraiseql-python/**'
      - '.github/workflows/python-sdk.yml'

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sdks/official/fraiseql-python

    strategy:
      matrix:
        # Both ENDS of the supported range, not just the middle. pyproject
        # declares `requires-python = ">=3.10"` with classifiers through 3.13,
        # but this matrix ran 3.11/3.12 only — so #1057, a 3.10-only crash in
        # ChangelogConsumer.run(), shipped invisibly. Testing the interior of a
        # claimed range tests the one place divergences do not live.
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9  # v7
        with:
          version: latest

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      # `conformance` and `examples` are linted too: they are shipped Python that
      # authors copy, and leaving them out is how three examples rotted into code
      # that does not run (#925). Two stale `noqa`s in `conformance/` had been
      # invisible for exactly as long as this list said `src tests`.
      - name: Lint with ruff
        run: uv run ruff check src tests conformance examples

      - name: Format check
        run: uv run ruff format --check src tests conformance examples

      - name: Type check with ty
        run: uv run ty check src

      - name: Run tests
        run: uv run pytest tests -v

  publish:
    name: Publish to PyPI
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/python-sdk/v')
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9  # v7

      - name: Build distribution
        working-directory: sdks/official/fraiseql-python
        run: uv build

      - name: Publish to PyPI
        working-directory: sdks/official/fraiseql-python
        run: uv publish

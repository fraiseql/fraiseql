name: Python SDK

# Publish only. The SDK's own suite gates every push in sdk-suites.yml (#1467), whose
# aggregate is a required check; the paths-filtered test job that used to live here
# could not be required and gated nothing.
on:
  push:
    tags: ['python-sdk/v*']

jobs:
  publish:
    name: Publish to PyPI
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9  # v7

      # The tagged tree's own suite, once, before anything is built: the per-push gate
      # is sdk-suites.yml, and a tag is not a push it reports on.
      - name: Lint, type-check and test
        run: bash tools/sdk-suite.sh python

      # Honesty gate (audit H30, #1130): refuse to publish when the manifest version
      # does not match the tag. release.yml's Python publish has had this since H30,
      # but THIS publisher — the one a `python-sdk/vX.Y.Z` tag fires — did not, so the
      # gate could be bypassed entirely by tagging the SDK directly.
      - name: Assert manifest matches tag
        run: |
          source tools/lib/release_helpers.sh
          TAG_VERSION="${GITHUB_REF_NAME#python-sdk/v}"
          MANIFEST_VERSION=$(
            grep -m1 '^version' sdks/official/fraiseql-python/pyproject.toml \
              | sed -E 's/.*"([^"]+)".*/\1/'
          )
          assert_sdk_version_matches "$MANIFEST_VERSION" "$TAG_VERSION" "Python SDK"

      - name: Build distribution
        working-directory: sdks/official/fraiseql-python
        run: uv build

      - name: Publish to PyPI
        working-directory: sdks/official/fraiseql-python
        run: uv publish

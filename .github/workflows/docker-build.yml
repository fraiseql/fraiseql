name: Build and Push Docker Images

# Per-branch/PR image builds were disabled 2026-05-31 by the Dagger CI migration:
# the push-to-branches and pull_request triggers were stripped and the v* tag build
# kept as the ship path. The migration step that was to reproduce image-build on
# Dagger never happened — `.dagger/` has no Dockerfile-building function — so this
# file is the ONLY thing that builds a shipped image, and it first runs after the
# tag exists. That gap is what let the release image become unbuildable for weeks
# without a single red check (#1205, #1107).
#
# Consequence for everything below: the only events this workflow receives are a
# `v*` tag push and a manual dispatch. A job or an arm predicated on a branch ref
# or on a pull_request cannot run. Two jobs here were exactly that until #1206 —
# they read as image coverage and had never once executed — and two more conditions
# were constants. `tools/check-workflow-job-reachability.py` (preflight + ShellGates)
# now rejects that shape.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: fraiseql-server
            dockerfile: Dockerfile
            build-context: .
            image-suffix: "server"
            optional: false

          - name: fraiseql-server-full
            dockerfile: Dockerfile
            build-context: .
            image-suffix: "server-full"
            build-args: "CARGO_FEATURES=rest,arrow"
            optional: true

          - name: tutorial
            dockerfile: tutorial/Dockerfile
            build-context: .
            image-suffix: "tutorial"
            optional: true

    continue-on-error: ${{ matrix.service.optional == true }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ${{ env.REGISTRY }}
          # Use the built-in, per-run GITHUB_TOKEN (this job declares
          # `packages: write` above) instead of a long-lived `GHCR_PAT` secret. The
          # PAT expired/rotated and denied the v2.11.0 image push (it had worked
          # through v2.10.0); the scoped GITHUB_TOKEN never expires and aligns with
          # the token-least-privilege posture (#545).
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service.image-suffix }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7.1.0
        with:
          context: ${{ matrix.service.build-context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.service.build-args || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-to-docker-hub:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The `main` and `release/*` arms were dead: this workflow's only push events
    # are tag pushes, so the ref is never a branch (#1206).
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service:
          - name: fraiseql-server
            dockerfile: Dockerfile
            build-context: .
            image-suffix: "server"
            docker-hub-image: fraiseql/server

          - name: fraiseql-server-full
            dockerfile: Dockerfile
            build-context: .
            image-suffix: "server-full"
            docker-hub-image: fraiseql/server-full
            build-args: "CARGO_FEATURES=rest,arrow"

          - name: tutorial
            dockerfile: tutorial/Dockerfile
            build-context: .
            image-suffix: "tutorial"
            docker-hub-image: fraiseql/tutorial

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v3

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Extract metadata for Docker Hub
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ matrix.service.docker-hub-image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push to Docker Hub
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7.1.0
        with:
          context: ${{ matrix.service.build-context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.service.build-args || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notify-success:
    needs: [build-and-push]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push' && success()

    steps:
      - name: Create deployment summary
        run: |
          {
            echo "## 🎉 Docker Images Built Successfully"
            echo ""
            echo "**Registry**: GitHub Container Registry (ghcr.io)"
            echo "**Images**:"
            echo "- \`ghcr.io/${{ github.repository_owner }}/server\`"
            echo "- \`ghcr.io/${{ github.repository_owner }}/server-full\` (rest-transport, arrow)"
            echo "- \`ghcr.io/${{ github.repository_owner }}/tutorial\`"
            echo ""
            echo "**Branch**: ${{ github.ref }}"
            echo "**Commit**: ${{ github.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"

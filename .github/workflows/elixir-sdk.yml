name: Elixir SDK

on:
  push:
    # `branches` is load-bearing (#1119). GitHub ANDs the ref filter with the path
    # filter, so with `tags` present and `branches` absent a push to a branch matched
    # no ref pattern at all: `mix credo`, `mix test` and `mix dialyzer` ran only on an
    # `elixir-sdk/v*` tag — which is to say, at release time or never. `tags` itself
    # must stay: the `publish` job below is gated on it.
    branches:
      - '**'
    paths:
      - 'sdks/official/fraiseql-elixir/**'
      - '.github/workflows/elixir-sdk.yml'
    tags:
      - 'elixir-sdk/v*'
  pull_request:
    paths:
      - 'sdks/official/fraiseql-elixir/**'

jobs:
  test:
    name: Test (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sdks/official/fraiseql-elixir
    strategy:
      matrix:
        elixir: ['1.15', '1.16', '1.17']
        otp: ['26', '27']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93  # v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      - name: Restore deps cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: |
            sdks/official/fraiseql-elixir/deps
            sdks/official/fraiseql-elixir/_build
          key: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('sdks/official/fraiseql-elixir/mix.lock') }}
      - run: mix deps.get
      - run: mix credo
      - run: mix test

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sdks/official/fraiseql-elixir
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93  # v1
        id: beam
        with:
          elixir-version: '1.17'
          otp-version: '27'
      - name: Restore PLT cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: sdks/official/fraiseql-elixir/priv/plts
          # Keyed on the RESOLVED toolchain versions, not the requested series
          # ('1.17'/'27'): setup-beam floats to the newest patch release, so a
          # series-keyed cache serves a PLT built by a different OTP and
          # Dialyzer refuses it ("Old PLT file"), reddening every run until the
          # cache is evicted (#979). A toolchain bump now misses the cache and
          # rebuilds the PLT instead of poisoning the job.
          key: ${{ runner.os }}-dialyzer-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('sdks/official/fraiseql-elixir/mix.lock') }}
      - run: mix deps.get
      - run: mix dialyzer --format github

  publish:
    name: Publish to Hex.pm
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    needs: [test, dialyzer]
    if: startsWith(github.ref, 'refs/tags/elixir-sdk/v')
    defaults:
      run:
        working-directory: sdks/official/fraiseql-elixir
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93  # v1
        with:
          elixir-version: '1.17'
          otp-version: '27'
      - run: mix deps.get
      - run: mix hex.publish --yes
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}

name: C# SDK

on:
  push:
    # Every branch, not just [dev, main] (#1119). Post-merge-only means the SDK's own
    # test suite first runs after the change has already landed on the trunk, which is
    # the wrong end of the merge. Publishing is driven by `release: published` below,
    # so nothing here depends on the branch restriction.
    branches: ['**']
    paths:
      - 'sdks/official/fraiseql-csharp/**'
      - '.github/workflows/csharp-sdk.yml'
      - 'tools/sdk-suite.sh'
  pull_request:
    paths:
      - 'sdks/official/fraiseql-csharp/**'
      - '.github/workflows/csharp-sdk.yml'
      - 'tools/sdk-suite.sh'
  release:
    types: [published]

jobs:
  test:
    name: .NET ${{ matrix.dotnet-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sdks/official/fraiseql-csharp

    strategy:
      matrix:
        dotnet-version: ['8.0.x', '9.0.x']

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4
        with:
          dotnet-version: ${{ matrix.dotnet-version }}
      # The suite's commands live in tools/sdk-suite.sh, which `make test-sdks` also runs,
      # so this job and the local run cannot drift (#1346).
      - name: Restore, build and test
        working-directory: .
        run: bash tools/sdk-suite.sh csharp

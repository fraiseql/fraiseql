name: Go SDK

on:
  push:
    paths:
      - 'sdks/official/fraiseql-go/**'
      - '.github/workflows/go-sdk.yml'
      - 'tools/sdk-suite.sh'
  pull_request:
    paths:
      - 'sdks/official/fraiseql-go/**'
      - '.github/workflows/go-sdk.yml'
      - 'tools/sdk-suite.sh'

jobs:
  test:
    name: Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sdks/official/fraiseql-go

    strategy:
      matrix:
        go-version: ['1.23', '1.24']

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: sdks/official/fraiseql-go/go.sum

      # The suite's commands live in tools/sdk-suite.sh, which `make test-sdks` also runs,
      # so this job and the local run cannot drift (#1346).
      - name: Verify, vet, staticcheck, test and build
        working-directory: .
        run: bash tools/sdk-suite.sh go

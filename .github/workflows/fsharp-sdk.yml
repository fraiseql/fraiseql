name: F# SDK

on:
  push:
    # `branches` is load-bearing (#1119). GitHub ANDs the ref filter with the path
    # filter, so with `tags` present and `branches` absent a push to a branch matched
    # no ref pattern at all and this SDK's tests ran only on a `fsharp-sdk/v*` tag.
    # `tags` itself must stay: the `publish` job below is gated on it.
    branches:
      - '**'
    paths:
      - 'sdks/official/fraiseql-fsharp/**'
      - '.github/workflows/fsharp-sdk.yml'
    tags:
      - 'fsharp-sdk/v*'
  pull_request:
    paths:
      - 'sdks/official/fraiseql-fsharp/**'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sdks/official/fraiseql-fsharp
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --configuration Release --no-restore
      - name: Test
        run: dotnet test --no-build --configuration Release --collect:"XPlat Code Coverage" --verbosity normal
      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        if: always()
        with:
          name: coverage-fsharp-sdk
          path: sdks/official/fraiseql-fsharp/tests/FraiseQL.Tests/TestResults/
          retention-days: 30

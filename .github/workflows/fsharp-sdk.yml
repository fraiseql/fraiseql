name: F# SDK

on:
  push:
    # `branches` is load-bearing (#1119). GitHub ANDs the ref filter with the path
    # filter, so with `tags` present and `branches` absent a push to a branch matched
    # no ref pattern at all and this SDK's tests ran only on a `fsharp-sdk/v*` tag.
    # `tags` itself must stay: the `publish` job below is gated on it.
    branches:
      - '**'
    paths:
      - 'sdks/official/fraiseql-fsharp/**'
      - '.github/workflows/fsharp-sdk.yml'
      - 'tools/sdk-suite.sh'
    tags:
      - 'fsharp-sdk/v*'
  pull_request:
    paths:
      - 'sdks/official/fraiseql-fsharp/**'
      - 'tools/sdk-suite.sh'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sdks/official/fraiseql-fsharp
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4
        with:
          dotnet-version: '9.0.x'
      # The suite's commands live in tools/sdk-suite.sh, which `make test-sdks` also runs,
      # so this job and the local run cannot drift (#1346).
      - name: Restore, build and test (with coverage)
        working-directory: .
        env:
          FRAISEQL_SDK_COVERAGE: '1'
        run: bash tools/sdk-suite.sh fsharp
      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        if: always()
        with:
          name: coverage-fsharp-sdk
          path: sdks/official/fraiseql-fsharp/tests/FraiseQL.Tests/TestResults/
          retention-days: 30

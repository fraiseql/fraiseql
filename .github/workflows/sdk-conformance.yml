name: SDK Conformance

# The gate that holds every authoring SDK to one sentence: the schema.json it emits,
# compiled by the real `fraiseql compile`, must preserve what the author declared.
#
# This is deliberately separate from sdk-parity.yml. Parity compares each SDK's
# schema.json against Python's and never runs the compiler, so it cannot see a document
# that compiles cleanly and is silently wrong afterwards — which is what #849 (C# drops
# relay/is_error) and #852 (PHP writes `invalidates`) both are.
#
# It also runs on compiler changes, not just SDK changes: `deny_unknown_fields` means a
# new key on the seam breaks every SDK that does not emit it, and that has to surface
# here rather than in a user's build.

on:
  push:
    paths:
      - 'sdks/official/**'
      - 'crates/fraiseql-cli/**'
      - 'crates/fraiseql-core/src/schema/**'
      - 'docs/architecture/intermediate-schema.md'
      - '.github/workflows/sdk-conformance.yml'
  pull_request:
    paths:
      - 'sdks/official/**'
      - 'crates/fraiseql-cli/**'
      - 'crates/fraiseql-core/src/schema/**'
      - 'docs/architecture/intermediate-schema.md'
      - '.github/workflows/sdk-conformance.yml'
  workflow_dispatch:

concurrency:
  group: sdk-conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: Author → export → compile → observe
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      # --- the compiler under test -------------------------------------------------
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1  # v2
        with:
          shared-key: sdk-conformance

      - name: Build fraiseql-cli
        run: cargo build -p fraiseql-cli

      # --- every SDK's toolchain, natively -----------------------------------------
      # Installed rather than containerised so a missing toolchain is a hard failure
      # here, not a silent fallback that hides a broken image.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - run: pip install uv

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '20'

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6
        with:
          go-version: '1.23'
          cache-dependency-path: sdks/official/fraiseql-go/go.sum

      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc  # v2
        with:
          php-version: '8.2'
          tools: composer

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4
        with:
          dotnet-version: '9.0.x'

      - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93  # v1
        with:
          otp-version: '26'
          elixir-version: '1.17'

      - uses: ruby/setup-ruby@97ecb7b512899eb71ab1bf2310a624c6f1589ac6  # v1
        with:
          ruby-version: '3.3'

      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260  # v1
        with:
          sdk: stable

      # --- per-SDK dependency install ----------------------------------------------
      - name: Install SDK dependencies
        working-directory: sdks/official
        run: |
          set -euo pipefail
          (cd fraiseql-python && uv sync)
          (cd fraiseql-typescript && npm ci)
          (cd fraiseql-go && go mod download)
          (cd fraiseql-php && composer install --prefer-dist --no-progress)
          (cd fraiseql-elixir && mix local.hex --force && mix local.rebar --force && mix deps.get)
          (cd fraiseql-dart && dart pub get)

      # --- the gate ------------------------------------------------------------------
      # `--require-all` turns "toolchain missing" into a failure. Without it a broken
      # setup step downgrades an SDK to SKIP, and a skipped SDK reads exactly like a
      # passing one in a log — the failure mode this whole suite exists to end.
      - name: Conformance
        run: |
          python3 sdks/official/conformance/run.py \
            --cli target/debug/fraiseql-cli \
            --require-all

      # --- every schema an example emits must compile --------------------------------
      # A separate failure surface from the authoring APIs above: an example can use a
      # real API and still emit something the compiler rejects. Coverage is opt-out —
      # see the script's exclusion list.
      - name: SDK examples compile
        run: sdks/official/conformance/check_examples.sh target/debug/fraiseql-cli

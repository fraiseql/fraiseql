name: Benchmarks

# Hosted CI disabled 2026-05-31 — Dagger CI migration (Track 0). push/PR triggers
# stripped; workflow_dispatch retained as porting spec.
#
# #1207: four steps here were `pull_request`- or push-to-dev-gated under that
# dispatch-only trigger, so a dispatch ran the benchmarks and then discarded the
# comparison they existed to produce. The trigger is NOT restored — this repository's
# own release notes say its benchmark numbers are not trustworthy yet (the previous
# load generator understated results by 2–3×), and gating merges on a measurement we
# publish a disclaimer about would make CI assert what the release notes deny.
# `benchmark-velocity.yml` is where that gate goes once the harness earns one.
#
# Instead the comparison is reachable the way a dispatch-only workflow makes anything
# reachable: by an input. `compare_against` names a previously saved baseline; the
# result goes to `$GITHUB_STEP_SUMMARY`, which needs no `pull-requests: write` and is
# visible on the run itself.
on:
  workflow_dispatch:
    inputs:
      compare_against:
        description: 'Baseline name to critcmp this run against (blank = no comparison)'
        type: string
        default: 'dev'
      save_baseline:
        description: 'Save this run to the bench-baseline cache under the name below'
        type: boolean
        default: false
      baseline_name:
        description: 'Name to save this run under'
        type: string
        default: 'dev'

permissions:
  contents: read

jobs:
  bench:
    name: Criterion benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: fraiseql_test_password
          POSTGRES_USER: fraiseql_test
          POSTGRES_DB: test_fraiseql
        options: >-
          --health-cmd "pg_isready -U fraiseql_test -d test_fraiseql"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae  # v2

      - name: Install critcmp
        run: cargo install critcmp --locked

      - name: Install mold linker
        run: |
          sudo apt-get update
          sudo apt-get install -y mold

      - name: Initialize benchmark database
        run: |
          psql -h localhost -p 5433 -U fraiseql_test -d test_fraiseql -f tests/sql/postgres/init.sql
          psql -h localhost -p 5433 -U fraiseql_test -d test_fraiseql -f tests/sql/postgres/init-analytics.sql
        env:
          PGPASSWORD: fraiseql_test_password

      # Restore the most recent dev baseline (PRs only need a restore-keys fallback)
      - name: Restore dev baseline
        id: restore-baseline
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: target/criterion/
          key: bench-baseline-${{ inputs.compare_against }}-${{ github.sha }}
          restore-keys: |
            bench-baseline-${{ inputs.compare_against }}-
            bench-baseline-

      # Always save under `run`, so the comparison below has a fixed name to read and
      # does not depend on which event delivered the run.
      - name: Run benchmarks
        run: |
          cargo bench --workspace -- --save-baseline run 2>&1 | tee bench.log
        env:
          DATABASE_URL: postgresql://fraiseql_test:fraiseql_test_password@localhost:5433/test_fraiseql

      # Compare only when a baseline was restored AND the dispatch asked for it.
      # Micro benchmarks (pure computation, no DB I/O) use a tight 5% threshold.
      # Slow benchmarks (DB-connected, high variance) use a relaxed 15% threshold.
      - name: Compare micro benchmarks (5% threshold)
        if: inputs.compare_against != '' && steps.restore-baseline.outputs.cache-hit == 'true'
        run: |
          critcmp '${{ inputs.compare_against }}' run --threshold 5 \
            -f '(projection|federation|design_analysis|saga|typename|payload_size|complete_pipeline|cache_latency|cache_concurrent|cache_get_latency)' \
            | tee bench-comparison.txt || echo "::warning::Micro benchmarks regressed >5%"

      - name: Compare slow benchmarks (15% threshold)
        if: inputs.compare_against != '' && steps.restore-baseline.outputs.cache-hit == 'true'
        run: |
          critcmp '${{ inputs.compare_against }}' run --threshold 15 \
            -f '(10k_rows|100k_rows|1m_rows|where_clause|pagination|http_response_pipeline|graphql_transform|god_objects)' \
            | tee -a bench-comparison.txt || echo "::warning::Slow benchmarks regressed >15%"

      # The comparison is the point of the run, so say so where the run is read.
      # `always()` on purpose: a missing file is reported, not silently skipped.
      - name: Publish comparison to the job summary
        if: always()
        run: |
          {
            echo "## Benchmark comparison"
            echo
            if [ -s bench-comparison.txt ]; then
              echo "Baseline: \`${{ inputs.compare_against }}\` — micro 5% / slow 15% thresholds"
              echo
              echo '```'
              cat bench-comparison.txt
              echo '```'
            elif [ -z "${{ inputs.compare_against }}" ]; then
              echo "No comparison requested (\`compare_against\` was blank)."
            else
              echo "No comparison produced: no cached baseline named \`${{ inputs.compare_against }}\` was restored."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save baseline
        if: inputs.save_baseline
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: target/criterion/
          key: bench-baseline-${{ inputs.baseline_name }}-${{ github.sha }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        if: always()
        with:
          name: criterion-results
          path: target/criterion/

  memory-profile:
    name: Memory profiling (dhat)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae  # v2

      - name: Run memory profiles
        run: |
          cargo test --bench memory_profile -p fraiseql-core \
            --features dhat-heap -- --nocapture --test-threads=1 2>&1 | tee memory-profile.txt

      - name: Check regression
        run: |
          # Extract peak heap from output
          PEAK=$(grep "DHAT\[" memory-profile.txt | sed 's/.*peak_heap=\([0-9]*\).*/\1/' | sort -rn | head -1)
          echo "Peak heap: ${PEAK} bytes"

          # Enforce absolute ceiling (100 MB)
          if [ "$PEAK" -gt 100000000 ]; then
            echo "::error::Peak heap ${PEAK} exceeds 100MB ceiling"
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        if: always()
        with:
          name: memory-profile
          path: memory-profile.txt

name: Dart SDK

on:
  push:
    paths:
      - 'sdks/official/fraiseql-dart/**'
      - '.github/workflows/dart-sdk.yml'
      - 'tools/sdk-suite.sh'
  pull_request:
    paths:
      - 'sdks/official/fraiseql-dart/**'
      - '.github/workflows/dart-sdk.yml'
      - 'tools/sdk-suite.sh'

jobs:
  test:
    name: Dart ${{ matrix.dart-sdk }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sdks/official/fraiseql-dart

    strategy:
      matrix:
        dart-sdk: ['stable', '3.6.0']

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Set up Dart ${{ matrix.dart-sdk }}
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260  # v1
        with:
          sdk: ${{ matrix.dart-sdk }}

      # The suite's commands live in tools/sdk-suite.sh, which `make test-sdks` also runs,
      # so this job and the local run cannot drift (#1346).
      - name: Analyze, format check and test
        working-directory: .
        run: bash tools/sdk-suite.sh dart

name: Rust SDK

# Publish only. The SDK's own suite gates every push in sdk-suites.yml (#1467), whose
# aggregate is a required check; the paths-filtered test job that used to live here
# could not be required and gated nothing.
on:
  push:
    tags: ['rust-sdk/v*']

jobs:
  publish:
    name: Publish to crates.io
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          components: rustfmt, clippy

      # The tagged tree's own suite, once, before anything is published: the per-push
      # gate is sdk-suites.yml, and a tag is not a push it reports on.
      - name: Format, clippy and tests
        run: bash tools/sdk-suite.sh rust

      # Honesty gate (audit H30, #1130): refuse to publish when the manifest version
      # does not match the tag. Python and TypeScript have had this since H30; this
      # publisher did not, so a `rust-sdk/vX.Y.Z` tag would have pushed whatever
      # version the manifest happened to hold to crates.io — irreversibly.
      - name: Assert manifest matches tag
        run: |
          source tools/lib/release_helpers.sh
          TAG_VERSION="${GITHUB_REF_NAME#rust-sdk/v}"
          MANIFEST_VERSION=$(
            grep -m1 '^version' sdks/official/fraiseql-rust/Cargo.toml \
              | sed -E 's/.*"([^"]+)".*/\1/'
          )
          assert_sdk_version_matches "$MANIFEST_VERSION" "$TAG_VERSION" "Rust SDK"

      - name: Publish
        working-directory: sdks/official/fraiseql-rust
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

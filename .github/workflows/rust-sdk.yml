name: Rust SDK

on:
  push:
    paths:
      - 'sdks/official/fraiseql-rust/**'
      - '.github/workflows/rust-sdk.yml'
  pull_request:
    paths:
      - 'sdks/official/fraiseql-rust/**'
      - '.github/workflows/rust-sdk.yml'

env:
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

jobs:
  test:
    name: Rust SDK — ${{ matrix.rust }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sdks/official/fraiseql-rust

    strategy:
      matrix:
        rust: [stable, beta]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad  # v0.0.9

      - name: Check format
        run: cargo fmt --check

      - name: Clippy
        # --locked on the FIRST lock-touching command, not just the last: cargo
        # resolves and may REWRITE Cargo.lock, so a bare clippy here would quietly
        # repair a stale lock and let a later `--locked` step pass on the lock it
        # had just fixed (#1225).
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --locked --all-features

      - name: Build (release)
        run: cargo build --locked --release

  publish:
    name: Publish to crates.io
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/rust-sdk/v')

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      # Honesty gate (audit H30, #1130): refuse to publish when the manifest version
      # does not match the tag. Python and TypeScript have had this since H30; this
      # publisher did not, so a `rust-sdk/vX.Y.Z` tag would have pushed whatever
      # version the manifest happened to hold to crates.io — irreversibly.
      - name: Assert manifest matches tag
        run: |
          source tools/lib/release_helpers.sh
          TAG_VERSION="${GITHUB_REF_NAME#rust-sdk/v}"
          MANIFEST_VERSION=$(
            grep -m1 '^version' sdks/official/fraiseql-rust/Cargo.toml \
              | sed -E 's/.*"([^"]+)".*/\1/'
          )
          assert_sdk_version_matches "$MANIFEST_VERSION" "$TAG_VERSION" "Rust SDK"

      - name: Publish
        working-directory: sdks/official/fraiseql-rust
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

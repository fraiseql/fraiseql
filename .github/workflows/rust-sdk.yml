name: Rust SDK

on:
  push:
    paths:
      - 'sdks/official/fraiseql-rust/**'
      - '.github/workflows/rust-sdk.yml'
      - 'tools/sdk-suite.sh'
  pull_request:
    paths:
      - 'sdks/official/fraiseql-rust/**'
      - '.github/workflows/rust-sdk.yml'
      - 'tools/sdk-suite.sh'

env:
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

jobs:
  test:
    name: Rust SDK — ${{ matrix.rust }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sdks/official/fraiseql-rust

    strategy:
      matrix:
        rust: [stable, beta]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad  # v0.0.9

      # The suite's commands live in tools/sdk-suite.sh, which `make test-sdks` also runs,
      # so this job and the local run cannot drift (#1346).
      - name: Format, clippy and tests
        working-directory: .
        run: bash tools/sdk-suite.sh rust

      - name: Build (release)
        run: cargo build --locked --release

  publish:
    name: Publish to crates.io
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/rust-sdk/v')
    # This job never installs the sccache the workflow-level env names, so `cargo publish`
    # would fail on its first rustc call (`tools/check-rustc-wrapper.py`).
    env:
      RUSTC_WRAPPER: ""

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      # Honesty gate (audit H30, #1130): refuse to publish when the manifest version
      # does not match the tag. Python and TypeScript have had this since H30; this
      # publisher did not, so a `rust-sdk/vX.Y.Z` tag would have pushed whatever
      # version the manifest happened to hold to crates.io — irreversibly.
      - name: Assert manifest matches tag
        run: |
          source tools/lib/release_helpers.sh
          TAG_VERSION="${GITHUB_REF_NAME#rust-sdk/v}"
          MANIFEST_VERSION=$(
            grep -m1 '^version' sdks/official/fraiseql-rust/Cargo.toml \
              | sed -E 's/.*"([^"]+)".*/\1/'
          )
          assert_sdk_version_matches "$MANIFEST_VERSION" "$TAG_VERSION" "Rust SDK"

      - name: Publish
        working-directory: sdks/official/fraiseql-rust
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

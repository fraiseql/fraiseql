name: Dagger — test

# Phase 03 workspace test suite (Track 0). Runs the workspace test suite
# on the self-hosted runner archbox at ~$0/min, for both the MSRV (1.95.0)
# and latest-stable toolchains. `dagger call test --rust=<tc>` does the full
# cargo build --all-features + the feature-scoped cargo test invocations + doctests,
# reusing the box's cargo/target/sccache cache volumes (warm = fast).
#
# Testcontainers-backed tests (storage/functions lib + fraiseql-wire tests/*) are
# skipped here — the engine has no Docker socket. Dagger-native service bindings
# restore the database-backed suites; see dagger-integration.yml.
#
# Runs on a push to every in-repo branch, not only `dev` (#1257). It used to be
# `branches: [dev]`, on the reasoning that the heavy legs belong post-merge to
# spare the single runner — but that left NO gate executing the Rust test suite
# before a merge: `make preflight` and the `Dagger — preflight` leg compile the
# tests (`--all-targets`) without running them, and the branch legs do not
# contain them. A merge to `dev` was the first execution of the workspace suite
# against the code being merged, which is how `231c3a25c` landed green and
# reddened this leg on `config_coverage_manifest_test`.
#
# The fast-forward to `dev` pushes the identical SHA, and the `already-passed` job
# skips the leg there when the branch run passed — Dagger's exec cache did NOT
# replay it (measured: a full second run). What remains is runner occupancy on
# intermediate branch pushes — `cancel-in-progress` keeps only the head of each ref.
#
# push-only (maintainer-controlled). fraiseql/fraiseql is PUBLIC, so a self-hosted
# runner must NOT execute fork `pull_request` code — NO pull_request trigger here.
# `dependabot/**` is excluded for the same reason as in dagger-preflight.yml:
# Dependabot's degraded token cannot pull the private ghcr base image.
on:
  push:
    branches-ignore: ['dependabot/**', 'gh-readonly-queue/**']
  workflow_dispatch:

# packages: read lets the runner pull the private ghcr.io/fraiseql/* base-image
# mirror (.github/workflows/mirror-base-images.yml); contents: read for checkout.
permissions:
  contents: read
  packages: read
  # actions: read lets already-passed.yml see this workflow's earlier runs.
  actions: read

concurrency:
  group: dagger-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Skips the leg when this SHA already passed it — the fast-forward to `dev`
  # pushes a commit its branch push just tested. See already-passed.yml.
  already-passed:
    name: already passed
    uses: ./.github/workflows/already-passed.yml
    with:
      workflow: dagger-test.yml

  test:
    needs: already-passed
    if: ${{ !cancelled() && needs.already-passed.outputs.passed != 'true' }}
    name: test (${{ matrix.rust }})
    # archbox only: on forge this leg runs 2-3x slower (test (msrv) ~85 min
    # against a 90 min cap), and pinning it keeps one Dagger cache warm for it.
    runs-on: [self-hosted, archbox]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, msrv]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      # The Dagger engine pulls the private ghcr.io/fraiseql/* base images via the
      # host's docker credentials; authenticate with the job's GITHUB_TOKEN first.
      - name: Log in to ghcr.io (private base-image mirror)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: dagger call test --rust=${{ matrix.rust }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          dagger version
          dagger call test --source=. --rust=${{ matrix.rust }}

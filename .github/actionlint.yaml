# actionlint configuration — registers the custom self-hosted runner labels so
# the `runner-label` lint accepts them. Add an entry here when a runner gains a
# label that a workflow targets.
self-hosted-runner:
  labels:
    # Shared by every self-hosted runner (archbox and forge): a job on this
    # label lands on whichever box is free.
    - fraiseql-8core
    # archbox only (i7-13700K). The heavy legs — test, feature matrix — pin here:
    # on forge (Xeon E5-1650 v4) they run 2-3x slower.
    - archbox
    # forge only (OVH, Xeon E5-1650 v4, 125 GiB).
    - forge

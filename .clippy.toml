# Clippy configuration for FraiseQL v2
# https://rust-lang.github.io/rust-clippy/master/index.html#configuration

# Large stack arrays: raised from 16 KiB to 64 KiB because criterion's benchmark
# scaffolding generates arrays with no source span (clippy bug); no real oversized
# stack allocation exists in production code.
array-size-threshold = 65536
# Cognitive complexity threshold
cognitive-complexity-threshold = 30
# Documentation
doc-valid-idents = [
  "FraiseQL",
  "GraphQL",
  "PostgreSQL",
  "MySQL",
  "SQLite",
  "SQLServer",
  "JSON",
  "JSONB",
  "UUID",
  "CDC",
  "APQ",
  "RBAC",
  "JWT",
  "OAuth",
  "OpenAPI",
]
# Enum variant names
enum-variant-name-threshold = 3
max-fn-params-bools = 3
# Maximum allowed struct fields
max-struct-bools = 3
# Single char bindings
single-char-binding-names-threshold = 4
# Too many arguments
too-many-arguments-threshold = 7
# Too many lines
too-many-lines-threshold = 300
# Type complexity
type-complexity-threshold = 500
# Verbose bit mask
verbose-bit-mask-threshold = 1
# A test capturing `tracing` output installs its subscriber through
# `fraiseql_test_support::tracing_capture`, never `tracing::subscriber` directly (#1703).
#
# `tracing` caches each callsite's interest process-wide when the callsite is first
# reached. While exactly one dispatcher is registered (tracing-core's `has_just_one`),
# that interest is computed from the REACHING thread's default, not from the registered
# dispatchers. So when a test's scoped subscriber is the only one alive, another test's
# thread with no subscriber (one booting a server, say) can reach the same `warn!` first
# and cache `Interest::never` for it: the capturing test then receives nothing and fails
# with an empty capture, at random, only in a shared-process `cargo test` run. The
# wrappers keep a second dispatcher alive for the life of the process, so the registered
# dispatchers, the capture among them, are always the ones asked.
disallowed-methods = [
  { path = "tracing::subscriber::with_default", reason = "use fraiseql_test_support::tracing_capture::with_default, which a parallel test cannot blind" },
  { path = "tracing::subscriber::set_default", reason = "use fraiseql_test_support::tracing_capture::set_default, which a parallel test cannot blind" },
]

# Clippy configuration for FraiseQL v2
# https://rust-lang.github.io/rust-clippy/master/index.html#configuration

# Large stack arrays: raised from 16 KiB to 64 KiB because criterion's benchmark
# scaffolding generates arrays with no source span (clippy bug); no real oversized
# stack allocation exists in production code.
array-size-threshold = 65536
# Cognitive complexity threshold
cognitive-complexity-threshold = 30
# Documentation
doc-valid-idents = [
  "FraiseQL",
  "GraphQL",
  "PostgreSQL",
  "MySQL",
  "SQLite",
  "SQLServer",
  "JSON",
  "JSONB",
  "UUID",
  "CDC",
  "APQ",
  "RBAC",
  "JWT",
  "OAuth",
  "OpenAPI",
]
# Enum variant names
enum-variant-name-threshold = 3
max-fn-params-bools = 3
# Maximum allowed struct fields
max-struct-bools = 3
# Single char bindings
single-char-binding-names-threshold = 4
# Too many arguments
too-many-arguments-threshold = 7
# Too many lines
too-many-lines-threshold = 300
# Type complexity
type-complexity-threshold = 500
# Verbose bit mask
verbose-bit-mask-threshold = 1
# A test capturing `tracing` output installs its subscriber through
# `fraiseql_test_support::tracing_capture`, never `tracing::subscriber` directly (#1703).
#
# `tracing` caches each callsite's interest process-wide when the callsite is first
# reached. While exactly one dispatcher is registered (tracing-core's `has_just_one`),
# that interest is computed from the REACHING thread's default, not from the registered
# dispatchers. So when a test's scoped subscriber is the only one alive, another test's
# thread with no subscriber (one booting a server, say) can reach the same `warn!` first
# and cache `Interest::never` for it: the capturing test then receives nothing and fails
# with an empty capture, at random, only in a shared-process `cargo test` run. The
# wrappers keep a second dispatcher alive for the life of the process, so the registered
# dispatchers, the capture among them, are always the ones asked.
#
# A mutation reaches the database through the engine's chokepoint, `execute_mutation_impl`,
# where every gate on a write runs (#1327): the Authorizer, requires_role, requires_actor,
# argument and selection validation, the change-log write and the before:mutation chain.
# So nothing else calls the adapter's write. The lint resolves the call, so an import
# alias, a `Writer::execute_write(..)` spelling or a function pointer is caught as a method
# call is (#1780). The chokepoint and the cache wrapper below it carry the production
# `#[allow]`s; tests that drive an adapter's write carry one per function.
# `fraiseql-db`'s `traits/write_ban_tests.rs` keeps these two paths resolving: a path that
# stops resolving is only a configuration warning, and the ban would be silently gone.
disallowed-methods = [
  { path = "fraiseql_core::graphql::document::parse", reason = "call fraiseql_core::graphql::parse_graphql_document: it guards the parser and shares one parse per request" },
  { path = "fraiseql_db::traits::Writer::execute_write", reason = "a write goes through the engine (Executor::execute*, which reaches execute_mutation_impl), where every gate on a mutation runs" },
  { path = "fraiseql_db::traits::Writer::execute_writes", reason = "a write goes through the engine (Executor::execute*, which reaches execute_mutation_impl), where every gate on a mutation runs" },
  { path = "tracing::subscriber::with_default", reason = "use fraiseql_test_support::tracing_capture::with_default, which a parallel test cannot blind" },
  { path = "tracing::subscriber::set_default", reason = "use fraiseql_test_support::tracing_capture::set_default, which a parallel test cannot blind" },
]

# A client controls the GraphQL document, so the parser is attack surface: graphql-parser
# 0.4 panicked on a 27-byte document (#976), and six sites parsed then, one through a
# module import the obvious grep missed. One site parses now. `graphql/document.rs`
# builds the only `apollo_parser::Parser` and converts its tree into fraiseql's own
# `Document`, and `complexity.rs`'s `parse_graphql_document`, the panic guard and the
# request's shared parse, is the only caller of `document::parse` (banned above). Tests
# that parse directly carry an `#[allow]` per function. The other GraphQL parser crates
# are refused in deny.toml, since a ban on a crate that is not a dependency is inert here.
# `fraiseql-core`'s `graphql/parse_ban_tests.rs` keeps these paths resolving.
disallowed-types = [
  { path = "apollo_parser::Parser", reason = "read a document through fraiseql_core::graphql::parse_graphql_document and walk its graphql::document::Document" },
  # A read consults the policy the deployment configured, `RuntimeConfig.rls_policy`, and
  # never builds one (#1348): both gRPC read arms built `DefaultRLSPolicy` themselves, so a
  # configured policy was never applied there and a deployment with none got a filter no
  # other transport applied. Every construction names its type, since `NoRLSPolicy` is not a
  # unit value and `DefaultRLSPolicy` admits no literal outside its module, so the ban sees
  # them all, inside fraiseql-core too. `rls_policy.rs` defines them; each test that builds
  # one to pass in carries an `#[allow]`. `security/rls_policy_ban_tests.rs` keeps the paths
  # resolving.
  { path = "fraiseql_core::security::DefaultRLSPolicy", reason = "consult the policy the deployment configured, RuntimeConfig.rls_policy, with None meaning no row filter; a policy built here is not the one in force" },
  { path = "fraiseql_core::security::NoRLSPolicy", reason = "consult the policy the deployment configured, RuntimeConfig.rls_policy, with None meaning no row filter; a policy built here is not the one in force" },
  { path = "fraiseql_core::security::CompiledRLSPolicy", reason = "consult the policy the deployment configured, RuntimeConfig.rls_policy, with None meaning no row filter; a policy built here is not the one in force" },
]

# Integration test infrastructure for fraiseql
#
# All backing-service ports are bound to 127.0.0.1 so the test databases remain
# reachable from the host (CI runners and local `cargo test`) without being
# exposed to the network. The credentials below are throwaway CI/test fixtures.
#
# Usage:
#   docker compose -f docker/docker-compose.test.yml up -d
#   cargo test --features test-postgres -p fraiseql-core -- db::postgres
#   cargo test --features "postgres,dedup,caching,testing" -p fraiseql-observers --test integration_test
#   docker compose -f docker/docker-compose.test.yml down -v

services:
  postgres-test:
    # pgvector/pgvector:pg16 = the official postgres:16 (bookworm) image plus the
    # pgvector extension, which the #386 vector-similarity suites CREATE and
    # execute against. Matches CI's `ghcr.io/fraiseql/pgvector:pg16` mirror.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: test_fraiseql
      POSTGRES_USER: fraiseql_test
      POSTGRES_PASSWORD: fraiseql_test_password
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      # The SAME files the Dagger `pgService` mounts (.dagger/main.go). They used
      # to be a local twin, `./init/postgres-test.sql`, and the two had drifted
      # structurally: the twin seeded `users`/`posts` with `v_user AS SELECT data
      # FROM users`, while CI seeded `tb_user`/`tb_post` with `v_user AS SELECT
      # id, data FROM tb_user`. Same view name, same `public` schema, different
      # shape — so a fixture assertion could only ever hold on one rig, and
      # `seed_fixture_integrity` (#936) was green locally and red in CI. One
      # owner, mounted by both, is the fix; ordering matches CI's numeric prefixes.
      - ../tests/sql/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
      - ../tests/sql/postgres/init-analytics.sql:/docker-entrypoint-initdb.d/01-init-analytics.sql:ro
      # Physical streaming replication for postgres-standby-test (#957). Same
      # file the Dagger `pgService` mounts.
      - ./init/postgres-replication-init.sh:/docker-entrypoint-initdb.d/02-replication.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraiseql_test -d test_fraiseql"]
      interval: 5s
      timeout: 3s
      retries: 5

  # A REAL streaming standby of postgres-test, for the read-replica bounded-
  # staleness suite (#957). Distinct from the pre-existing replica stand-in,
  # which is a second independent database on postgres-test: that shape shows
  # *which* server answered a read but reports no replication lag at all
  # (`pg_is_in_recovery()` is false there), so `max_lag_ms` could only ever be
  # proven against a server incapable of being stale.
  #
  # The suite induces lag deterministically with `pg_wal_replay_pause()`, which
  # is why the standby streams through a replication slot — see the entrypoint.
  postgres-standby-test:
    image: pgvector/pgvector:pg16
    depends_on:
      postgres-test:
        condition: service_healthy
    user: postgres
    environment:
      PGPASSWORD: fraiseql_repl_password
      PRIMARY_HOST: postgres-test
      PRIMARY_USER: fraiseql_test
      PRIMARY_PASSWORD: fraiseql_test_password
      PRIMARY_DB: test_fraiseql
    entrypoint: ["/bin/bash", "/standby-entrypoint.sh"]
    volumes:
      - ./init/postgres-standby-entrypoint.sh:/standby-entrypoint.sh:ro
    ports:
      # 5434 is VelocityBench's postgres and 5435 is postgres-tls-test.
      - "127.0.0.1:5436:5432"
    healthcheck:
      # `-d test_fraiseql` deliberately: a standby accepts connections a moment
      # before it finishes reaching a consistent recovery state, and until then
      # connecting to a database fails with "the database system is starting up".
      test: ["CMD-SHELL", "pg_isready -U fraiseql_test -d test_fraiseql"]
      interval: 5s
      timeout: 3s
      retries: 20

  # A SECOND standby, which exists to be destroyed: the #957 failover test calls
  # `pg_promote()` on it, and a promoted standby never goes back. Sharing
  # postgres-standby-test would leave the bounded-staleness tests running against
  # a writable server or not, depending on which test libtest happened to run
  # first — a rig whose meaning depends on test ordering is not a rig.
  postgres-failover-test:
    image: pgvector/pgvector:pg16
    depends_on:
      postgres-test:
        condition: service_healthy
    user: postgres
    environment:
      PGPASSWORD: fraiseql_repl_password
      PRIMARY_HOST: postgres-test
      PRIMARY_USER: fraiseql_test
      PRIMARY_PASSWORD: fraiseql_test_password
      PRIMARY_DB: test_fraiseql
      REPLICATION_SLOT: fraiseql_failover
    entrypoint: ["/bin/bash", "/standby-entrypoint.sh"]
    volumes:
      - ./init/postgres-standby-entrypoint.sh:/standby-entrypoint.sh:ro
    ports:
      - "127.0.0.1:5437:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraiseql_test -d test_fraiseql"]
      interval: 5s
      timeout: 3s
      retries: 20

  # TLS-enabled PostgreSQL for the database-TLS suites (#801/#824). Deliberately a
  # separate service from postgres-test: the tests need one server that speaks TLS
  # *and* one that does not, since "require refuses a plaintext server" and
  # "verify-full rejects an untrusted certificate" are different assertions.
  # postgres:16 (bookworm) rather than -alpine: the init script needs openssl's
  # output, and alpine ships no openssl.
  postgres-tls-test:
    image: postgres:16
    environment:
      POSTGRES_DB: test_fraiseql
      POSTGRES_USER: fraiseql_test
      POSTGRES_PASSWORD: fraiseql_test_password
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - ./tls/certs:/tls-certs:ro
      - ./init/postgres-tls-init.sh:/docker-entrypoint-initdb.d/00-tls.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraiseql_test -d test_fraiseql"]
      interval: 5s
      timeout: 3s
      retries: 5

  # One-shot container that waits for SQL Server to be healthy, then seeds data
  redis-test:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # NATS with JetStream enabled — required for fraiseql-observers NATS transport tests
  nats-test:
    image: nats:2.10-alpine
    ports:
      - "127.0.0.1:4222:4222"   # NATS client port
      - "127.0.0.1:8222:8222"   # NATS monitoring HTTP port
    command: ["-js", "-m", "8222"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8222/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  # HashiCorp Vault (dev mode) — required for fraiseql-server secrets manager tests
  vault-test:
    image: hashicorp/vault:1.17
    ports:
      - "127.0.0.1:8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: fraiseql-test-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_LOG_LEVEL: warn
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD-SHELL", "vault status -address=http://localhost:8200 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

# Chapter 2: Fetching a Single Record
# Get a specific user by ID (IDs are UUIDs — copy one from ListAllUsers)

query GetUser($userId: ID!) {
  user(id: $userId) {
    id
    name
    email
    createdAt
  }
}

# Variables for this query:
# {
#   "userId": "00000000-0000-0000-0000-000000000000"
# }

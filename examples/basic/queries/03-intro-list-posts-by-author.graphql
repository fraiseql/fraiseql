# Chapter 3: Filtering
# Get all posts by a specific author. v_post denormalizes the author's
# identity into each post row (authorId / authorName / authorEmail).

query PostsByAuthor($authorId: ID!) {
  posts(where: { authorId: { eq: $authorId } }) {
    id
    title
    content
    authorName
    createdAt
  }
}

# Variables for this query:
# {
#   "authorId": "00000000-0000-0000-0000-000000000000"

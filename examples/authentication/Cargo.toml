[package]
name = "fraiseql-example-authentication"
version = "0.0.0"
edition = "2021"
publish = false
license.workspace = true
description = "Mint a token, validate it, and read the identity out of it"

# Illustrative code, not part of the shipped engine: these crates deliberately do
# not opt into `[lints] workspace = true`. They are workspace MEMBERS so that
# `cargo check --workspace --all-targets` and `cargo clippy --workspace` compile
# and lint them on every push — the async-jobs subgraph sat outside the workspace
# and lost its clippy gate for a whole release when ci.yml was retired (#951).

[[bin]]
name = "authentication"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
fraiseql-core = { workspace = true }
# The in-process ES256 issuer: a key generated at runtime and a JWKS served on
# loopback, so the example signs real tokens without committing a private key.
fraiseql-test-support = { path = "../../crates/fraiseql-test-support", features = [
  "test-issuer",
] }
serde_json = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true

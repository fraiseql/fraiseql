# FraiseQL v2 Multi-Tenant Example
#
# Shared core types + tenant-specific domains, with tenant isolation enforced
# where it can actually be enforced: in PostgreSQL, by Row-Level Security reading
# session variables FraiseQL sets from the caller's JWT.
#
# See README.md for the full JWT → session variable → RLS path, and
# sql/01_schema.sql for the policies. `make db-up && psql -f sql/01_schema.sql`
# reproduces it locally.

[database]
pool_max = 10
url = "postgresql://localhost/multitenant"

[domain_discovery]
enabled = true
root_dir = "schema"

[schema]
database_target = "postgresql"
description = "Multi-tenant application with shared core and isolated tenant domains"
name = "multitenant"
version = "1.0.0"

[security]
# Declares the deployment multi-tenant. This activates the subscription
# tenant fail-closed gate and the cache+RLS boot gate — with it set and
# `[security.rls]` absent, a cache-enabled server refuses to start rather than
# risk serving one tenant a cached response computed for another.
multi_tenant = true

# Declares that isolation is enforced by database Row-Level Security. FraiseQL
# does not author the policies (they live in sql/01_schema.sql), so at boot the
# server verifies the declaration against the live catalog: every relation a
# query reads must be an RLS-protected table or a `security_invoker` view, or
# the server refuses to start.
[security.rls]
enabled = true

# The mechanism the policies read. FraiseQL resolves each mapping from the
# request identity and applies it with `set_config(name, value, true)` — a
# transaction-scoped setting — before every query and mutation. The RLS policies
# then read it with `current_setting('app.tenant_id', true)`.
#
# There is no way to spoof these from the client: the value comes from the
# validated JWT, not from a header or a GraphQL variable.
[[session_variables.variables]]
claim = "organization_id"
name = "app.organization_id"
source = "jwt"

[[session_variables.variables]]
claim = "tenant_id"
name = "app.tenant_id"
source = "jwt"

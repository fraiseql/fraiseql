# FraiseQL v2 SaaS Platform Example
# Multi-tenant organization with domain-driven architecture

[database]
connect_timeout_ms = 30000
pool_max = 10
ssl_mode = "prefer"
url = "postgresql://localhost/saas"

# Auto-discover domains
[domain_discovery]
enabled = true
root_dir = "schema"

[schema]
database_target = "postgresql"
description = "SaaS platform with account management, billing, teams, and integrations"
name = "saas"
version = "1.0.0"

# Account isolation is enforced in PostgreSQL, by Row-Level Security reading the
# session variables FraiseQL sets from the caller's validated JWT. See README.md for
# the full path and sql/01_schema.sql for the policies.
[security]
default_policy = "authenticated"
# Every row in this schema belongs to exactly one account, so the deployment is
# multi-tenant. This activates the subscription tenant fail-closed gate and the
# cache+RLS boot gate.
multi_tenant = true

# The isolation is RLS. The server verifies this declaration against the live
# catalog at boot: each relation a query reads must be an RLS-protected table or a
# `security_invoker` view, or it refuses to start.
[security.rls]
enabled = true

# What the removed `[[security.rules]]` blocks pretended to do — "only account
# owners can modify Account", "only billing admins can manage Subscription" — is
# expressible here and enforced by the database. `app.account_id` scopes every read;
# `app.user_id` and `app.account_role` are what the write-side `WITH CHECK` policies
# in sql/01_schema.sql compare against.
[[session_variables.variables]]
claim = "account_id"
name = "app.account_id"
source = "jwt"

[[session_variables.variables]]
claim = "sub"
name = "app.user_id"
source = "jwt"

[[session_variables.variables]]
claim = "account_role"
name = "app.account_role"
source = "jwt"

# Not CI-verified. Nothing in CI brings this stack up, so it may have stopped
# working without anyone noticing — the state all six operator-facing stacks were
# in on 2026-08-28, none of which could serve a query. The one stack this
# repository does verify end to end is the root `docker-compose.yml`
# (tools/compose-stack-test.sh, a step on the `Dagger — image` leg).
#
services:
  # PostgreSQL for banking system
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: fraiseql
      POSTGRES_USER: fraiseql
      POSTGRES_PASSWORD: fraiseql123
    ports:
      - "5433:5432"  # Different port from saga-basic
    volumes:
      - ./fixtures/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_manual_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraiseql"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Bank Service (handles all transfer operations)
  bank-service:
    build:
      context: ./bank-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://fraiseql:fraiseql123@postgres:5432/fraiseql
      RUST_LOG: info
    ports:
      - "4004:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # curl is not in python:3.11-slim and this image never installs it, so a
      # `curl -f` probe failed at exec and the container stayed unhealthy forever
      # (#1073). The interpreter the image does have is enough. urlopen raises on
      # a non-2xx status, so the exit code carries the verdict.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Apollo Router (Gateway)
  apollo-router:
    image: ghcr.io/apollographql/router:v1.59.0
    environment:
      ROUTER_APOLLO_KEY: ${ROUTER_APOLLO_KEY:-}
    ports:
      - "4005:4000"
    volumes:
      - ./fixtures/supergraph.graphql:/etc/router/supergraph.graphql
      - ./fixtures/router.yaml:/etc/router/router.yaml
    depends_on:
      - bank-service
    command: --supergraph /etc/router/supergraph.graphql --config /etc/router/router.yaml

volumes:
  postgres_manual_data:

networks:
  default:
    name: fraiseql-manual-compensation

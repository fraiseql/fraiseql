# Apollo Router configuration.
#
# Every section this file used to carry beyond `supergraph:` was invented:
# `subgraphs:`, `server:`, `logging:`, `telemetry.instrumentation`,
# `telemetry.trace_config`, `traffic_shaping.router.rate_limit` and
# `traffic_shaping.all_subgraphs` are not keys the router has ever accepted. It
# refused to boot with "no valid configuration was supplied" and the container
# exited, so this stack could never serve a query (#1259). Repairing the
# supergraph was not enough to find that: `router --supergraph <file>` never
# reads `--config`, so the config had still never been loaded by any router.
#
# `router config upgrade` does not rescue these — it carries migrations for
# renamed keys, and these were never keys, so it returns them unchanged. The
# shape below is what `router config schema` (v1.59.0) accepts.
#
# Routing URLs are deliberately absent: they come from `@join__graph(url:)` in
# the supergraph, and `override_subgraph_url` is the key that overrides them.
supergraph:
  listen: 0.0.0.0:4000
  path: /graphql

health_check:
  listen: 0.0.0.0:8088
  path: /health

cors:
  # The subgraph stubs and the router are local to this stack; naming one origin
  # is clearer in an example than allowing any.
  origins:
    - http://localhost:4000

# Subgraph errors are redacted by default, which leaves a failing example
# reporting nothing an operator can act on. These three subgraphs are local
# stubs in this same stack, so surface what they say.
include_subgraph_errors:
  all: true

traffic_shaping:
  router:
    timeout: 30s
    global_rate_limit:
      capacity: 100
      interval: 1s
  all:
    timeout: 10s
    global_rate_limit:
      capacity: 100
      interval: 1s

services:
  # One PostgreSQL instance, three databases — one per subgraph's store.
  #
  # The saga pattern exists because there is no distributed transaction across
  # those stores; separate databases (not separate schemas) keep that honest,
  # since a single connection cannot span them. FraiseQL is PostgreSQL-only
  # since v2.15.0 (#374), and a `mysql://` DATABASE_URL is a boot refusal.
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: fraiseql
      POSTGRES_USER: fraiseql
      POSTGRES_PASSWORD: fraiseql123
    ports:
      - "5432:5432"
    volumes:
      - ./fixtures/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraiseql"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Users Subgraph Service — database `fraiseql` (saga coordination + users)
  users-service:
    build:
      context: ./users-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://fraiseql:fraiseql123@postgres:5432/fraiseql
      RUST_LOG: info
    ports:
      - "4001:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/graphql"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Orders Subgraph Service — database `fraiseql_orders`
  orders-service:
    build:
      context: ./orders-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://fraiseql:fraiseql123@postgres:5432/fraiseql_orders
      RUST_LOG: info
    ports:
      - "4002:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/graphql"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Inventory Subgraph Service — database `fraiseql_inventory`
  inventory-service:
    build:
      context: ./inventory-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://fraiseql:fraiseql123@postgres:5432/fraiseql_inventory
      RUST_LOG: info
    ports:
      - "4003:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/graphql"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Apollo Router (Gateway)
  apollo-router:
    image: ghcr.io/apollographql/router:latest
    environment:
      ROUTER_APOLLO_KEY: ${ROUTER_APOLLO_KEY:-}
    ports:
      - "4000:4000"
    volumes:
      - ./fixtures/supergraph.graphql:/etc/router/supergraph.graphql
      - ./fixtures/router.yaml:/etc/router/router.yaml
    depends_on:
      - users-service
      - orders-service
      - inventory-service
    command: --supergraph /etc/router/supergraph.graphql --config /etc/router/router.yaml

volumes:
  postgres_data:

networks:
  default:
    name: fraiseql-federation

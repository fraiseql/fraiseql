# Not CI-verified. Nothing in CI brings this stack up, so it may have stopped
# working without anyone noticing. The one stack this repository does verify end
# to end is the root `docker-compose.yml` (tools/compose-stack-test.sh, a step on
# the `Dagger — image` leg).
#
# Each service is a real directory with a Dockerfile and a server, rather than a
# heredoc inlined here. The inline version imported Flask on an image that does
# not have it and was never installed, so all five exited at the first import,
# and the `curl -f` healthchecks could not report it because that image has no
# curl either (#1193). These run on the standard library.
#
# `flight-service` is the saga coordinator; see its server.py.

services:
  flight-service:
    build: ./flight-service
    environment:
      PORT: "4000"
      HOTEL_URL: "http://hotel-service:4000"
      CAR_URL: "http://car-service:4000"
      PAYMENT_URL: "http://payment-service:4000"
      NOTIFICATION_URL: "http://notification-service:4000"
    ports:
      - "4001:4000"
    depends_on:
      hotel-service:
        condition: service_healthy
      car-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy

  hotel-service:
    build: ./hotel-service
    environment:
      PORT: "4000"
    ports:
      - "4002:4000"

  car-service:
    build: ./car-service
    environment:
      PORT: "4000"
    ports:
      - "4003:4000"

  payment-service:
    build: ./payment-service
    environment:
      PORT: "4000"
    ports:
      - "4004:4000"

  notification-service:
    build: ./notification-service
    environment:
      PORT: "4000"
    ports:
      - "4005:4000"

  apollo-router:
    image: ghcr.io/apollographql/router:v1.59.0
    ports:
      - "4000:4000"
    volumes:
      - ./fixtures/supergraph.graphql:/etc/router/supergraph.graphql
      - ./fixtures/router.yaml:/etc/router/router.yaml
    depends_on:
      flight-service:
        condition: service_healthy
      hotel-service:
        condition: service_healthy
      car-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    command: --supergraph /etc/router/supergraph.graphql --config /etc/router/router.yaml

  apollo-router:
    image: ghcr.io/apollographql/router:v1.59.0
    ports:
      - "4000:4000"
    volumes:
      - ./fixtures/supergraph.graphql:/etc/router/supergraph.graphql
      - ./fixtures/router.yaml:/etc/router/router.yaml
    depends_on:
      flight-service:
        condition: service_healthy
      hotel-service:
        condition: service_healthy
      car-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      notification-service:

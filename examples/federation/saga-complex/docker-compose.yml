# Not CI-verified. Nothing in CI brings this stack up, so it may have stopped
# working without anyone noticing — the state all six operator-facing stacks were
# in on 2026-08-28, none of which could serve a query. The one stack this
# repository does verify end to end is the root `docker-compose.yml`
# (tools/compose-stack-test.sh, a step on the `Dagger — image` leg).
#
# The five subgraph stubs run on Python's standard library. They used to import
# Flask on `python:3.11-slim`, which does not have it, and nothing here installed
# it — so every one of them exited at the first import (#1193). The healthchecks
# could not report that, because they were `curl -f` and that image has no curl
# either (nor wget). Using the stdlib keeps the stack independent of a package
# index at container start.
#
# `version:` is deliberately absent — Compose has treated it as obsolete since
# v2 and warns on every invocation when it is present.

services:
  flight-service:
    image: python:3.11-slim
    working_dir: /app
    entrypoint: /bin/sh
    command:
      - -c
      - |
        python3 << 'EOF'
        import json
        from http.server import BaseHTTPRequestHandler, HTTPServer

        PAYLOAD = {"data": {"reserveFlight": {"flightId": "f-123", "status": "reserved"}}}

        class Handler(BaseHTTPRequestHandler):
            protocol_version = "HTTP/1.1"

            def _reply(self, code, body, ctype="application/json"):
                raw = body.encode()
                self.send_response(code)
                self.send_header("Content-Type", ctype)
                self.send_header("Content-Length", str(len(raw)))
                self.end_headers()
                self.wfile.write(raw)

            def do_POST(self):
                self.rfile.read(int(self.headers.get("Content-Length") or 0))
                if self.path == "/graphql":
                    self._reply(200, json.dumps(PAYLOAD))
                else:
                    self._reply(404, '{"errors":[{"message":"not found"}]}')

            def do_GET(self):
                if self.path == "/health":
                    self._reply(200, "OK", "text/plain")
                else:
                    self._reply(404, '{"errors":[{"message":"not found"}]}')

            def log_message(self, *args):
                pass

        HTTPServer(("0.0.0.0", 4000), Handler).serve_forever()
        EOF
    ports:
      - "4001:4000"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - |
          import sys, urllib.request
          sys.exit(0 if urllib.request.urlopen(
              "http://localhost:4000/health", timeout=3).status == 200 else 1)
      interval: 10s
      timeout: 5s
      retries: 5


schema
  @link(url: "https://specs.apollo.dev/link/v1.0")
  @link(url: "https://specs.apollo.dev/join/v0.3", for: EXECUTION)
{
  query: Query
  mutation: Mutation
}

type Query
  @join__type(graph: FLIGHT)
  @join__type(graph: HOTEL)
  @join__type(graph: CAR)
{
  flight(id: ID!): Flight @join__field(graph: FLIGHT)
  hotel(id: ID!): Hotel @join__field(graph: HOTEL)
  car(id: ID!): Car @join__field(graph: CAR)
}

type Mutation
  @join__type(graph: FLIGHT)
{
  bookTravel(userId: ID!, flightId: ID!, hotelId: ID!, carId: ID!): Booking! @join__field(graph: FLIGHT)
}

type Flight @join__type(graph: FLIGHT, key: "id") {
  id: ID!
  departure: String!
  arrival: String!
  price: Float!
}

type Hotel @join__type(graph: HOTEL, key: "id") {
  id: ID!
  name: String!
  location: String!
  price: Float!
}

type Car @join__type(graph: CAR, key: "id") {
  id: ID!
  type: String!
  location: String!
  price: Float!
}

type Reservation @join__type(graph: FLIGHT) {
  type: String!
  id: ID!
  status: String!
}

type Booking @join__type(graph: FLIGHT) {
  bookingId: ID!
  """`confirmed`, or `rolled_back` when a step failed and the earlier ones were compensated."""
  status: String!
  """Why the saga rolled back. Null on a confirmed booking."""
  reason: String
  """The steps that succeeded, in the order they were taken."""
  reservations: [Reservation!]!
  """One line per compensating action, in the order they ran — reverse of the reservations."""
  compensations: [String!]!
}

directive @join__enumValue(graph: join__Graph!) repeatable on ENUM_VALUE
directive @join__field(graph: join__Graph, requires: join__FieldSet, provides: join__FieldSet, type: String, external: Boolean, override: String, usedOverridden: Boolean) repeatable on FIELD_DEFINITION | INPUT_FIELD_DEFINITION
directive @join__graph(name: String!, url: String!) on ENUM_VALUE
directive @join__implements(graph: join__Graph!, interface: String!) repeatable on OBJECT | INTERFACE
directive @join__type(graph: join__Graph!, key: join__FieldSet, extension: Boolean! = false, resolvable: Boolean! = true, isInterfaceObject: Boolean! = false) repeatable on OBJECT | INTERFACE | UNION | ENUM | INPUT_OBJECT | SCALAR
directive @join__unionMember(graph: join__Graph!, member: String!) repeatable on UNION
directive @link(url: String, as: String, for: link__Purpose, import: [link__Import]) repeatable on SCHEMA

scalar join__FieldSet
scalar link__Import

enum link__Purpose {
  """`SECURITY` features provide metadata necessary to securely resolve fields."""
  SECURITY
  """`EXECUTION` features provide metadata necessary for operation execution."""
  EXECUTION
}

enum join__Graph {
  FLIGHT @join__graph(name: "flight" url: "http://flight-service:4000/graphql")
  HOTEL @join__graph(name: "hotel" url: "http://hotel-service:4000/graphql")
  CAR @join__graph(name: "car" url: "http://car-service:4000/graphql")
  PAYMENT @join__graph(name: "payment" url: "http://payment-service:4000/graphql")
  NOTIFICATION @join__graph(name: "notification" url: "http://notification-service:4000/graphql")
}

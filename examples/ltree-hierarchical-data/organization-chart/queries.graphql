# Organization Chart — query examples
#
# Every query here runs against the schema in schema.py and the data in
# setup.sql. `org_path` is the management chain, so the ltree operators answer
# organizational questions directly.
#
# Operator names are the engine's: descendantOf (<@), ancestorOf (@>),
# depthEq (nlevel =), eq. They are declared in schema.py's OrgPathFilter rather
# than derived — FraiseQL does not auto-derive the ltree family onto a field.

# Everyone, with their manager denormalized into the row.
query GetAllEmployees {
  employees {
    id
    name
    title
    department
    orgPath
    managerName
  }
}

# The whole subtree under the CTO, at any depth. Returns 9 with setup.sql's data.
query GetEveryoneUnderTheCTO {
  employees(where: {
    orgPath: { descendantOf: "acme.alice_johnson.bob_smith" }
  }) {
    name
    title
    orgPath
  }
}

# Direct reports only: descendants of the VP Engineering that sit exactly one
# level below them. The VP is at depth 4, so their reports are at depth 5.
query GetDirectReportsOfTheVP {
  employees(where: {
    orgPath: {
      descendantOf: "acme.alice_johnson.bob_smith.david_wilson"
      depthEq: 5
    }
  }) {
    name
    title
  }
}

# A management chain: every ancestor of one employee, from the CEO down.
# Returns Alice Johnson, Bob Smith, David Wilson, Eva Garcia, Frank Miller.
query GetManagementChain($employeePath: LTree!) {
  employees(where: { orgPath: { ancestorOf: $employeePath } }) {
    name
    title
    orgPath
  }
}

# One organizational layer: everyone reporting directly to the CEO.
query GetExecutiveTeam {
  employees(where: { orgPath: { depthEq: 3 } }) {
    name
    title
    department
  }
}

# Hierarchy and an ordinary column together.
query GetEngineersUnderTheCTO {
  employees(where: {
    orgPath: { descendantOf: "acme.alice_johnson.bob_smith" }
    department: {eq: "Engineering"}
  }) {
    name
    title
    salary
  }
}

# Exact position.
query GetEmployeeAtPath {
  employees(where: {
    orgPath: { eq: "acme.alice_johnson.bob_smith.david_wilson.eva_garcia" }
  }) {
    name
    title
    managerName
  }
}

# By id.
query GetEmployee {
  employee(id: "33333333-0000-4000-8000-000000000006") {
    name
    title
    orgPath
    managerName
    hireDate
  }
}

# Product Catalog — query examples
#
# Every query here runs against the schema in schema.py and the data in
# setup.sql. `category_path` places each product in the category tree, so the
# ltree operators answer taxonomy questions directly.
#
# Operator names are the engine's: descendantOf (<@), ancestorOf (@>),
# depthEq (nlevel =), eq. They are declared in schema.py's CategoryPathFilter
# rather than derived — FraiseQL does not auto-derive the ltree family.

# Everything.
query GetAllProducts {
  products {
    id
    name
    price
    categoryPath
    sku
    inStock
  }
}

# Everything under Electronics, at any depth. Returns 6 with setup.sql's data.
query GetElectronics {
  products(where: {
    categoryPath: { descendantOf: "electronics" }
  }) {
    name
    price
    categoryPath
  }
}

# A narrower branch: laptops and desktops. Returns 2.
query GetComputers {
  products(where: {
    categoryPath: { descendantOf: "electronics.computers" }
  }) {
    name
    price
    categoryPath
  }
}

# One shelf, exactly.
query GetAppleLaptops {
  products(where: {
    categoryPath: { eq: "electronics.computers.laptops.apple" }
  }) {
    name
    price
    sku
  }
}

# Everything sitting at a given depth in the tree. Returns 21.
query GetProductsAtDepthFour {
  products(where: { categoryPath: { depthEq: 4 } }) {
    name
    categoryPath
  }
}

# Parameterized branch query.
query GetBranch($branch: LTree!) {
  products(where: { categoryPath: { descendantOf: $branch } }) {
    name
    price
    categoryPath
  }
}

# Hierarchy and an ordinary column together.
query GetLegoInToys {
  products(where: {
    categoryPath: { descendantOf: "toys" }
    sku: { contains: "LEGO" }
  }) {
    name
    sku
    price
  }
}

# By id.
query GetProduct($id: ID!) {
  product(id: $id) {
    name
    description
    price
    categoryPath
    inStock
  }
}

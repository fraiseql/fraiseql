# Rover supergraph composition config.
#
# `make supergraph` runs
# `rover supergraph compose --config router/supergraph.yaml` on the HOST, and
# rover fetches each subgraph's SDL itself. That is why the two URLs per subgraph
# differ, and the difference is load-bearing (#1053):
#
#   routing_url  — who calls it: the ROUTER, from inside the compose network,
#                  so it must be the compose service name.
#   subgraph_url — who calls it: ROVER, from the host, so it must be the
#                  published port. `fraiseql` and `subgraph` do not resolve
#                  there; rover fails with a DNS error and composes nothing.
#
# If you move composition into the network (`docker compose run` a rover image),
# both URLs become the service names again.
#
# The two subgraphs:
#   - users : the FraiseQL (SQL-backed) service  -> owns User
#   - jobs  : the async-graphql service          -> owns enqueueJob / jobStatus
federation_version: =2.7.0
subgraphs:
  users:
    routing_url: http://fraiseql:8080/graphql
    schema:
      subgraph_url: http://localhost:8080/graphql
  jobs:
    routing_url: http://subgraph:4001/graphql
    schema:
      subgraph_url: http://localhost:4001/graphql

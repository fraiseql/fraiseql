# Runtime configuration for the FraiseQL subgraph.
#
# CORS is off because nothing reaches this service from a browser: the Apollo Router
# calls it server-to-server inside the compose network, and rover fetches its SDL from
# the host. That has to be said explicitly — the server runs in production mode unless
# FRAISEQL_ENV says otherwise, and production mode refuses to boot with CORS enabled and
# no origin list, since that would accept requests from any origin:
#
# Error: cors_enabled is true but cors_origins is empty in production mode.
#
# A browser-facing deployment sets `cors_origins = ["https://app.example.com"]` instead.
# Do not "fix" this by setting FRAISEQL_ENV=development; that turns the whole production
# check set off, not just this one.

cors_enabled = false

# rover fetches the subgraph SDL (`{ _service { sdl } }`) from the host with no
# credential, and this example configures no authentication, so the SDL is served to
# anyone. The default refuses it to an anonymous caller. A deployment either gives the
# gateway a credential (a service account on `x-api-key`) or composes offline from the
# artifact with `fraiseql federation sdl schema.compiled.json`, and leaves this unset.
service_sdl_require_auth = false

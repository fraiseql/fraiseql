# FraiseQL-side configuration for the async-jobs federation example.
#
# This makes the FraiseQL service an Apollo Federation v2 *subgraph*: it exposes
# its own subgraph SDL (at /__subgraph_schema) and declares the entities it
# owns. Composition with the async-jobs subgraph happens at the router (see
# ../router/), not here — FraiseQL is a subgraph, not a gateway.

[database]
pool_max = 5
url = "${DATABASE_URL}"

# Federation: this service participates as a subgraph named "users".
[federation]
enabled = true
service_name = "users"
version = "v2"

# Entities this subgraph owns and their key fields.
[[federation.entities]]
key_fields = ["id"]
name = "User"

# The operations this subgraph serves. Types come from `types.json` (authored in
# schema.py); queries bind them to a SQL relation here. Both halves are required:
# a federation entity whose type has no source is refused at compile time, which
# is what a TOML-only compile of this file used to hit.
[queries.user]
args = [{name = "id", required = true, type = "ID"}]
description = "Fetch a single user by ID."
return_type = "User"
sql_source = "v_user"

[queries.users]
description = "List all users."
return_array = true
return_type = "User"
sql_source = "v_user"

[schema]
database_target = "postgresql"
description = "SQL-backed half of the async-jobs federation example (issue #170)"
name = "async-jobs-fraiseql-side"
version = "0.1.0"

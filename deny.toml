# FraiseQL dependency policy
# Run: cargo deny check
# Skip entries last reviewed: 2026-05-19
#
# Pending resolution (tracked with deadlines in the [advisories] section):
# - rustls 0.21  — aws-sdk-s3 and aws-sdk-kinesis (both optional features) transitively
# require it; EOL dependency. Blocked on a custom hyper-rustls 0.27 HttpClient — tracked
# as #1111, since no aws-* version bump or feature selection resolves it.
# Re-evaluate by: 2026-12-01
# - sqlx 0.8     — sqlx 0.9.0 is alpha as of 2026-04-25; upgrade when stable.
# Was recorded as resolving RUSTSEC-2023-0071 (rsa Marvin Attack "via mysql_async"), but that
# path no longer exists — rsa now arrives via jsonwebtoken in the default build (#1110).
# Re-evaluate by: 2026-10-01
# - thiserror 1.x — graphql-parser 0.4 pins thiserror 1.x; blocked on upstream update.
# Re-evaluate by: 2026-12-01 — migrate off graphql-parser if still blocked.
#
# See docs/dependency-risk-policy.md for the full acceptance policy.

[advisories]
db-path = "~/.cargo/advisory-db"
ignore = [
  # rsa: Marvin Attack — no upstream fix. Resolution path: upgrade sqlx to 0.9+ when released.
  # ⚠ JUSTIFICATION UNDER REVIEW (#1110). The recorded grounds — "transitive via sqlx-mysql,
  # optional feature only; mysql feature is non-default" — are false as of 2026-08-13:
  # `cargo tree -i sqlx-mysql --all-features` prints nothing (MySQL left with #374), and rsa
  # is reached via jsonwebtoken 10.4 in the DEFAULT build, where
  # fraiseql-auth's generate_rs256_token() signs access tokens with an RSA PRIVATE key
  # (session_postgres.rs:175) — an attacker-triggerable private-key operation, which is the
  # shape Marvin targets. Acceptance left standing (there is no fixed rsa release either way),
  # but it must be re-argued on the real path rather than re-approved on this text.
  # deadline: 2026-10-01 — re-evaluate sqlx 0.9 release status and resolve #1110.
  {id = "RUSTSEC-2023-0071", reason = "No fixed rsa release. Recorded mysql-feature justification is stale — real path is jsonwebtoken in the default build; under review in #1110. Deadline 2026-10-01."},
  # rustls-pemfile: blocked on upstream bollard migration from pem 0.x to rustls-pem.
  # Re-evaluated 2026-07-02: rustls-pemfile 2.2.0 is a DEV-dependency only (fraiseql-wire
  # test deps / bollard test infra) — no production runtime exposure; low-severity
  # deprecated/unmaintained-crate advisory. bollard 0.20 still pins pem 0.x upstream.
  # deadline: 2026-10-01 — re-check bollard release cadence at the next dep sweep; drop
  # bollard or migrate off rustls-pemfile if still blocked.
  {id = "RUSTSEC-2025-0134", reason = "rustls-pemfile deprecated-crate advisory; DEV-dependency only (fraiseql-wire test deps / bollard), no production exposure; deadline 2026-10-01"},
  # rustls-webpki name-constraint bugs; transitive via aws-smithy-http-client (rustls 0.21).
  # Affects the OPT-IN aws-* features only — `aws-s3` (fraiseql-storage/fraiseql-server) and,
  # since #975, `cdc-kinesis` (fraiseql-cdc-sinks). Neither is in the default build, so there is
  # no exploit path in a default configuration.
  # 2026-06-11 spike: aws-config's HTTP-client features (default-https-client / client-hyper /
  # rustls) ALL route to aws-smithy-runtime's legacy rustls-0.21 connector (legacy-rustls-ring);
  # no clean feature selects rustls 0.23 — the modern client needs a code-level HttpClient swap
  # or an aws-* version bump. 2026-06-14: the Phase 12 deps-hygiene pass DEFERRED this fix —
  # it is real engineering (custom hyper-rustls 0.27 HttpClient), out of scope for a hygiene
  # phase and non-urgent (opt-in feature, no default-build exposure). Tracked as a standalone
  # aws-stack rustls-0.23 migration.
  # 2026-08-12 (#975): re-checked against the coordinated aws-* bump that Kinesis required
  # (aws-sdk-kinesis 1.112, aws-config 1.10.1, aws-smithy-http-client 1.3.0). rustls 0.21.12 is
  # STILL what aws-smithy-http-client pulls, so the bump does not resolve these and the ignores
  # remain load-bearing.
  # 2026-08-13 re-assessment (#1103), against this tree, extending the deadline deliberately:
  #   * Path re-verified: rustls 0.21.12 ← aws-smithy-http-client 1.3.0 ← aws-smithy-runtime
  #     1.13.1 ← aws-config 1.10.1 ← fraiseql-cdc-sinks / fraiseql-storage.
  #   * Non-default re-verified by construction, not by assertion: `cargo tree -i rustls@0.21.12`
  #     on the DEFAULT feature set reports "did not match any packages"; the crate appears only
  #     under --all-features. `aws-s3` and `cdc-kinesis` are both opt-in
  #     (crates/fraiseql-server/Cargo.toml), so a default deployment cannot reach these bugs.
  #   * Severity in context: all three are certificate-VALIDATION defects in rustls-webpki,
  #     reachable only on a TLS handshake an aws-* client makes against a hostile or misissued
  #     chain — i.e. an operator who opted into S3 or Kinesis and whose AWS endpoint is already
  #     being impersonated. Not remotely triggerable by a FraiseQL client.
  #   * Ruled out, do not retry: the aws-* version bump. The #975 coordinated sweep moved
  #     aws-sdk-kinesis to 1.112, aws-config to 1.10.1, aws-sdk-s3 to 1.141 and
  #     aws-smithy-http-client to 1.3.0 — rustls 0.21.12 survived all of it. The 2026-06-11
  #     spike still holds: every aws-config HTTP-client feature (default-https-client /
  #     client-hyper / rustls) routes to aws-smithy-runtime's legacy-rustls-ring connector, and
  #     no clean feature selects rustls 0.23. The fix is a code-level custom hyper-rustls 0.27
  #     HttpClient, tracked separately as real engineering.
  # deadline: 2026-12-01 — deliberately STAGGERED off the 2026-10-01 cluster below. Five other
  # acceptances expire on 2026-10-01; sharing a sixth would make one day on which every open
  # branch blocks at once, which is the failure mode this deadline exists to surface, not cause.
  # Enforcement is tools/check-deadlines.sh (preflight ShellGates) — cargo-deny has NO native
  # expiry field, so nothing else in the toolchain will ever notice these dates.
  {id = "RUSTSEC-2026-0098", reason = "rustls-webpki name-constraint URI bug; transitive via aws-smithy-http-client (rustls 0.21); opt-in aws-s3 and cdc-kinesis features only, absent from the default build. Re-assessed 2026-08-13, deadline 2026-12-01."},
  {id = "RUSTSEC-2026-0099", reason = "rustls-webpki wildcard name-constraint bug; same cause as RUSTSEC-2026-0098. Re-assessed 2026-08-13, deadline 2026-12-01."},
  # rustls-webpki 0.101.7: CRL parsing panic; transitive via aws-smithy-http-client (rustls 0.21).
  # Affects the opt-in aws-s3 and cdc-kinesis features only; same root cause as 0098/0099, and
  # covered by the same 2026-08-13 re-assessment recorded above.
  # deadline: 2026-12-01 — resolved when the aws-* stack reaches rustls 0.23.
  {id = "RUSTSEC-2026-0104", reason = "rustls-webpki 0.101.7 CRL panic; transitive via aws-smithy-http-client (rustls 0.21); opt-in aws-s3 and cdc-kinesis features only, absent from the default build. Re-assessed 2026-08-13, deadline 2026-12-01."},
  # quick-xml DoS pair (published 2026-07-02): RUSTSEC-2026-0194 (quadratic run time when checking
  # a start tag for duplicate attribute names) + RUSTSEC-2026-0195 (unbounded namespace-declaration
  # allocation in NsReader → memory-exhaustion DoS). Transitive ONLY via samael 0.0.21 (SAML SP,
  # #381), which is behind the opt-in `auth-saml` feature — NOT in the default build. samael pins
  # quick-xml 0.37.5 and `cargo update` cannot move it (the fix is in a later quick-xml outside
  # samael's range); a clean bump would need a samael update (0.0.21 is latest) or a risky [patch]
  # override. DoS is reachable only via malicious SAML XML at a SAML-enabled ACS endpoint.
  # deadline: 2026-10-01 — re-check samael release cadence; consider a [patch] to a patched
  # quick-xml (validating SAML parsing) or dropping samael.
  {id = "RUSTSEC-2026-0194", reason = "quick-xml quadratic duplicate-attribute-name check (DoS); transitive via samael (auth-saml opt-in only); samael pins quick-xml 0.37.5, no fix in range. Deadline 2026-10-01."},
  {id = "RUSTSEC-2026-0195", reason = "quick-xml unbounded namespace-declaration allocation in NsReader (memory-exhaustion DoS); same cause/path as RUSTSEC-2026-0194 (samael, auth-saml opt-in). Deadline 2026-10-01."},
  {id = "RUSTSEC-2026-0204", reason = "crossbeam-epoch 0.9.18 fmt::Pointer invalid-pointer dereference; only triggers when Debug/Pointer-formatting an invalid Atomic/Shared pointer, which FraiseQL never does. Transitive via rayon (criterion dev-deps). Deadline 2026-10-01."}
]
unmaintained = "workspace"

[bans]
multiple-versions = "deny"
wildcards = "allow"

# samael (SAML SP, #381) is an opt-in `auth-saml`-only dependency; its build/derive stack
# (derive_builder 0.20 → darling 0.20; bindgen → nom 7) and openssl-probe 0.1 pull older
# duplicate versions than the rest of the workspace. Pinned to the samael-side versions so
# only those exact duplicates are exempt; bump these if samael's tree moves.

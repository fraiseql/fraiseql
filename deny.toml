# FraiseQL dependency policy
# Run: cargo deny check
# Skip entries last reviewed: 2026-05-19
#
# Pending resolution (tracked with deadlines in the [advisories] section):
# - rustls 0.21  — aws-sdk-s3 and aws-sdk-kinesis (both optional features) transitively
# require it; EOL dependency. Blocked on a custom hyper-rustls 0.27 HttpClient — tracked
# as #1111, since no aws-* version bump or feature selection resolves it.
# Re-evaluate by: 2026-12-01
# - thiserror 1.x — graphql-parser 0.4 pins thiserror 1.x; blocked on upstream update.
# Re-evaluate by: 2026-12-01 — migrate off graphql-parser if still blocked.
# - h2 0.3      — hyper 0.14 (aws-smithy-http-client) pins it; RUSTSEC-2026-0258 has no 0.3-series
# fix, so this rides the same aws-stack blocker as rustls 0.21. The default build's h2 is 0.4.16
# and is NOT affected — the acceptance is scoped to h2@0.3.27 only.
# Re-evaluate by: 2026-12-01
#
# See docs/dependency-risk-policy.md for the full acceptance policy.

[advisories]
db-path = "~/.cargo/advisory-db"
ignore = [
  # rsa 0.9.10: Marvin Attack — a timing sidechannel in RSA PRIVATE-key operations. No fixed
  # release. Re-argued on the real path (#1110), 2026-10-04: rsa is in the default build via
  # jsonwebtoken 10.4's `rust_crypto` backend, where FraiseQL uses it to VERIFY RS256/384/512
  # tokens (OIDC, JWKS, `[auth]` public keys) — public-key work the advisory does not affect.
  # The one private-key operation left is the opt-in `gcs` storage backend signing its own
  # service-account assertion (Google requires RS256): server-initiated, cached, neither
  # triggerable nor timeable by a caller. The RS256 *signing* API (`with_rs256_key`,
  # `generate_rs256_token`), which no shipped path called, was removed so that no new
  # private-key path exists; tools/check-crypto-providers.sh fails on any RSA private key
  # outside gcs.rs. Not fixed by switching jsonwebtoken to `aws_lc_rs`: M-dual-crypto keeps
  # the default build on ring alone.
  # deadline: 2027-01-31 — check for a constant-time rsa release (0.10, crypto-bigint) and move to it.
  {id = "RUSTSEC-2023-0071", reason = "rsa used for RS256 public-key verification (unaffected) and GCS service-account signing only; no caller-triggerable private-key operation (#1110, gated by check-crypto-providers.sh). Deadline 2027-01-31."}
]
unmaintained = "workspace"

[bans]
multiple-versions = "deny"
wildcards = "allow"

# samael (SAML SP, #381) is an opt-in `auth-saml`-only dependency; its build/derive stack
# (derive_builder 0.20 → darling 0.20; bindgen → nom 7) and openssl-probe 0.1 pull older
# duplicate versions than the rest of the workspace. Pinned to the samael-side versions so
# only those exact duplicates are exempt; bump these if samael's tree moves.
[[bans.skip]]
name = "darling"
reason = "samael (#381 auth-saml) → derive_builder 0.20 → darling 0.20; workspace on 0.23"
version = "=0.20.11"

[[bans.skip]]
name = "darling_core"

# FraiseQL dependency policy
# Run: cargo deny check
# Skip entries last reviewed: 2026-05-19
#
# Pending resolution (tracked with deadlines in the [advisories] section):
# - rustls 0.21  — aws-sdk-s3 and aws-sdk-kinesis (both optional features) transitively
# require it; EOL dependency. Blocked on a custom hyper-rustls 0.27 HttpClient — tracked
# as #1111, since no aws-* version bump or feature selection resolves it.
# Re-evaluate by: 2026-12-01
# - thiserror 1.x — async-imap, async-nats, deno_ops, protobuf, serde_v8 and witx pin it
# (the GraphQL parser no longer does); blocked on those upstreams.
# Re-evaluate by: 2026-12-01
# - h2 0.3      — hyper 0.14 (aws-smithy-http-client) pins it; RUSTSEC-2026-0258 has no 0.3-series
# fix, so this rides the same aws-stack blocker as rustls 0.21. The default build's h2 is 0.4.16
# and is NOT affected — the acceptance is scoped to h2@0.3.27 only.
# Re-evaluate by: 2026-12-01
#
# See docs/dependency-risk-policy.md for the full acceptance policy.

[advisories]
db-path = "~/.cargo/advisory-db"
ignore = [
  # rsa 0.9.10: Marvin Attack — a timing sidechannel in RSA PRIVATE-key operations. No fixed
  # release. Re-argued on the real path (#1110), 2026-10-04: rsa is in the default build via
  # jsonwebtoken 10.4's `rust_crypto` backend, where FraiseQL uses it to VERIFY RS256/384/512
  # tokens (OIDC, JWKS, `[auth]` public keys) — public-key work the advisory does not affect.
  # The one private-key operation left is the opt-in `gcs` storage backend signing its own
  # service-account assertion (Google requires RS256): server-initiated, cached, neither
  # triggerable nor timeable by a caller. The RS256 *signing* API (`with_rs256_key`,
  # `generate_rs256_token`), which no shipped path called, was removed so that no new
  # private-key path exists; tools/check-crypto-providers.sh fails on any RSA private key
  # outside gcs.rs. Not fixed by switching jsonwebtoken to `aws_lc_rs`: M-dual-crypto keeps
  # the default build on ring alone.
  # deadline: 2027-01-31 — check for a constant-time rsa release (0.10, crypto-bigint) and move to it.
  # crypto-bigint 0.5.5: operations meant to be constant-time can branch on secrets. Fixed
  # only in 0.7.6; 0.5.5 is pinned by elliptic-curve 0.13 (ecdsa 0.16, p256, p384) under
  # jsonwebtoken 10.4, fraiseql-webhooks and aws-sigv4. Verifying ES256/384 tokens and
  # SendGrid signatures works on public values only. The secret-key sites: Apple sign-in's
  # client_secret (server-initiated, cached an hour, not caller-triggerable or timeable) and
  # S3 SigV4a for multi-region access points (whether to drop `sigv4a` is #1711).
  # deadline: 2027-01-31 — move to an elliptic-curve release on crypto-bigint 0.7.
  { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 under elliptic-curve 0.13: ES256/384 and webhook verification are public-key; secret-key use is Apple's cached client_secret and S3 SigV4a (#1711). No 0.5-series fix. Deadline 2027-01-31." },
  { id = "RUSTSEC-2023-0071", reason = "rsa used for RS256 public-key verification (unaffected) and GCS service-account signing only; no caller-triggerable private-key operation (#1110, gated by check-crypto-providers.sh). Deadline 2027-01-31." },
]
unmaintained = "workspace"

[bans]
multiple-versions = "deny"
wildcards = "allow"

# One GraphQL parser, read in one place (#976, #1780): `apollo-parser`, which only
# `fraiseql-core`'s `graphql/document.rs` constructs, as `.clippy.toml` holds. A clippy ban
# on a crate that is not a dependency is inert, so a second parser crate is refused here,
# before it is one.
deny = [
  { crate = "graphql-parser", reason = "the GraphQL parser is apollo-parser, read only through fraiseql_core::graphql::parse_graphql_document" },
  { crate = "cynic-parser", reason = "the GraphQL parser is apollo-parser, read only through fraiseql_core::graphql::parse_graphql_document" },
  { crate = "async-graphql-parser", reason = "the GraphQL parser is apollo-parser, read only through fraiseql_core::graphql::parse_graphql_document" },
]

# Every `[[bans.skip]]` and `[[bans.skip-tree]]` names its crate's semver-compatible line
# (`^48`, `^0.52`), not one release. Cargo holds at most one version per line of a
# registry crate, so the line names exactly the copy an exact pin would, and a patch or
# minor bump inside it changes nothing an entry exempts. Only a move to another line can
# change the duplicate set, and then the entry matches nothing: every call site passes
# `-D unmatched-skip-root -D unmatched-skip`, so the run fails there and the entry is
# reviewed when it can really change (#1849). An exact pin failed the run on every patch
# bump instead (#933, #1020).

# samael (SAML SP, #381) is an opt-in `auth-saml`-only dependency; its build/derive stack
# (derive_builder 0.20 → darling 0.20; bindgen → nom 7) and openssl-probe 0.1 pull older
# duplicate versions than the rest of the workspace. Pinned to the samael-side lines so
# only those duplicates are exempt; move these if samael's tree moves to another line.
